[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "understand-operator"
version = "0.1.0"
description = "AscendC operator knowledge-base plugin backed by codebase-memory-mcp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.scripts]
uo-prepare = "understand_operator.scripts.prepare_operator:main"
uo-review = "understand_operator.scripts.review_checkpoint:main"
uo-quality = "understand_operator.scripts.quality_gate:main"
uo-verify-subagents = "understand_operator.scripts.verify_required_subagents:main"
uo-prepare-fact-file = "understand_operator.scripts.prepare_fact_file:main"
uo-validate-candidate = "understand_operator.scripts.validate_candidate_batch:main"
uo-compile-candidate = "understand_operator.scripts.compile_candidate_facts:main"
uo-evaluate-review-trigger = "understand_operator.scripts.evaluate_review_trigger:main"
uo-validate-spec-consistency = "understand_operator.scripts.validate_spec_consistency:main"
uo-validate-stage = "understand_operator.scripts.validate_fact_stage:main"
uo-build-fact-registry = "understand_operator.scripts.build_fact_registry:main"
uo-build-query-index = "understand_operator.scripts.build_query_index:main"
uo-verify-required-scripts = "understand_operator.scripts.verify_required_scripts:main"
uo-build-compile-gate = "understand_operator.scripts.build_compile_gate:main"
uo-source-graph-compile = "understand_operator.scripts.source_graph_compiler:main"
uo-materialize-derived-graph = "understand_operator.scripts.materialize_derived_graph:main"
uo-query-readonly = "understand_operator.scripts.uo_query_readonly:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["understand_operator*"]
