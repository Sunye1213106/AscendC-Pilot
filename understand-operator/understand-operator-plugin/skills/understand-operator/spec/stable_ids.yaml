version: 1
pattern: "^[A-Z][A-Z0-9]*_[A-Z0-9_]+$"
prefixes:
  OP: operator
  ARG: operator argument
  ATTR: operator attribute
  SHAPE: shape symbol
  SYM: source symbol
  VAR: source variable
  EXPR: raw expression
  CALL: call site
  BRANCH: branch site
  OUTCOME: branch outcome
  LOOP: loop
  KEY: tiling key field
  KEYBLOCK: template key enumeration block
  TDATA: tiling data field
  TDWRITE: host tiling data write
  TDREAD: kernel tiling data read
  KERNEL: kernel entry
  TENSOR: tensor
  OPR: compute operation
  API: AscendC API call
  BUF: buffer queue workspace
  SYNC: synchronization event
  REL: source fact relation
  SRC: source anchor
  UNRESOLVED: unresolved item
  ARULE: abstraction rule
  DVIEW: derived graph node
forbidden_new_prefixes:
  - OPxxx
  - IOxxx
  - SHxxx
  - SPxxx
rules:
  - Confirmed items and relations must have stable ids.
  - References ending in _id, _ids, _ref, or _refs must point to known ids in the validated KB slice.
  - Source anchors use SRC_* ids and are stored inline on the fact that they support.
