version: 2
relation_types:
  reads:
    source: any
    target: any
    endpoint_signatures:
      - {source: tilingdata_read, target: tilingdata_field}
      - {source: compute_operation_like, target: tensor_like}
      - {source: api_call_like, target: tensor_like}
      - {source: api_call_like, target: resource_like}
  writes:
    source: any
    target: any
    endpoint_signatures:
      - {source: tilingdata_write_like, target: tilingdata_field}
      - {source: compute_operation_like, target: tensor_like}
      - {source: api_call_like, target: tensor_like}
      - {source: api_call_like, target: resource_like}
  assigned_from:
    source: variable
    target: expression
    endpoint_signatures: [{source: variable, target: expression}]
  derived_from:
    source: variable
    target: variable
    endpoint_signatures: [{source: variable, target: variable}]
  passed_to:
    source: variable
    target: call_like
    endpoint_signatures: [{source: variable, target: call_like}]
    identity_fields: [argument_index]
  calls:
    source: call_like
    target: any
    endpoint_signatures:
      - {source: call_like, target: function_like}
      - {source: call_like, target: kernel_entry_like}
      - {source: call_like, target: api_definition}
  controls:
    source: expression_like
    target: branch_like
    endpoint_signatures: [{source: expression_like, target: branch_like}]
  has_outcome:
    source: branch_like
    target: branch_outcome_like
    endpoint_signatures: [{source: branch_like, target: branch_outcome_like}]
    identity_fields: [outcome_label]
  loops_over:
    source: loop_like
    target: expression_like
    endpoint_signatures: [{source: loop_like, target: expression_like}]
  sets_tiling_key:
    source: call_like
    target: tiling_key_like
    endpoint_signatures: [{source: call_like, target: tiling_key_like}]
  constrains:
    source: expression_like
    target: variable
    endpoint_signatures: [{source: expression_like, target: variable}]
  prunes:
    source: expression_like
    target: tiling_key_like
    endpoint_signatures: [{source: expression_like, target: tiling_key_like}]
  merges_into:
    source: tiling_key_like
    target: tiling_key_like
    endpoint_signatures: [{source: tiling_key_like, target: tiling_key_like}]
  requires: {source: any, target: any, endpoint_signatures: [{source: any, target: any}]}
  implies: {source: any, target: any, endpoint_signatures: [{source: any, target: any}]}
  mutex_with: {source: any, target: any, endpoint_signatures: [{source: any, target: any}]}
  takes_tensor:
    source: compute_operation_like
    target: tensor_like
    endpoint_signatures: [{source: compute_operation_like, target: tensor_like}]
  produces_tensor:
    source: compute_operation_like
    target: tensor_like
    endpoint_signatures: [{source: compute_operation_like, target: tensor_like}]
  data_depends_on:
    source: tensor_like
    target: tensor_like
    endpoint_signatures: [{source: tensor_like, target: tensor_like}]
  data_dependency: {source: any, target: any, endpoint_signatures: [{source: any, target: any}]}
  copies_from:
    source: api_call_like
    target: tensor_like
    endpoint_signatures: [{source: api_call_like, target: tensor_like}]
  copies_to:
    source: api_call_like
    target: tensor_like
    endpoint_signatures: [{source: api_call_like, target: tensor_like}]
  produces: {source: any, target: any, endpoint_signatures: [{source: any, target: any}]}
  consumes: {source: any, target: any, endpoint_signatures: [{source: any, target: any}]}
  signals:
    source: call_like
    target: sync
    endpoint_signatures: [{source: call_like, target: sync}]
  waits_for:
    source: call_like
    target: sync
    endpoint_signatures: [{source: call_like, target: sync}]
  happens_before: {source: any, target: any, endpoint_signatures: [{source: any, target: any}]}
  writes_output:
    source: any
    target: output_argument_like
    endpoint_signatures: [{source: any, target: output_argument_like}]
  tilingdata_write_to_read:
    source: tilingdata_write_like
    target: tilingdata_read
    endpoint_signatures:
      - {source: tilingdata_write_like, target: tilingdata_read}
  tiling_key_setter_to_field:
    source: call_like
    target: tiling_key_like
    endpoint_signatures: [{source: call_like, target: tiling_key_like}]
  compute_to_kernel:
    source: compute_operation_like
    target: call_like
    endpoint_signatures: [{source: compute_operation_like, target: call_like}]
  buffer_producer_to_consumer: {source: any, target: any, endpoint_signatures: [{source: any, target: any}]}
  signal_to_wait:
    source: sync
    target: sync
    endpoint_signatures: [{source: sync, target: sync}]
  kernel_entry_to_output:
    source: kernel_entry_like
    target: output_argument_like
    endpoint_signatures: [{source: kernel_entry_like, target: output_argument_like}]
  includes:
    source: source_file_like
    target: source_file_like
    endpoint_signatures: [{source: source_file_like, target: source_file_like}]
  imports:
    source: source_file_like
    target: source_file_like
    endpoint_signatures: [{source: source_file_like, target: source_file_like}]
  build_depends_on:
    source: source_file_like
    target: source_file_like
    endpoint_signatures: [{source: source_file_like, target: source_file_like}]
  implemented_by:
    source: compute_operation_like
    target: api_call_like
    endpoint_signatures: [{source: compute_operation_like, target: api_call_like}]
  condition_selects_engine:
    source: branch_like
    target: compute_operation_like
    endpoint_signatures: [{source: branch_like, target: compute_operation_like}]
  uses_buffer:
    source: any
    target: resource_like
    endpoint_signatures: [{source: any, target: resource_like}]
  produced_into:
    source: any
    target: resource_like
    endpoint_signatures: [{source: any, target: resource_like}]
  consumed_from:
    source: resource_like
    target: any
    endpoint_signatures: [{source: resource_like, target: any}]
