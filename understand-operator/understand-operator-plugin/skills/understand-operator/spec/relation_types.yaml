version: 2
relation_types:
  reads:
    source: any
    target: any
    endpoint_signatures:
      - {source: tilingdata_read, target: tilingdata_field}
      - {source: call_like, target: tensor_like}
      - {source: compute_operation, target: tensor_like}
      - {source: any, target: resource_like}
    identity_fields: [access_path]
  writes:
    source: any
    target: any
    endpoint_signatures:
      - {source: tilingdata_write, target: tilingdata_field}
      - {source: block_dim_write, target: tilingdata_field}
      - {source: workspace_write, target: tilingdata_field}
      - {source: call_like, target: tensor_like}
      - {source: compute_operation, target: tensor_like}
      - {source: any, target: resource_like}
    identity_fields: [access_path]
  assigned_from: {source: variable, target: expression, endpoint_signatures: [{source: variable, target: expression}]}
  derived_from: {source: variable, target: variable, endpoint_signatures: [{source: variable, target: variable}]}
  passed_to: {source: variable, target: call, endpoint_signatures: [{source: variable, target: call}]}
  calls: {source: symbol, target: symbol, endpoint_signatures: [{source: symbol, target: symbol}], identity_fields: [call_path]}
  controls: {source: expression, target: branch}
  has_outcome: {source: branch, target: outcome}
  loops_over: {source: loop, target: expression}
  sets_tiling_key: {source: call, target: key}
  constrains: {source: expression, target: variable}
  prunes: {source: expression, target: key}
  merges_into: {source: key, target: key}
  requires: {source: any, target: any}
  implies: {source: any, target: any}
  mutex_with: {source: any, target: any}
  takes_tensor: {source: operation, target: tensor}
  produces_tensor: {source: operation, target: tensor}
  data_depends_on: {source: tensor, target: tensor}
  data_dependency: {source: any, target: any}
  copies_from: {source: api, target: tensor}
  copies_to: {source: api, target: tensor}
  produces: {source: any, target: any}
  consumes: {source: any, target: any}
  signals: {source: symbol, target: sync}
  waits_for: {source: symbol, target: sync}
  happens_before: {source: any, target: any}
  writes_output: {source: any, target: argument}
  tilingdata_write_to_read: {source: tilingdata, target: tilingdata}
  tiling_key_setter_to_field: {source: call, target: key}
  compute_to_kernel: {source: operation, target: call}
  buffer_producer_to_consumer: {source: any, target: any}
  signal_to_wait: {source: sync, target: sync}
  kernel_entry_to_output: {source: symbol, target: argument}
  includes: {source: source_file, target: source_file}
  imports: {source: source_file, target: source_file}
  build_depends_on: {source: source_file, target: source_file}
  implemented_by: {source: operation, target: api}
  condition_selects_engine: {source: branch, target: operation}
  uses_buffer: {source: any, target: memory_resource}
  produced_into: {source: any, target: memory_resource}
  consumed_from: {source: memory_resource, target: any}
