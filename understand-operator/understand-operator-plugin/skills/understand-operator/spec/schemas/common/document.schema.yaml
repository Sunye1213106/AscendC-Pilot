version: 1
schema_kind: document
required_top_level: [version, artifact, snapshot, items, relations, unresolved]
allowed_top_level:
  - version
  - artifact
  - snapshot
  - status
  - checked_at
  - input_hashes
  - facts_hashes
  - step2_receipt_hash
  - step3_receipt_hash
  - required_reports
  - blocking_findings
  - warnings
  - errors
  - items
  - relations
  - unresolved
  - analysis_status
  - reason
  - sources
required_item_fields: [id, kind, status]
relation_required_fields: [id, type, source_id, target_id, status]
not_applicable_required: [analysis_status, reason, sources]
forbidden_content: [schema_copy, generated_tests, golden_code]
