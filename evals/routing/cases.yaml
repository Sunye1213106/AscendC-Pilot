# Skill routing trigger eval (dry): description acts as semantic router.
# should_trigger: skill name must win; should_not_trigger: skill must not win.
version: 1
cases:
  - id: route_uo_init_build
    query: 首次构建 UO CodeMap，指定 architecture 分析算子
    should_trigger: [uo-init]
    should_not_trigger: [tg-solve, ce-review]

  - id: route_uo_init_knowledge_base
    query: 帮我为这个算子建立知识库
    should_trigger: [uo-init, operator-analysis]
    should_not_trigger: [tg-init, ce-review]

  - id: route_uo_init_index_operator
    query: 索引分析这个算子，建一下算子知识库
    should_trigger: [uo-init, operator-analysis]
    should_not_trigger: [tg-solve, ce-review]

  - id: route_uo_query
    query: 查询已有 .uo 里某个 TilingKey 维度和 Host 字段关系
    should_trigger: [uo-query, operator-analysis]
    should_not_trigger: [uo-init, tg-init]

  - id: route_uo_update
    query: 源码改了，刷新已有 CodeMap 并看差异
    should_trigger: [uo-update]
    should_not_trigger: [uo-init]

  - id: route_tg_init
    query: 建测例契约，做 tilingkey 绑定
    should_trigger: [tg-init]
    should_not_trigger: [uo-query, ce-review]

  - id: route_tg_plan
    query: 制定 TG 测试目标并批准 plan，不构造 case、不做 Host replay
    should_trigger: [tg-plan]
    should_not_trigger: [uo-init, ce-review]

  - id: route_tg_solve
    query: 对已批准 target set 做 Host replay 闭环，扩大 R 和 E
    should_trigger: [tg-solve, testcase-generation]
    should_not_trigger: [uo-init]

  - id: route_ce_review
    query: 审查算子代码改动，找潜在 bug
    should_trigger: [ce-review, code-review]
    should_not_trigger: [tg-solve]

  - id: route_lemma_proof
    query: 证明某字段只能取特定值，建立可审计源码引理
    should_trigger: [source-proof]
    should_not_trigger: [uo-query]

  - id: route_ce_impact
    query: 有 diff 时做变更影响面，切片并挂验证义务
    should_trigger: [ce-impact]
    should_not_trigger: [tg-solve, uo-init]

  - id: route_ce_intent
    query: 无 diff 时定位改哪里，冻结变更目标
    should_trigger: [ce-intent]
    should_not_trigger: [tg-init, uo-init]

  - id: route_ce_verify
    query: 验证闭环签发 CE 证书，测量收据关闭义务
    should_trigger: [ce-verify]
    should_not_trigger: [uo-init, tg-solve]

  - id: route_code_engineering
    query: Plan scope and verify AscendC code changes with UO slices, evidence tiers, risk classes, and a verification-obligation ledger
    should_trigger: [code-engineering]
    should_not_trigger: [tg-solve]
