schema: tg-plan/v3
requirement:
  id: R-fag-tnd-dense-swizzle
  text: >
    PR-10335 新增/扩展 TND dense swizzle 可达性与 kernel 索引。
    【NEW】IsTndDeterSwizzleScheduleSafe（tiling_normal_regbase.cpp:106-133）在确定性路径校验
    每 batch m>=min(aicNum,n)；deterTndSwizzleSafe=(!isDeterministic||safe)（:743）。
    【NEW】templateSupportCond 析取（:744-752）两支均可打到 expected=1：
    Arm-A is_deter=1∧splitAxis=BN2GS1S2∧DeterType=DETER_DENSE(2)∧g=1∧deterTndSwizzleSafe；
    Arm-B is_deter=0∧splitAxis=BN2S2∧(S1>=2048||(S2>128∧S1>=1024))∧sparseType!=UNSUPPORTED。
    【NEW】kernel CalTNDDenseSwizzleIndex（kernel_deter.h:438-443）在 IS_TND∧IS_TND_SWIZZLE 确定性轮次。
    【LEGACY】enableSwizzle=(isExceedL2Cache||isLargeInvalidBlk)∧blockOuter==aicNum（:731）；
    isTndSwizzle=enableSwizzle∧layout=TND∧templateSupportCond∧B<129∧!isSeqExistZero∧tailZeroCount==0（:753-755）。
    路径否定项：IsCapable 要求 tndSoftmaxIn==""（:708-709）；TND actual_seq 解析期
    !isSeqExistZero（:531,:545）；tailZeroCount==0（:755）；DoSparse 成功（:723-726）。
    layout!=TND 或 B>=129 整 Target 不可达（Guard，非 expected=0 Target）。
requirement_scope:
  changed_symbols:
    - IsTndDeterSwizzleScheduleSafe
    - deterTndSwizzleSafe
    - templateSupportCond
    - tndBaseInfo.isTndSwizzle
    - CalTNDDenseSwizzleIndex
targets:
  - id: T-is-tnd-swizzle-on
    evidence:
      kind: replay_field
      field: replay.IsTndSwizzle
      expected: 1
dimensions:
  - id: D-is-deter-arm
    target: T-is-tnd-swizzle-on
    controls: [is_deter]
    classifier:
      requires: [case.is_deter]
    partitions:
      - id: p-deter-dense-swizzle
        predicate: {op: eq, field: case.is_deter, value: 1}
      - id: p-nondeter-bn2s2-swizzle
        predicate: {op: eq, field: case.is_deter, value: 0}
  - id: D-split-axis-template
    target: T-is-tnd-swizzle-on
    controls: [Input_Layout]
    classifier:
      requires: [replay.SplitAxis]
    partitions:
      - id: p-split-bn2gs1s2
        predicate: {op: eq, field: replay.SplitAxis, value: 0}
      - id: p-split-bn2s2
        predicate: {op: eq, field: replay.SplitAxis, value: 5}
  - id: D-enable-swizzle-trigger
    target: T-is-tnd-swizzle-on
    controls: [Input_Layout, B, S1, S2, D]
    classifier:
      requires: [probe.isExceedL2Cache, probe.isLargeInvalidBlk]
    partitions:
      - id: p-via-l2-exceed
        predicate: {op: eq, field: probe.isExceedL2Cache, value: 1}
      - id: p-via-large-invalid-blk
        predicate: {op: eq, field: probe.isLargeInvalidBlk, value: 1}
  - id: D-s1-threshold-arm
    target: T-is-tnd-swizzle-on
    controls: [S1, S2]
    classifier:
      requires: [case.S1, case.S2]
    partitions:
      - id: p-s1-ge-2048
        predicate: {op: ge, field: case.S1, value: 2048}
      - id: p-s1-mid-large-s2
        predicate:
          op: and
          args:
            - {op: ge, field: case.S1, value: 1024}
            - {op: lt, field: case.S1, value: 2048}
            - {op: gt, field: case.S2, value: 128}
  - id: D-gqa-head-ratio
    target: T-is-tnd-swizzle-on
    controls: [N1, N2]
    classifier:
      requires: [case.N1, case.N2]
    partitions:
      - id: p-mha-equal-heads
        predicate:
          op: and
          args:
            - {op: eq, field: case.N1, value: 4}
            - {op: eq, field: case.N2, value: 4}
      - id: p-gqa-unequal-heads
        predicate:
          op: and
          args:
            - {op: eq, field: case.N1, value: 8}
            - {op: eq, field: case.N2, value: 2}
guards:
  - id: G-layout-not-tnd
    target: T-is-tnd-swizzle-on
    controls: [Input_Layout]
    predicate: {op: ne, field: case.Input_Layout, value: TND}
    negate_hint: {Input_Layout: TND}
  - id: G-b-over-prefix-bound
    target: T-is-tnd-swizzle-on
    controls: [B]
    predicate: {op: ge, field: case.B, value: 129}
    negate_hint: {B: 128}
coverage:
  L0:
    dimensions:
      - D-is-deter-arm
      - D-split-axis-template
      - D-enable-swizzle-trigger
      - D-s1-threshold-arm
      - D-gqa-head-ratio
  L1:
    combinations:
      - dims: [D-is-deter-arm, D-enable-swizzle-trigger]
        reason: templateSupportCond 两支均依赖 enableSwizzle 析取，deter 与 nondeter 触发 L2/invalid-blk 条件不同
      - dims: [D-is-deter-arm, D-s1-threshold-arm]
        reason: S1 阈值析取仅 nondeter Arm-B 生效，与 is_deter 切臂交互
      - dims: [D-is-deter-arm, D-gqa-head-ratio]
        reason: g==1 仅 deter Arm-A 需要，GQA 仍可通过 nondeter Arm-B 打到 expected=1
      - dims: [D-enable-swizzle-trigger, D-s1-threshold-arm]
        reason: BN2S2 路径同时依赖 enableSwizzle 与 S1|| 阈值
      - dims: [D-split-axis-template, D-enable-swizzle-trigger]
        reason: splitAxis 选择与 blockOuter/aicNum 分核共同决定 enableSwizzle
  L2: []
  L3:
    guards:
      - G-layout-not-tnd
      - G-b-over-prefix-bound
oracle:
  - precision
  - md5
constraints:
  - op: eq
    field: probe.blockOuter
    value: 32
  - op: eq
    field: probe.tailZeroCount
    value: 0
  - op: eq
    field: probe.isSeqExistZero
    value: 0
  - op: eq
    field: probe.enableSwizzle
    value: 1
  - op: ne
    field: replay.sparseType
    value: 3
environment:
  aicNum: 32
  coreNum: 32
environment_source:
  aicNum: tests/ut/op_host/arch35/test_flash_attention_score_grad_tiling.cpp:49
  coreNum: tests/ut/op_host/arch35/test_flash_attention_score_grad_tiling.cpp:56
untestable:
  - id: u-dtype
    kind: control_gap
    reason: Dtype 列 unresolved，无法绑定 host inputDtype 传导至 isTndSwizzle 写点
    needs_binding:
      - {column: Dtype, want: "confirmed+active，并证实 dtype→queryType→tiling 路径"}
  - id: u-out-dtype
    kind: control_gap
    reason: out_dtype 列 unresolved，无法绑定 outDtype/isNzOut 与 swizzle 合取链
    needs_binding:
      - {column: out_dtype, want: "confirmed+active，并证实 out_dtype→fBaseParams.outDtype 路径"}
  - id: u-atten-mask-dtype
    kind: control_gap
    reason: Atten_mask_dtype 列 unresolved，sparse/mask 推导不可表驱动
    needs_binding:
      - {column: Atten_mask_dtype, want: "confirmed+active，并证实 mask dtype→sparseType 路径"}
  - id: u-atten-mask-shape
    kind: control_gap
    reason: Atten_mask_shape 列 unresolved，isSparse/attenMask 形状不可表驱动
    needs_binding:
      - {column: Atten_mask_shape, want: "confirmed+active，并证实 mask shape→isSparse 路径"}
  - id: u-pse-shape
    kind: control_gap
    reason: PSE_shape 列 unresolved，PSE 张量供给不可表驱动
    needs_binding:
      - {column: PSE_shape, want: "confirmed+active，并证实 PSE_shape→pseValue 路径"}
  - id: u-eod
    kind: control_gap
    reason: eod 列 unresolved，tailZeroCount/isEOD 由 host 计算量非表列直接绑定
    needs_binding:
      - {column: eod, want: "confirmed+active，并证实 eod→tailZeroCount 传导链"}
  - id: u-inner-drop
    kind: control_gap
    reason: inner_drop 列 unresolved，与 IsDrop/enableSwizzle 无 confirmed UO 绑定
    needs_binding:
      - {column: inner_drop, want: "confirmed+active，并证实 inner_drop→drop_mask 策略路径"}
  - id: u-is-sink
    kind: control_gap
    reason: is_sink 列 unresolved，sink kwarg 与 tiling key 无 confirmed 绑定
    needs_binding:
      - {column: is_sink, want: "confirmed+active，并证实 is_sink→sink 张量路径"}
