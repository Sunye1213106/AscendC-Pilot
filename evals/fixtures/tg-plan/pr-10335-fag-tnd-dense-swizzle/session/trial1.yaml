schema: tg-plan/v3
requirement:
  id: R-fag-tnd-dense-swizzle
  text: >
    PR10335：(新增) IsTndDeterSwizzleScheduleSafe@tiling_normal_regbase.cpp:106 在 DoOpTiling:743 写入
    deterTndSwizzleSafe；(改动) templateSupportCond deter 支去掉 &&false，改为
    isDeterministic&&BN2GS1S2&&DETER_DENSE&&g==1&&deterTndSwizzleSafe；(改动) tndBaseInfo.isTndSwizzle
    @DoOpTiling:753 打包 replay.IsTndSwizzle@1787；(改动) CalTNDDenseSwizzleIndex@deter.h:1626
    linearIdx=delta/s1OuterTmp*k+j（去掉 deltaCnt），CalDenseDeterIndex@kernel_deter.h:439 在
    IS_TND_SWIZZLE&&IsNewDeter 路径调用。可达 isTndSwizzle=1 需否定 IsCapable 早退(tndSoftmaxIn非空)、
    DoSparse 失败；合取 enableSwizzle=(isExceedL2Cache||isLargeInvalidBlk)&&blockOuter==aicNum、
    layout=TND、templateSupportCond、B<129、!isSeqExistZero、tailZeroCount==0。否定 deter 支：
    g!=1(GQA)、deterTndSwizzleSafe=0(m<min(aicNum,n))、非 DETER_DENSE；否定 non-deter 支：
    SplitAxis!=BN2S2 或 s1/s2 未达阈或 sparseType==UNSUPPORTED。kernel swizzle 坐标路径另需
    IsNewDeter&&isTndSwizzle=1。
targets:
  - id: T-isTndSwizzle
    evidence: {kind: replay_field, field: replay.IsTndSwizzle, expected: 1}
  - id: T-deter-schedule-safe
    evidence: {kind: probe, field: probe.deterTndSwizzleSafe, expected: 1}
  - id: T-kernel-tnd-swizzle-coord
    evidence:
      kind: derived
      predicate:
        op: and
        args:
          - {op: eq, field: replay.IsTndSwizzle, value: 1}
          - {op: eq, field: replay.DeterType, value: 2}
          - {op: eq, field: replay.IsTnd, value: 1}
dimensions:
  - id: D-is-deter
    target: T-isTndSwizzle
    controls: [is_deter]
    classifier: {requires: [case.is_deter]}
    partitions:
      - {id: p-deter-on, predicate: {op: eq, field: case.is_deter, value: 1}}
      - {id: p-deter-off, predicate: {op: eq, field: case.is_deter, value: 0}}
  - id: D-tnd-layout
    target: T-isTndSwizzle
    controls: [same_as_input]
    classifier: {requires: [case.same_as_input]}
    partitions:
      - {id: p-tnd, predicate: {op: eq, field: case.same_as_input, value: 1}}
      - {id: p-nontnd, predicate: {op: eq, field: case.same_as_input, value: 0}}
  - id: D-n2-gqa
    target: T-isTndSwizzle
    controls: [N2]
    classifier: {requires: [case.N2, case.N1]}
    partitions:
      - {id: p-mha, predicate: {op: eq, field: case.N2, value: 1}}
      - {id: p-gqa, predicate: {op: gt, field: case.N2, value: 1}}
  - id: D-deter-schedule-safe
    target: T-deter-schedule-safe
    controls: [is_deter]
    classifier: {requires: [probe.deterTndSwizzleSafe]}
    partitions:
      - {id: p-safe, predicate: {op: eq, field: probe.deterTndSwizzleSafe, value: 1}}
      - {id: p-unsafe, predicate: {op: eq, field: probe.deterTndSwizzleSafe, value: 0}}
  - id: D-enable-swizzle
    target: T-isTndSwizzle
    controls: [B]
    classifier: {requires: [probe.enableSwizzle]}
    partitions:
      - {id: p-on, predicate: {op: eq, field: probe.enableSwizzle, value: 1}}
      - {id: p-off, predicate: {op: eq, field: probe.enableSwizzle, value: 0}}
  - id: D-b-prefix
    target: T-isTndSwizzle
    controls: [B]
    classifier: {requires: [case.B]}
    partitions:
      - {id: p-under-129, predicate: {op: lt, field: case.B, value: 129}}
      - {id: p-over-129, predicate: {op: ge, field: case.B, value: 129}}
  - id: D-split-axis
    target: T-isTndSwizzle
    controls: [is_deter]
    classifier: {requires: [replay.SplitAxis]}
    partitions:
      - {id: p-bn2gs1s2, predicate: {op: eq, field: replay.SplitAxis, value: 0}}
      - {id: p-bn2s2, predicate: {op: eq, field: replay.SplitAxis, value: 5}}
  - id: D-sparse-deter-type
    target: T-isTndSwizzle
    controls: [sparse_mode]
    classifier: {requires: [case.sparse_mode, replay.DeterType]}
    partitions:
      - {id: p-dense, predicate: {op: eq, field: case.sparse_mode, value: 0}}
      - {id: p-causal, predicate: {op: eq, field: case.sparse_mode, value: 3}}
  - id: D-sched-safe-kernel
    target: T-kernel-tnd-swizzle-coord
    controls: [is_deter]
    classifier: {requires: [probe.deterTndSwizzleSafe]}
    partitions:
      - {id: p-k-safe, predicate: {op: eq, field: probe.deterTndSwizzleSafe, value: 1}}
      - {id: p-k-unsafe, predicate: {op: eq, field: probe.deterTndSwizzleSafe, value: 0}}
  - id: D-seqlens-variation
    target: T-kernel-tnd-swizzle-coord
    controls: [seqlens_list_q]
    classifier: {requires: [case.seqlens_list_q, case.seqlens_list_kv]}
    partitions:
      - {id: p-multi-seg, predicate: {op: ne, field: case.seqlens_list_q, value: ""}}
      - {id: p-single-seg, predicate: {op: eq, field: case.seqlens_list_q, value: ""}}
guards:
  - id: G-tnd-layout
    target: T-isTndSwizzle
    controls: [same_as_input]
    predicate: {op: eq, field: case.same_as_input, value: 1}
    negate_hint: {same_as_input: 0}
  - id: G-deter-on
    target: T-kernel-tnd-swizzle-coord
    controls: [is_deter]
    predicate: {op: eq, field: case.is_deter, value: 1}
    negate_hint: {is_deter: 0}
coverage:
  L0:
    dimensions:
      - D-is-deter
      - D-tnd-layout
      - D-n2-gqa
      - D-deter-schedule-safe
      - D-enable-swizzle
      - D-b-prefix
      - D-split-axis
      - D-sparse-deter-type
      - D-sched-safe-kernel
      - D-seqlens-variation
  L1:
    combinations:
      - {dims: [D-is-deter, D-deter-schedule-safe], reason: "deterTndSwizzleSafe 仅 is_deter=1 时调用 IsTndDeterSwizzleScheduleSafe 进入 templateSupportCond deter 支"}
      - {dims: [D-n2-gqa, D-deter-schedule-safe], reason: "g==1(MHA) 与 schedule-safe 共同 gate deter+TND swizzle 写点"}
      - {dims: [D-enable-swizzle, D-b-prefix], reason: "enableSwizzle 与 b<TND_SWIZZLE_PREFIX_NUM 外层合取决定 isTndSwizzle"}
      - {dims: [D-is-deter, D-split-axis], reason: "deterministic 走 BN2GS1S2(0)，non-deter 走 BN2S2(5) 两支 templateSupportCond"}
      - {dims: [D-tnd-layout, D-sparse-deter-type], reason: "TND 下 sparse_mode 决定 GetDeterSparseTilingKey 能否落到 DETER_DENSE"}
      - {dims: [D-sched-safe-kernel, D-seqlens-variation], reason: "seqlens 段数影响 m/n 与 CalTNDDenseSwizzleIndex 坐标分解"}
  L2: []
  L3:
    guards: [G-tnd-layout, G-deter-on]
oracle:
  - kind: md5
    columns: [Actual_dq_Md5sum, Actual_dk_Md5sum, Actual_dv_Md5sum]
    requires: [case.is_deter]
    reason: "CalTNDDenseSwizzleIndex head-major S2 重排改变 deterministic 累加顺序，is_deter=1 时以 md5 回归 dq/dk/dv"
constraints:
  - id: C-pre-tokens-dense
    predicate: {op: ge, field: case.Pre_Tockens, value: 65536}
  - id: C-next-tokens-dense
    predicate: {op: ge, field: case.Next_Tockens, value: 65536}
environment:
  aicNum: 32
  coreNum: 64
untestable:
  - id: u-eod
    kind: control_gap
    reason: "eod 列 unresolved+active；TND EOD trim 经 host isEOD 影响 tailZeroCount/isSeqExistZero，gate isTndSwizzle 写点需 tailZeroCount==0 且 !isSeqExistZero"
    needs_binding:
      - {column: eod, want: "confirmed+active，并证实 eod→isEOD→tailZeroCount/isSeqExistZero 传导链"}
  - id: u-inner-drop
    kind: control_gap
    reason: "inner_drop 列 unresolved+active；控制 drop_mask 造数策略，IsDrop TILING_KEY 由 keepProb 驱动，无法独立构造 deter swizzle 对照"
    needs_binding:
      - {column: inner_drop, want: "confirmed+active，并证实 inner_drop 与 tiling key/写点传导链"}
  - id: u-is-sink
    kind: control_gap
    reason: "is_sink 列 unresolved+active；控制 sink kwarg 存在性，无 IsSink dim 无法 replay 观测"
    needs_binding:
      - {column: is_sink, want: "confirmed+active，并证实 is_sink→sink kwarg 与 kernel 路径关系"}
