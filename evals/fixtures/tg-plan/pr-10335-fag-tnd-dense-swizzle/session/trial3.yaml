schema: tg-plan/v3
requirement:
  id: R-fag-tnd-dense-swizzle
  text: >
    PR10335（新增）启用确定性 TND DENSE swizzle：templateSupportCond 确定性析取支由恒 false 改为
    g==1 && IsTndDeterSwizzleScheduleSafe（tiling_normal_regbase.cpp:745-747）；（新增）
    IsTndDeterSwizzleScheduleSafe 要求每 batch 段 m=ceil(seqQ/cubeBaseM) >= min(aicNum,n=ceil(seqKv/cubeBaseN))
    （:106-133，早退否定：aicNum!=0、n1>0、cubeBaseM/N>0、|actualSeqQlen|==|actualSeqKvlen|、seqQ>0、seqKv>0）；
    （新增）CalTNDDenseSwizzleIndex 去掉 deltaCnt，linearIdx 按 head-major S2 再 rotate S1（deter.h:1607-1620）。
    IsTndSwizzle 写点 tndBaseInfo.isTndSwizzle=:753，打包 GET_TPL_TILING_KEY :1795。
    到达 expected=1 合取：enableSwizzle && layoutType=TND && templateSupportCond &&
    b<129 && !isSeqExistZero && tailZeroCount==0；确定性析取支另需 isDeterministic && splitAxis=BN2GS1S2 &&
    deterSparseType=DETER_DENSE(2) && g==1 && deterTndSwizzleSafe。
    取反 g==1 或非 safe 时确定性支失效，但 is_deter=0 时非确定性 BN2S2 析取支仍可打到 IsTndSwizzle=1；
    取反 layoutType!=TND 则两析取支均不可达 expected=1。

targets:
  - id: T-tnd-swizzle-on
    evidence: {kind: replay_field, field: replay.IsTndSwizzle, expected: 1}
  - id: T-tnd-swizzle-off-deter
    evidence: {kind: replay_field, field: replay.IsTndSwizzle, expected: 0}

dimensions:
  - id: D-b-batch
    target: T-tnd-swizzle-on
    controls: [B]
    classifier: {requires: [case.B]}
    partitions:
      - {id: p-b2, predicate: {op: eq, field: case.B, value: 2}}
      - {id: p-b4, predicate: {op: eq, field: case.B, value: 4}}
  - id: D-n1-heads
    target: T-tnd-swizzle-on
    controls: [N1, N2]
    classifier: {requires: [case.N1, case.N2]}
    partitions:
      - {id: p-mha4, predicate: {op: and, args: [{op: eq, field: case.N1, value: 4}, {op: eq, field: case.N2, value: 4}]}}
      - {id: p-mha8, predicate: {op: and, args: [{op: eq, field: case.N1, value: 8}, {op: eq, field: case.N2, value: 8}]}}
  - id: D-n2-gqa-off
    target: T-tnd-swizzle-off-deter
    controls: [N1, N2]
    classifier: {requires: [case.N1, case.N2]}
    partitions:
      - {id: p-gqa2, predicate: {op: and, args: [{op: eq, field: case.N1, value: 4}, {op: eq, field: case.N2, value: 2}]}}
      - {id: p-gqa3, predicate: {op: and, args: [{op: eq, field: case.N1, value: 6}, {op: eq, field: case.N2, value: 2}]}}
  - id: D-seqlens-unsafe-off
    target: T-tnd-swizzle-off-deter
    controls: [seqlens_list_q, seqlens_list_kv]
    classifier: {requires: [probe.deterTndSwizzleSafe]}
    partitions:
      - {id: p-short-q, predicate: {op: eq, field: probe.deterTndSwizzleSafe, value: false}}
      - {id: p-short-kv, predicate: {op: eq, field: probe.deterTndSwizzleSafe, value: false}}

guards:
  - id: G-not-tnd
    target: T-tnd-swizzle-on
    controls: [Input_Layout]
    predicate: {op: ne, field: case.Input_Layout, value: TND}
    negate_hint: {Input_Layout: TND}
  - id: G-not-tnd-off
    target: T-tnd-swizzle-off-deter
    controls: [Input_Layout]
    predicate: {op: ne, field: case.Input_Layout, value: TND}
    negate_hint: {Input_Layout: TND}

coverage:
  L0: {dimensions: [D-b-batch, D-n1-heads, D-n2-gqa-off, D-seqlens-unsafe-off]}
  L1:
    combinations:
      - {dims: [D-b-batch, D-n1-heads], reason: "batch 与 head 数共同影响 TND swizzle prefix sum 与 blockOuter 分核"}
      - {dims: [D-n2-gqa-off, D-seqlens-unsafe-off], reason: "g>1 与 seqlens safety 独立关断确定性 TND swizzle 析取支"}
  L2: []
  L3: {guards: [G-not-tnd, G-not-tnd-off]}

oracle:
  - kind: md5
    outputs: [dq, dk, dv]
    when: {op: eq, field: case.is_deter, value: 1}

constraints:
  - text: "Input_Layout=TND（layoutType=INPUT_FORMAT_TND）"
  - text: "is_deter=1（isDeterministic=true，走确定性析取支）"
  - text: "same_as_input=1（TND softmax_layout=TND）"
  - text: "sparse_mode=0 且 Pre_Tockens>=S1 且 Next_Tockens>=S2（deterSparseType=DETER_DENSE）"
  - text: "Drop_Out_Possibility=1（keep_prob=1，简化 drop 分支）"
  - text: "B<129（TND_SWIZZLE_PREFIX_NUM）"
  - text: "seqlens_list_q/kv 非空且各段 seq>0（!isSeqExistZero）"
  - text: "T-tnd-swizzle-on：seqlens 满足 m>=min(aicNum,n)（deterTndSwizzleSafe=true）"
  - text: "T-tnd-swizzle-on：N1=N2（g=1，MHA）"
  - text: "enableSwizzle 需 blockOuter=aicNum 且（CheckExceedL2Cache||CheckIsLargeInvalidBlk）"

environment:
  aicNum: 32  # tests/ut/op_host/arch35/test_flash_attention_score_grad_tiling.cpp:49
  coreNum: 32  # tests/ut/op_host/arch35/test_flash_attention_score_grad_tiling.cpp:56

untestable:
  - id: u-dtype
    kind: control_gap
    reason: "Dtype 列无 host TILING_FIELD/KEY 绑定，无法构造 dtype 对 swizzle 门的传导"
    needs_binding:
      - {column: Dtype, want: "confirmed+active，并证实到 inputDtype TILING_KEY 写点"}
  - id: u-out-dtype
    kind: control_gap
    reason: "out_dtype 列无 host 写点绑定，无法独立切 outDtype 维"
    needs_binding:
      - {column: out_dtype, want: "confirmed+active，并证实到 outDtype TILING_KEY 写点"}
  - id: u-atten-mask-dtype
    kind: control_gap
    reason: "Atten_mask_dtype 仅驱动 tensor dtype，无 attenMask TILING_KEY 列映射"
    needs_binding:
      - {column: Atten_mask_dtype, want: "confirmed+active，并证实到 attenMaskCfg 写点"}
  - id: u-atten-mask-shape
    kind: control_gap
    reason: "Atten_mask_shape 仅驱动 mask tensor shape，无 host 维度写点"
    needs_binding:
      - {column: Atten_mask_shape, want: "confirmed+active，并证实到 attenMaskCfg/IsAttenMask 写点"}
  - id: u-pse-shape
    kind: control_gap
    reason: "PSE_shape 仅驱动 pse tensor shape，无独立 TILING_KEY 列"
    needs_binding:
      - {column: PSE_shape, want: "confirmed+active，并证实到 IsPse 写点"}
  - id: u-eod
    kind: control_gap
    reason: "eod 输入无直接 host 写点；isEOD 为计算量非输入列"
    needs_binding:
      - {column: eod, want: "confirmed+active，并证实 eod→isEOD/tailZeroCount 传导链"}
  - id: u-inner-drop
    kind: control_gap
    reason: "inner_drop 控制 drop_mask 造数策略，不驱动 IsDrop TILING_KEY（由 keep_prob 决定）"
    needs_binding:
      - {column: inner_drop, want: "confirmed+active，并证实到 tiling 写点"}
  - id: u-is-sink
    kind: control_gap
    reason: "is_sink 控制 sink kwarg 存在性，无 IsSink TILING_KEY 维"
    needs_binding:
      - {column: is_sink, want: "confirmed+active，并证实到 kernel/tiling 消费点"}

