schema: tg-plan/v3
requirement:
  id: R-fag-deter-band
  text: >
    新增：DeterBandScheduleMode 枚举与 TILING_FIELD replay.deterBandScheduleMode（tiling_data_regbase.h:139）；
    SelectDeterBandSchedule/SelectBlockSchedule/DetermineBlockSchedule（tiling_normal_regbase.cpp:83-213,685-702）；
    SaveToTilingData 写点 set_deterBandScheduleMode（:2100）及 mode≠DISABLED 时覆写 deterMaxRound（:691）并强制 isSplitByBlockIdx=true（:209-210）。
    既有：GetDeterSparseTilingKey→DeterType 打包（:1016-1039,:1690）；CalcleBandDeterParam/CalcleCausalDeterParam（common:729-833）；
    kernel CalBandDeterIndex/CalDeterMaxLoopNum 读 scheduleMode（kernel_deter.h:507-715）。
    到 replay.deterBandScheduleMode∈{1,2,3} 路径条件（含早退否定）：
    is_deter=1 ∧ layout≠TND ∧ enableSwizzle ∧ splitAxis=BN2GS1S2 ∧ s1Inner·s1CvRatio=s2Inner·s2CvRatio
    ∧ sparseType≠UNSUPPORTED ∧ deterSparseType=DETER_BAND(4) ∧ g=1 ∧ coreNum=aicNum·2 ∧ actualBatch>0
    ∧ SelectDeterBandSchedule(k,m,n,p,q,b>0)
    ∧ ¬(is_deter=0) ∧ ¬(layout=TND) ∧ ¬(g≠1)
    ∧ sparse_mode=3 时：S1=S2→GetDeterSparseTilingKey 走 DETER_CAUSAL 且 rightDownBandCond 早退 legacy swizzle（schedule 保持 0，仍写点）；
    S1≠S2→仍可 DETER_BAND 并进入 hybrid 调度。
    sparse_mode=0 时：Pre/Next 非全窗才可 DETER_BAND；全窗走 DETER_DENSE 不进 hybrid。
    析取：SelectDeterBandSchedule 三支均可打到 expected——CAUSAL(1)/DENSE(2)/BAND(3) 均为可达 ON，非 Guard 互斥。

targets:
  - id: T-deter-band-schedule-causal
    evidence: {kind: replay_field, field: replay.deterBandScheduleMode, expected: 1}
  - id: T-deter-band-schedule-dense
    evidence: {kind: replay_field, field: replay.deterBandScheduleMode, expected: 2}
  - id: T-deter-band-schedule-band
    evidence: {kind: replay_field, field: replay.deterBandScheduleMode, expected: 3}
  - id: T-is-split-by-block-idx-hybrid
    evidence: {kind: replay_field, field: replay.isSplitByBlockIdx, expected: 1}

dimensions:
  - id: D-is-deter
    target: T-deter-band-schedule-band
    controls: [is_deter]
    classifier: {requires: [case.is_deter]}
    partitions:
      - {id: p-deter-on, predicate: {op: eq, field: case.is_deter, value: 1}}
      - {id: p-deter-off, predicate: {op: eq, field: case.is_deter, value: 0}}

  - id: D-layout-entry
    target: T-deter-band-schedule-band
    controls: [Input_Layout]
    classifier: {requires: [case.input_layout]}
    partitions:
      - {id: p-bnsd, predicate: {op: eq, field: case.input_layout, value: BNSD}}
      - {id: p-bsh, predicate: {op: eq, field: case.input_layout, value: BSH}}

  - id: D-sparse-mode-band-arm
    target: T-deter-band-schedule-band
    controls: [sparse_mode]
    classifier: {requires: [case.sparse_mode]}
    partitions:
      - {id: p-sparse-band4, predicate: {op: eq, field: case.sparse_mode, value: 4}}
      - {id: p-sparse-rdc3, predicate: {op: eq, field: case.sparse_mode, value: 3}}
      - {id: p-sparse-nomask0, predicate: {op: eq, field: case.sparse_mode, value: 0}}

  - id: D-rdc-s1s2-relation
    target: T-deter-band-schedule-band
    controls: [S1, S2]
    classifier: {requires: [case.S1, case.S2]}
    partitions:
      - {id: p-s1-eq-s2, predicate: {op: eq, field: case.S1, value: 256}}
      - {id: p-s1-ne-s2, predicate: {op: eq, field: case.S1, value: 256}}

  - id: D-rdc-s2-partition
    target: T-deter-band-schedule-band
    controls: [S2]
    classifier: {requires: [case.S2]}
    partitions:
      - {id: p-s2-equal-s1, predicate: {op: eq, field: case.S2, value: 256}}
      - {id: p-s2-less-s1, predicate: {op: eq, field: case.S2, value: 128}}

  - id: D-head-group
    target: T-deter-band-schedule-band
    controls: [N1, N2]
    classifier: {requires: [case.N1, case.N2]}
    partitions:
      - {id: p-g1, predicate: {op: eq, field: case.N2, value: 4}}
      - {id: p-g2, predicate: {op: eq, field: case.N2, value: 2}}

  - id: D-pre-token-nomask
    target: T-deter-band-schedule-band
    controls: [Pre_Tockens]
    classifier: {requires: [case.pre_tockens_input]}
    partitions:
      - {id: p-pre-partial, predicate: {op: eq, field: case.pre_tockens_input, value: 128}}
      - {id: p-pre-full, predicate: {op: eq, field: case.pre_tockens_input, value: 65536}}

  - id: D-next-token-nomask
    target: T-deter-band-schedule-band
    controls: [Next_Tockens]
    classifier: {requires: [case.next_tockens_input]}
    partitions:
      - {id: p-next-partial, predicate: {op: eq, field: case.next_tockens_input, value: 64}}
      - {id: p-next-full, predicate: {op: eq, field: case.next_tockens_input, value: 65536}}

  - id: D-enable-swizzle
    target: T-deter-band-schedule-band
    controls: [S1, S2, B, D]
    classifier: {requires: [probe.enableSwizzle]}
    partitions:
      - {id: p-swizzle-on, predicate: {op: eq, field: probe.enableSwizzle, value: 1}}
      - {id: p-swizzle-off, predicate: {op: eq, field: probe.enableSwizzle, value: 0}}

  - id: D-schedule-causal
    target: T-deter-band-schedule-causal
    controls: [sparse_mode, S1, S2, B, N2]
    classifier: {requires: [replay.deterBandScheduleMode]}
    partitions:
      - {id: p-mode-causal, predicate: {op: eq, field: replay.deterBandScheduleMode, value: 1}}
      - {id: p-mode-not-causal, predicate: {op: ne, field: replay.deterBandScheduleMode, value: 1}}

  - id: D-schedule-dense
    target: T-deter-band-schedule-dense
    controls: [sparse_mode, S1, S2, B, N2]
    classifier: {requires: [replay.deterBandScheduleMode]}
    partitions:
      - {id: p-mode-dense, predicate: {op: eq, field: replay.deterBandScheduleMode, value: 2}}
      - {id: p-mode-not-dense, predicate: {op: ne, field: replay.deterBandScheduleMode, value: 2}}

  - id: D-schedule-band
    target: T-deter-band-schedule-band
    controls: [sparse_mode, S1, S2, B, N2]
    classifier: {requires: [replay.deterBandScheduleMode]}
    partitions:
      - {id: p-mode-band, predicate: {op: eq, field: replay.deterBandScheduleMode, value: 3}}
      - {id: p-mode-not-band, predicate: {op: ne, field: replay.deterBandScheduleMode, value: 3}}

  - id: D-split-block-idx
    target: T-is-split-by-block-idx-hybrid
    controls: [is_deter, sparse_mode]
    classifier: {requires: [replay.isSplitByBlockIdx]}
    partitions:
      - {id: p-split-on, predicate: {op: eq, field: replay.isSplitByBlockIdx, value: 1}}
      - {id: p-split-off, predicate: {op: eq, field: replay.isSplitByBlockIdx, value: 0}}

guards:
  - id: G-is-deter-off
    target: T-deter-band-schedule-band
    controls: [is_deter]
    predicate: {op: eq, field: case.is_deter, value: 0}
    negate_hint: {is_deter: 1}

  - id: G-layout-tnd
    target: T-deter-band-schedule-band
    controls: [Input_Layout]
    predicate: {op: eq, field: case.input_layout, value: TND}
    negate_hint: {Input_Layout: BNSD}

  - id: G-head-group-not-one
    target: T-deter-band-schedule-band
    controls: [N1, N2]
    predicate: {op: eq, field: case.N2, value: 2}
    negate_hint: {N2: 4}

  - id: G-legacy-rdc-causal-equal
    target: T-deter-band-schedule-band
    controls: [sparse_mode, S1, S2]
    predicate:
      op: and
      args:
        - {op: eq, field: case.sparse_mode, value: 3}
        - {op: eq, field: case.S1, value: 256}
        - {op: eq, field: case.S2, value: 256}
    negate_hint: {sparse_mode: 3, S1: 256, S2: 128}

  - id: G-nomask-dense-window
    target: T-deter-band-schedule-band
    controls: [sparse_mode, Pre_Tockens, Next_Tockens]
    predicate:
      op: and
      args:
        - {op: eq, field: case.sparse_mode, value: 0}
        - {op: eq, field: case.pre_tockens_input, value: 65536}
        - {op: eq, field: case.next_tockens_input, value: 65536}
    negate_hint: {sparse_mode: 0, Pre_Tockens: 128, Next_Tockens: 64}

  - id: G-swizzle-off
    target: T-deter-band-schedule-band
    controls: [S1, S2, B, D]
    predicate: {op: eq, field: probe.enableSwizzle, value: 0}
    negate_hint: {S1: 1024, S2: 1024, B: 2, D: 128}

coverage:
  L0:
    dimensions:
      - D-is-deter
      - D-layout-entry
      - D-sparse-mode-band-arm
      - D-rdc-s1s2-relation
      - D-rdc-s2-partition
      - D-head-group
      - D-pre-token-nomask
      - D-next-token-nomask
      - D-enable-swizzle
      - D-schedule-causal
      - D-schedule-dense
      - D-schedule-band
      - D-split-block-idx
  L1:
    combinations:
      - dims: [D-sparse-mode-band-arm, D-schedule-band]
        reason: sparse_mode/token 几何决定 SelectDeterBandSchedule 中 m,n,p,q,b，影响 CAUSAL/DENSE/BAND 三支比较
      - dims: [D-rdc-s2-partition, D-schedule-band]
        reason: sparse_mode=3 时 S1/S2 关系决定 DETER_CAUSAL legacy 早退 vs DETER_BAND hybrid 可达
      - dims: [D-pre-token-nomask, D-next-token-nomask]
        reason: sparse_mode=0 时 Pre/Next 共同决定 GetDeterSparseTilingKey 走 DETER_DENSE 还是 DETER_BAND
      - dims: [D-enable-swizzle, D-split-block-idx]
        reason: enableSwizzle 为 canSplitByBlockIdx 前置；mode≠DISABLED 时写 isSplitByBlockIdx=1
      - dims: [D-head-group, D-schedule-band]
        reason: g=N1/N2 进入 hybridBandCond 与 isSplitByBlockIdx 偶 batch 约束
  L2: []
  L3:
    guards:
      - G-is-deter-off
      - G-layout-tnd
      - G-head-group-not-one
      - G-legacy-rdc-causal-equal
      - G-nomask-dense-window
      - G-swizzle-off

oracle:
  - kind: md5
    outputs: [dq, dk, dv]
    when: {op: eq, field: case.is_deter, value: 1}

constraints:
  - id: c-head-group-one
    predicate: {op: eq, field: probe.head_group_size, value: 1}
  - id: c-enable-swizzle
    predicate: {op: eq, field: probe.enableSwizzle, value: 1}
  - id: c-s1-swizzle-min
    predicate: {op: ge, field: case.S1, value: 128}
  - id: c-batch-even
    predicate: {op: mod_eq, left: probe.actual_batch, divisor: 2, value: 0}
  - id: c-nomask-partial-pre
    predicate: {op: lt, field: case.pre_tockens_input, value: 65536}
  - id: c-nomask-partial-next
    predicate: {op: lt, field: case.next_tockens_input, value: 65536}
  - id: c-rdc-unequal-s1s2
    predicate: {op: ne, field: case.S2, value: 256}

environment:
  aicNum: {value: 32, source: tests/ut/op_host/arch35/test_flash_attention_score_grad_tiling.cpp:49}
  coreNum: {value: 32, source: tests/ut/op_host/arch35/test_flash_attention_score_grad_tiling.cpp:56}

untestable:
  - id: u-dtype
    kind: control_gap
    reason: Dtype active+unresolved，无 host/uo 绑定，无法构造 dtype 对 tiling 的影响
    needs_binding:
      - {column: Dtype, want: confirmed+active，并证实 dtype→inputDtype/s1TemplateType 传导链}
  - id: u-out-dtype
    kind: control_gap
    reason: out_dtype active+unresolved，无 uo.id，无法控 outDtype TILING_KEY
    needs_binding:
      - {column: out_dtype, want: confirmed+active，并证实 out_dtype kwarg→fBaseParams.outDtype 传导链}
  - id: u-atten-mask-dtype
    kind: control_gap
    reason: Atten_mask_dtype active+unresolved，tensor dtype 无 UO 列映射
    needs_binding:
      - {column: Atten_mask_dtype, want: confirmed+active，并证实 atten_mask_dtype→attenMaskDtype 传导链}
  - id: u-atten-mask-shape
    kind: control_gap
    reason: Atten_mask_shape active+unresolved，isSparse/attenMaskOptional 无 confirmed 列映射
    needs_binding:
      - {column: Atten_mask_shape, want: confirmed+active，并证实 shape→attenMaskOptional 传导链}
  - id: u-pse-shape
    kind: control_gap
    reason: PSE_shape active+unresolved，pseOptional 无 confirmed 列映射
    needs_binding:
      - {column: PSE_shape, want: confirmed+active，并证实 PSE_shape→pseOptional 传导链}
  - id: u-eod
    kind: control_gap
    reason: eod active+unresolved，host isEOD 为派生布尔量非输入 eod 参数
    needs_binding:
      - {column: eod, want: confirmed+active，并证实 eod→tailZeroCount/actualBatch 传导链}
  - id: u-inner-drop
    kind: control_gap
    reason: inner_drop active+unresolved，仅控 drop_mask 造数策略，IsDrop TILING_KEY 由 keepProb 驱动
    needs_binding:
      - {column: inner_drop, want: confirmed+active，并证实 inner_drop→tiling 字段传导链}
  - id: u-is-sink
    kind: control_gap
    reason: is_sink active+unresolved，sink kwarg 存在性无 UO/IsSink 维
    needs_binding:
      - {column: is_sink, want: confirmed+active，并证实 is_sink→sinkOptional 传导链}
