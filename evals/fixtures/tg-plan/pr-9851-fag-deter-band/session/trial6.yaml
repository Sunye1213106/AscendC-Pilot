schema: tg-plan/v3
requirement:
  id: R-fag-deter-band-schedule-mode
  text: >
    新增（PR-9851）：Host `SelectBlockSchedule`→`SelectDeterBandSchedule` 在非 TND 确定性 BAND 路径上写入
    `replay.deterBandScheduleMode`∈{1=CAUSAL,2=DENSE,3=BAND}（`tiling_normal_regbase.cpp:161-212,685-701,2100`；
    唯一写点 `fBaseParams.deterBandScheduleMode`→TDF）。既有：`isSplitByBlockIdx`/`enableSwizzle` 分核框架、
    `DeterSparseType` 分类、`CalCausalSwizzleIndex` legacy 调度（mode=0 时 kernel 仍走旧式 RIGHT_DOWN 因果 swizzle，
    `kernel_deter.h:633-653`）。

    到写点路径条件（合取，含早退否定项）：
    (1) `isDeterministic`（`is_deter=1`）∧ (2) `enableSwizzle`（`probe.enableSwizzle=1`，
    `DoOpTiling:648`）∧ (3) `Input_Layout≠TND` ∧ (4) `splitAxis=BN2GS1S2` ∧ (5) `s1Inner*s1CvRatio=s2Inner*s2CvRatio`
    ∧ (6) `sparseType≠UNSUPPORTED` → `canSplitByBlockIdx`；
    (7) `deterSparseType=DETER_BAND(4)`（`GetDeterSparseTilingKey:1033-1037`）；
    (8) `g=1`（BNSD：`N1=N2`）∧ (9) `coreNum=2*aicNum`（UT `aivNum=64,aicNum=32`）∧ (10) `actualBatch>0` → `hybridBandCond`；
    (11) ¬(`rightDownBandCond`∧`isSplitByBlockIdx`) 其中 `rightDownBandCond=(deterSparseType=DETER_BAND∧sparse_mode=3)`——
    legacy 早退仅当 (11) 合取全真（`185-187`）；否定 `isSplitByBlockIdx` 或走 `sparse_mode∈{0,4}` 等仍可到达写点，
    故 `sparse_mode=3` 不是整支死路径；`(12) SelectDeterBandSchedule` 内部 min-cost 在 {BAND,DENSE,CAUSAL} 间切换。

targets:
  - id: T-deter-band-schedule-mode
    evidence:
      kind: replay_field
      field: replay.deterBandScheduleMode
      expected: [1, 2, 3]

dimensions:
  - id: D-deter-band-schedule-mode
    target: T-deter-band-schedule-mode
    controls: [is_deter, Input_Layout, sparse_mode, Pre_Tockens, Next_Tockens, S1, S2, B, N1, N2, D]
    classifier:
      requires: [replay.deterBandScheduleMode]
    partitions:
      - id: p-causal
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 1}
      - id: p-dense
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 2}
      - id: p-band
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 3}

  - id: D-sparse-band-entry
    target: T-deter-band-schedule-mode
    controls: [sparse_mode, Pre_Tockens, Next_Tockens, S1, S2]
    classifier:
      requires: [case.sparse_mode]
    partitions:
      - id: p-no-mask
        predicate: {op: eq, field: case.sparse_mode, value: 0}
      - id: p-right-down
        predicate: {op: eq, field: case.sparse_mode, value: 3}
      - id: p-band-sparse
        predicate: {op: eq, field: case.sparse_mode, value: 4}

  - id: D-pre-next-tokens
    target: T-deter-band-schedule-mode
    controls: [Pre_Tockens, Next_Tockens, S1, S2]
    classifier:
      requires: [case.Pre_Tockens, case.Next_Tockens]
    partitions:
      - id: p-pre-full-next-zero
        predicate:
          op: and
          args:
            - {op: ge, field: case.Pre_Tockens, value: 65536}
            - {op: eq, field: case.Next_Tockens, value: 0}
      - id: p-pre-band-next-pos
        predicate:
          op: and
          args:
            - {op: ge, field: case.Pre_Tockens, value: 0}
            - {op: ge, field: case.Next_Tockens, value: 0}
      - id: p-pre-full-next-full
        predicate:
          op: and
          args:
            - {op: ge, field: case.Pre_Tockens, value: 65536}
            - {op: ge, field: case.Next_Tockens, value: 65536}

  - id: D-input-layout
    target: T-deter-band-schedule-mode
    controls: [Input_Layout]
    classifier:
      requires: [case.Input_Layout]
    partitions:
      - id: p-bnsd
        predicate: {op: eq, field: case.Input_Layout, value: BNSD}
      - id: p-bsnd
        predicate: {op: eq, field: case.Input_Layout, value: BSND}

  - id: D-g-one-heads
    target: T-deter-band-schedule-mode
    controls: [N1, N2]
    classifier:
      requires: [case.N1, case.N2]
    partitions:
      - id: p-n4g1
        predicate:
          op: and
          args:
            - {op: eq, field: case.N1, value: 4}
            - {op: eq, field: case.N2, value: 4}
      - id: p-n1g1
        predicate:
          op: and
          args:
            - {op: eq, field: case.N1, value: 1}
            - {op: eq, field: case.N2, value: 1}

  - id: D-b-batch
    target: T-deter-band-schedule-mode
    controls: [B, N2]
    classifier:
      requires: [case.B]
    partitions:
      - id: p-b1
        predicate: {op: eq, field: case.B, value: 1}
      - id: p-b2
        predicate: {op: eq, field: case.B, value: 2}

  - id: D-s1-scale
    target: T-deter-band-schedule-mode
    controls: [S1]
    classifier:
      requires: [case.S1]
    partitions:
      - id: p-s1-256
        predicate: {op: eq, field: case.S1, value: 256}
      - id: p-s1-512
        predicate: {op: eq, field: case.S1, value: 512}

  - id: D-s2-scale
    target: T-deter-band-schedule-mode
    controls: [S2]
    classifier:
      requires: [case.S2]
    partitions:
      - id: p-s2-256
        predicate: {op: eq, field: case.S2, value: 256}
      - id: p-s2-512
        predicate: {op: eq, field: case.S2, value: 512}

  - id: D-split-by-block-idx
    target: T-deter-band-schedule-mode
    controls: [is_deter, sparse_mode, S1, B, N1, N2]
    classifier:
      requires: [probe.isSplitByBlockIdx]
    partitions:
      - id: p-split-off
        predicate: {op: eq, field: probe.isSplitByBlockIdx, value: 0}
      - id: p-split-on
        predicate: {op: eq, field: probe.isSplitByBlockIdx, value: 1}

  - id: D-enable-swizzle
    target: T-deter-band-schedule-mode
    controls: [S1, S2, B, D]
    classifier:
      requires: [probe.enableSwizzle, case.S1]
    partitions:
      - id: p-swizzle-s1-512
        predicate:
          op: and
          args:
            - {op: eq, field: probe.enableSwizzle, value: 1}
            - {op: eq, field: case.S1, value: 512}
      - id: p-swizzle-s1-256
        predicate:
          op: and
          args:
            - {op: eq, field: probe.enableSwizzle, value: 1}
            - {op: eq, field: case.S1, value: 256}

guards:
  - id: G-is-deter-off
    target: T-deter-band-schedule-mode
    controls: [is_deter]
    predicate: {op: ne, field: case.is_deter, value: 1}
    negate_hint: {is_deter: 1}

  - id: G-layout-tnd
    target: T-deter-band-schedule-mode
    controls: [Input_Layout]
    predicate: {op: eq, field: case.Input_Layout, value: TND}
    negate_hint: {Input_Layout: BNSD}

  - id: G-s1-too-small-for-swizzle
    target: T-deter-band-schedule-mode
    controls: [S1]
    predicate: {op: lt, field: case.S1, value: 128}
    negate_hint: {S1: 4096}

  - id: G-sparse-all-mask
    target: T-deter-band-schedule-mode
    controls: [sparse_mode]
    predicate: {op: eq, field: case.sparse_mode, value: 1}
    negate_hint: {sparse_mode: 4}

  - id: G-gqa-n1-gt-n2
    target: T-deter-band-schedule-mode
    controls: [N1, N2]
    predicate:
      op: and
      args:
        - {op: mod_eq, left: case.N1, right: case.N2, value: 0}
        - {op: eq, field: case.N2, value: 2}
        - {op: gt, field: case.N1, value: 2}
    negate_hint: {N1: 4, N2: 4}

coverage:
  L0:
    dimensions:
      - D-deter-band-schedule-mode
      - D-sparse-band-entry
      - D-pre-next-tokens
      - D-input-layout
      - D-g-one-heads
      - D-b-batch
      - D-s1-scale
      - D-s2-scale
      - D-split-by-block-idx
      - D-enable-swizzle
  L1:
    combinations:
      - dims: [D-deter-band-schedule-mode, D-sparse-band-entry]
        reason: sparse_mode 驱动 GetDeterSparseTilingKey→DETER_BAND，再进入 SelectDeterBandSchedule 选 1/2/3
      - dims: [D-deter-band-schedule-mode, D-pre-next-tokens]
        reason: Pre_Tockens/Next_Tockens 决定 p,q 带几何，影响 CAUSAL/DENSE/BAND 代价比较
      - dims: [D-deter-band-schedule-mode, D-split-by-block-idx]
        reason: legacy 早退 (rightDown∧split) 与 hybrid 写点分支在 isSplitByBlockIdx 上交互
      - dims: [D-deter-band-schedule-mode, D-enable-swizzle]
        reason: enableSwizzle 门控 canSplitByBlockIdx，决定能否写入非 DISABLED mode
      - dims: [D-sparse-band-entry, D-pre-next-tokens]
        reason: sparse 分类与 token 窗口共同决定 band 归一化参数 m,n,p,q
  L2: []
  L3:
    guards:
      - G-is-deter-off
      - G-layout-tnd
      - G-s1-too-small-for-swizzle
      - G-sparse-all-mask
      - G-gqa-n1-gt-n2

oracle:
  - kind: md5
    columns: [Actual_dq_Md5sum, Actual_dk_Md5sum, Actual_dv_Md5sum]
    when: {op: eq, field: case.is_deter, value: 1}

constraints:
  - id: c-enable-swizzle-on
    predicate: {op: eq, field: probe.enableSwizzle, value: 1}
    reason: canSplitByBlockIdx 要求 enableSwizzle（SelectBlockSchedule:164）
  - id: c-coreNum-eq-2aic
    predicate: {op: eq, field: probe.coreNum, value: 64}
    reason: hybridBandCond coreNum==aicNum*2（tiling_normal_regbase.cpp:194）；UT compileInfo aivNum=64 @ test_flash_attention_score_grad_tiling.cpp:48-56
  - id: c-deter-sparse-band
    predicate: {op: eq, field: probe.deterSparseType, value: 4}
    reason: hybridBandCond 要求 deterSparseType==DETER_BAND（GetDeterSparseTilingKey:1033-1037）

environment:
  aicNum: 32
  coreNum: 64
  source: tests/ut/op_host/arch35/test_flash_attention_score_grad_tiling.cpp:48-56

untestable:
  - id: u-dtype
    kind: control_gap
    reason: Dtype unresolved，无 host TILING_KEY/TILING_FIELD 绑定，无法驱动 deterBandScheduleMode 分岔
    needs_binding:
      - {column: Dtype, want: "confirmed+active，并证实 dtype→tiling 模板选择链"}
  - id: u-out-dtype
    kind: control_gap
    reason: out_dtype unresolved，仅影响输出 dtype 模板，与本写点无 confirmed 传导
    needs_binding:
      - {column: out_dtype, want: "confirmed+active，并证实 out_dtype→deterBandScheduleMode 路径"}
  - id: u-atten-mask-dtype
    kind: control_gap
    reason: Atten_mask_dtype unresolved，mask dtype 未映射到 arch35 host 判定点
    needs_binding:
      - {column: Atten_mask_dtype, want: "confirmed+active，并证实 atten_mask_dtype→sparse/schedule 链"}
  - id: u-atten-mask-shape
    kind: control_gap
    reason: Atten_mask_shape unresolved，shape 列未绑定 host sparse 分类
    needs_binding:
      - {column: Atten_mask_shape, want: "confirmed+active，并证实 atten_mask_shape→sparseType 链"}
  - id: u-pse-shape
    kind: control_gap
    reason: PSE_shape unresolved，PSE tensor shape 未映射 tiling 判定点
    needs_binding:
      - {column: PSE_shape, want: "confirmed+active，并证实 pse_shape→schedule 链"}
  - id: u-eod
    kind: control_gap
    reason: eod unresolved，TND batch trim 无 direct kwarg；host isEOD 为派生布尔
    needs_binding:
      - {column: eod, want: "confirmed+active，并证实 eod→actualBatch/tailZero 传导"}
  - id: u-inner-drop
    kind: control_gap
    reason: inner_drop unresolved，仅控 drop_mask 供数策略，IsDrop 由 keep_prob 驱动
    needs_binding:
      - {column: inner_drop, want: "confirmed+active，并证实 inner_drop→enableSwizzle/schedule 链"}
  - id: u-is-sink
    kind: control_gap
    reason: is_sink unresolved，sink kwarg 存在性无 UO dim 绑定
    needs_binding:
      - {column: is_sink, want: "confirmed+active，并证实 is_sink→tiling 判定点"}
