schema: tg-plan/v3
requirement:
  id: R-fag-deter-band
  text: >
    新增（PR-9851）：SelectDeterBandSchedule/SelectBlockSchedule/DetermineBlockSchedule 在非 TND BNSD 路径写入
    replay.deterBandScheduleMode（CAUSAL=1/DENSE=2/BAND=3）并在 mode≠DISABLED 时覆写 replay.deterMaxRound；
    CalcleCausalDeterParam 在 RIGHT_DOWN_CAUSAL 且 m<n 时将 fBaseParams.deterSparseType 改写为 DETER_BAND(4) 后早退。
    既有：GetDeterSparseTilingKey（DoSparse:889）按 sparse_mode 与 pre/next token 窗口分类 deterSparseType；
    CalcleBandDeterParam 计算 band deterMaxRound；kernel CalDeterMaxLoopNum/CalBandDeterIndex 消费 deterBandScheduleMode。
    到 replay.deterBandScheduleMode 非零写点路径条件（含否定项）：
    is_deter=1 ∧ Input_Layout=BNSD ∧ enableSwizzle=1 ∧ splitAxis=BN2GS1S2
    ∧ s1Inner·s1CvRatio=s2Inner·s2CvRatio ∧ sparseType≠UNSUPPORTED
    ∧ replay.deterSparseType=DETER_BAND(4)
    ∧ g=1(N1=N2) ∧ coreNum=aicNum×2 ∧ actualBatch=(B−tailZeroCount)·N2>0
    ∧ ¬(rightDownBandCond∧isSplitByBlockIdx)（legacy RDC swizzle 早退保持 DISABLED）
    ∧ SelectDeterBandSchedule 参数 k=aicNum,m,n,p,q,b 均>0。
    GetDeterSparseTilingKey→DETER_BAND 否定项：¬(!isDeterministic)；¬denseCondition(含 NO_MASK 且 Pre_Tockens≥S1 且 Next_Tockens≥S2)；
    ¬causalCondition(含 NO_MASK 且 Pre_Tockens≥S1 且 Next_Tockens∈(−128,0]；RIGHT_DOWN_CAUSAL 且 isS1S2Same)。
    NO_MASK→DETER_BAND 依赖 Pre_Tockens/Next_Tockens 窗口（非全窗 dense、非 causal 零窗）。

targets:
  - id: T-deter-band-schedule-mode
    evidence:
      kind: replay_field
      field: replay.deterBandScheduleMode
      expected: 3
  - id: T-deter-sparse-type-band
    evidence:
      kind: replay_field
      field: replay.deterSparseType
      expected: 4
  - id: T-deter-max-round-hybrid
    evidence:
      kind: derived
      predicate: {op: gt, field: replay.deterMaxRound, value: 0}

dimensions:
  - id: D-schedule-mode
    target: T-deter-band-schedule-mode
    controls: []
    classifier: {requires: [replay.deterBandScheduleMode]}
    partitions:
      - id: p-schedule-causal
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 1}
      - id: p-schedule-dense
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 2}
      - id: p-schedule-band
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 3}

  - id: D-deter-sparse-replay
    target: T-deter-sparse-type-band
    controls: []
    classifier: {requires: [replay.deterSparseType]}
    partitions:
      - id: p-deter-sparse-causal
        predicate: {op: eq, field: replay.deterSparseType, value: 3}
      - id: p-deter-sparse-band
        predicate: {op: eq, field: replay.deterSparseType, value: 4}

  - id: D-sparse-mode
    target: T-deter-sparse-type-band
    controls: [sparse_mode]
    classifier: {requires: [case.sparse_mode]}
    partitions:
      - id: p-sparse-nomask
        predicate: {op: eq, field: case.sparse_mode, value: 0}
      - id: p-sparse-rdcausal
        predicate: {op: eq, field: case.sparse_mode, value: 3}
      - id: p-sparse-band
        predicate: {op: eq, field: case.sparse_mode, value: 4}

  - id: D-token-next
    target: T-deter-sparse-type-band
    controls: [Next_Tockens]
    classifier: {requires: [case.Next_Tockens]}
    partitions:
      - id: p-next-band-window
        predicate: {op: and, args: [{op: gt, field: case.Next_Tockens, value: 0}, {op: lt, field: case.Next_Tockens, value: 16}]}
      - id: p-next-causal-zero
        predicate: {op: eq, field: case.Next_Tockens, value: 0}

  - id: D-token-pre
    target: T-deter-sparse-type-band
    controls: [Pre_Tockens]
    classifier: {requires: [case.Pre_Tockens]}
    partitions:
      - id: p-pre-full
        predicate: {op: ge, field: case.Pre_Tockens, value: 16}
      - id: p-pre-short
        predicate: {op: lt, field: case.Pre_Tockens, value: 16}

  - id: D-s1s2-shape
    target: T-deter-band-schedule-mode
    controls: [S1, S2]
    classifier: {requires: [case.S1, case.S2]}
    partitions:
      - id: p-s1s2-square
        predicate: {op: and, args: [{op: eq, field: case.S1, value: 16}, {op: eq, field: case.S2, value: 16}]}
      - id: p-s1s2-tall
        predicate: {op: and, args: [{op: eq, field: case.S1, value: 32}, {op: eq, field: case.S2, value: 16}]}

  - id: D-batch-b
    target: T-deter-band-schedule-mode
    controls: [B]
    classifier: {requires: [case.B]}
    partitions:
      - id: p-b-even
        predicate: {op: mod_eq, left: {field: case.B}, divisor: 2, value: 0}
      - id: p-b-odd
        predicate: {op: mod_eq, left: {field: case.B}, divisor: 2, value: 1}

  - id: D-n1-head
    target: T-deter-band-schedule-mode
    controls: [N1, N2]
    classifier: {requires: [case.N1, case.N2]}
    partitions:
      - id: p-n1n2-4
        predicate: {op: and, args: [{op: eq, field: case.N1, value: 4}, {op: eq, field: case.N2, value: 4}]}
      - id: p-n1n2-8
        predicate: {op: and, args: [{op: eq, field: case.N1, value: 8}, {op: eq, field: case.N2, value: 8}]}

  - id: D-use-lower-causal
    target: T-deter-band-schedule-mode
    controls: []
    classifier: {requires: [probe.useLowerCausal]}
    partitions:
      - id: p-use-lower-causal-off
        predicate: {op: eq, field: probe.useLowerCausal, value: 0}
      - id: p-use-lower-causal-on
        predicate: {op: eq, field: probe.useLowerCausal, value: 1}

  - id: D-hybrid-band-entry
    target: T-deter-band-schedule-mode
    controls: []
    classifier: {requires: [probe.hybridBandCond]}
    partitions:
      - id: p-hybrid-band-on
        predicate: {op: eq, field: probe.hybridBandCond, value: 1}
      - id: p-hybrid-band-off
        predicate: {op: eq, field: probe.hybridBandCond, value: 0}

  - id: D-max-round-tier
    target: T-deter-max-round-hybrid
    controls: []
    classifier: {requires: [replay.deterMaxRound]}
    partitions:
      - id: p-maxround-moderate
        predicate: {op: and, args: [{op: gt, field: replay.deterMaxRound, value: 0}, {op: le, field: replay.deterMaxRound, value: 512}]}
      - id: p-maxround-large
        predicate: {op: gt, field: replay.deterMaxRound, value: 512}

guards:
  - id: G-is-deter-off
    target: T-deter-band-schedule-mode
    controls: [is_deter]
    predicate: {op: eq, field: case.is_deter, value: 0}
    negate_hint: {is_deter: 1}

  - id: G-layout-tnd
    target: T-deter-band-schedule-mode
    controls: [Input_Layout]
    predicate: {op: eq, field: case.Input_Layout, value: TND}
    negate_hint: {Input_Layout: BNSD}

  - id: G-sparse-all-mask
    target: T-deter-sparse-type-band
    controls: [sparse_mode]
    predicate: {op: eq, field: case.sparse_mode, value: 1}
    negate_hint: {sparse_mode: 0}

  - id: G-sparse-prefix
    target: T-deter-band-schedule-mode
    controls: [sparse_mode]
    predicate: {op: in, field: case.sparse_mode, values: [5, 6]}
    negate_hint: {sparse_mode: 0}

  - id: G-rope-on
    target: T-deter-band-schedule-mode
    controls: [rope]
    predicate: {op: eq, field: case.rope, value: 1}
    negate_hint: {rope: 0}

coverage:
  L0:
    dimensions:
      - D-schedule-mode
      - D-deter-sparse-replay
      - D-sparse-mode
      - D-token-next
      - D-token-pre
      - D-s1s2-shape
      - D-batch-b
      - D-n1-head
      - D-use-lower-causal
      - D-hybrid-band-entry
      - D-max-round-tier
  L1:
    combinations:
      - dims: [D-sparse-mode, D-token-next]
        reason: NO_MASK→DETER_BAND 由 Pre_Tockens/Next_Tockens 窗口相对 S1/S2 决定，与 sparse_mode 合取分类 GetDeterSparseTilingKey
      - dims: [D-sparse-mode, D-token-pre]
        reason: NO_MASK dense/causal/band 三分支依赖 Pre_Tockens 是否覆盖 S1 与 Next_Tockens 组合
      - dims: [D-sparse-mode, D-s1s2-shape]
        reason: RIGHT_DOWN_CAUSAL 下 m/n 与 isS1S2Same 决定 DETER_CAUSAL vs DETER_BAND 及 SelectDeterBandSchedule 几何
      - dims: [D-schedule-mode, D-use-lower-causal]
        reason: useLowerCausal 为 SelectDeterBandSchedule 选择 CAUSAL(1) vs BAND/DENSE 的比较分支
      - dims: [D-batch-b, D-schedule-mode]
        reason: actualBatch 奇偶进入 CAUSAL 嵌入 pairRound/tailRound 与 maxRound 比较
      - dims: [D-s1s2-shape, D-n1-head]
        reason: s1Outer/s2Outer 与 N1=N2 决定 NormalizeDeterBandScheduleParams 的 m,n 及 bandBlocks
      - dims: [D-hybrid-band-entry, D-schedule-mode]
        reason: hybridBandCond 为写入非 DISABLED deterBandScheduleMode 的总门；probe 区分可达 vs legacy/off 路径
      - dims: [D-sparse-mode, D-deter-sparse-replay]
        reason: sparse_mode 路由 GetDeterSparseTilingKey，replay 观测最终 DETER_CAUSAL(3) vs DETER_BAND(4)
  L2:
    combinations:
      - dims: [D-sparse-mode, D-token-next, D-s1s2-shape]
        reason: NO_MASK/RDC/BAND 三路 token 窗口与 S1/S2 比例共同决定 band 几何与 schedule mode 三元比较
  L3:
    guards:
      - G-is-deter-off
      - G-layout-tnd
      - G-sparse-all-mask
      - G-sparse-prefix
      - G-rope-on

oracle:
  - id: O-dq-md5
    kind: md5
    reason: is_deter=1 时 runner 落盘 dq.bin 并回写 Actual_dq_Md5sum；schedule 重排影响确定性输出
  - id: O-dk-md5
    kind: md5
    reason: is_deter=1 时 runner 落盘 dk.bin 并回写 Actual_dk_Md5sum；band schedule 改变 kernel 遍历序
  - id: O-dv-md5
    kind: md5
    reason: is_deter=1 时 runner 落盘 dv.bin 并回写 Actual_dv_Md5sum；deterMaxRound 变化需 md5 回归

constraints:
  - id: C-is-deter-on
    predicate: {op: eq, field: case.is_deter, value: 1}
  - id: C-layout-bnsd
    predicate: {op: eq, field: case.Input_Layout, value: BNSD}
  - id: C-enable-swizzle
    predicate: {op: eq, field: probe.enableSwizzle, value: 1}
  - id: C-g-equals-one
    predicate: {op: eq, field: case.N1, field: case.N2}
  - id: C-keep-prob-one
    predicate: {op: eq, field: case.Drop_Out_Possibility, value: 1}

environment:
  aicNum: 32
  coreNum: 64

untestable:
  - id: u-dtype
    kind: control_gap
    reason: Dtype unresolved+active，驱动 queryType/模板选择与 CheckExceedL2Cache inputSize，影响 enableSwizzle 间接门但表列无 confirmed UO 绑定
    needs_binding:
      - {column: Dtype, want: "confirmed+active，并证实 Dtype→queryType→enableSwizzle 传导链"}
  - id: u-out-dtype
    kind: control_gap
    reason: out_dtype unresolved+active
    needs_binding:
      - {column: out_dtype, want: "confirmed+active"}
  - id: u-atten-mask-dtype
    kind: control_gap
    reason: Atten_mask_dtype unresolved+active
    needs_binding:
      - {column: Atten_mask_dtype, want: "confirmed+active"}
  - id: u-atten-mask-shape
    kind: control_gap
    reason: Atten_mask_shape unresolved+active
    needs_binding:
      - {column: Atten_mask_shape, want: "confirmed+active"}
  - id: u-pse-shape
    kind: control_gap
    reason: PSE_shape unresolved+active
    needs_binding:
      - {column: PSE_shape, want: "confirmed+active"}
  - id: u-eod
    kind: control_gap
    reason: eod unresolved+active
    needs_binding:
      - {column: eod, want: "confirmed+active"}
  - id: u-inner-drop
    kind: control_gap
    reason: inner_drop unresolved+active
    needs_binding:
      - {column: inner_drop, want: "confirmed+active"}
  - id: u-is-sink
    kind: control_gap
    reason: is_sink unresolved+active
    needs_binding:
      - {column: is_sink, want: "confirmed+active"}
