schema: tg-plan/v3
requirement:
  id: R-fag-deter-band
  text: >
    新增（PR-9851）：host SelectDeterBandSchedule/SelectBlockSchedule/DetermineBlockSchedule
    在 InitTilingData 写 replay.deterBandScheduleMode（tiling_normal_regbase.cpp:2100），并在
    mode!=DISABLED 时覆写 fBaseParams.deterMaxRound（:691）且置 isSplitByBlockIdx=true（:209-210）。
    kernel CalDeterMaxLoopNum/CalBandDeterIndex 按 replay.deterBandScheduleMode 走 CAUSAL(1)/DENSE(2)/BAND(3)
    三支（kernel_deter.h:692-714, :507-530）。既有：GetDeterSparseTilingKey→DeterType=4(DETER_BAND)、
    CalcleBandDeterParam 前缀/轮次；legacy RIGHT_DOWN_CAUSAL swizzle 在
    rightDownBandCond&&isSplitByBlockIdx 早退且 schedule 保持 DISABLED(0)（:185-187）。

    到 replay.deterBandScheduleMode∈{1,2,3} 的路径合取（否定项已标 ¬）：
    isDeterministic(¬!is_deter)；enableSwizzle=((isExceedL2Cache||isLargeInvalidBlk)&&blockOuter==aicNum)(:648)；
    canSplitByBlockIdx=enableSwizzle∧layoutType!=TND∧splitAxis==BN2GS1S2∧s1Inner*s1CvRatio==s2Inner*s2CvRatio
    ∧sparseType!=UNSUPPORTED(:164-167)；hybridBandCond=canSplitByBlockIdx∧deterSparseType==DETER_BAND∧g==1
    ∧coreNum==aicNum*2∧actualBatch>0(:192-194)；¬(rightDownBandCond∧isSplitByBlockIdx)(:185-187)；
    SelectDeterBandSchedule 内 k,m,n,p,q,b>0(:86-88)。deterSparseType==DETER_BAND 析取支：
    sparse_mode∈{NO_MASK(0),BAND(4)} 且 ¬dense 分支(¬(pre>=S1∧next>=S2)) 且 ¬causal 分支(:1033-1037)；
    sparse_mode=RIGHT_DOWN_CAUSAL(3) 仅 legacy 支可达 expected=0。mode 选择：默认 BAND(3)，
    denseRound<bandRound→DENSE(2)(:125-130)，useLowerCausal→CAUSAL(1)(:140-156)。

targets:
  - id: T-deter-band-schedule
    evidence:
      kind: derived
      predicate: {op: in, field: replay.deterBandScheduleMode, values: [1, 2, 3]}

dimensions:
  - id: D-schedule-mode
    target: T-deter-band-schedule
    controls: [S1, S2, B, N2, Pre_Tockens, Next_Tockens]
    classifier: {requires: [replay.deterBandScheduleMode]}
    partitions:
      - id: p-causal
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 1}
      - id: p-dense
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 2}
      - id: p-band
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 3}

  - id: D-sparse-arm
    target: T-deter-band-schedule
    controls: [sparse_mode, Pre_Tockens, Next_Tockens, S1, S2]
    classifier: {requires: [case.sparse_mode]}
    partitions:
      - id: p-no-mask-band
        predicate: {op: eq, field: case.sparse_mode, value: 0}
      - id: p-band-sparse
        predicate: {op: eq, field: case.sparse_mode, value: 4}

  - id: D-seq-scale
    target: T-deter-band-schedule
    controls: [S1, S2, B, D]
    classifier: {requires: [case.S1, case.S2]}
    partitions:
      - id: p-swizzle-large
        predicate: {op: ge, field: case.S1, value: 4096}
      - id: p-swizzle-mid
        predicate: {op: eq, field: case.S1, value: 1024}

  - id: D-head-gqa
    target: T-deter-band-schedule
    controls: [N1, N2]
    classifier: {requires: [case.N1, case.N2]}
    partitions:
      - id: p-g1-mha
        predicate:
          op: and
          args:
            - {op: eq, field: case.N1, value: 4}
            - {op: eq, field: case.N2, value: 4}
      - id: p-g2-gqa
        predicate:
          op: and
          args:
            - {op: eq, field: case.N1, value: 4}
            - {op: eq, field: case.N2, value: 2}

  - id: D-layout
    target: T-deter-band-schedule
    controls: [Input_Layout]
    classifier: {requires: [case.Input_Layout]}
    partitions:
      - id: p-bnsd
        predicate: {op: eq, field: case.Input_Layout, value: BNSD}
      - id: p-sbh
        predicate: {op: eq, field: case.Input_Layout, value: SBH}

  - id: D-batch-parity
    target: T-deter-band-schedule
    controls: [B, N2]
    classifier: {requires: [case.B]}
    partitions:
      - id: p-even-batch
        predicate: {op: mod_eq, left: {field: case.B}, divisor: 2, value: 0}
      - id: p-odd-batch
        predicate: {op: mod_eq, left: {field: case.B}, divisor: 2, value: 1}

guards:
  - id: G-non-deter
    target: T-deter-band-schedule
    controls: [is_deter]
    predicate: {op: eq, field: case.is_deter, value: 0}
    negate_hint: {is_deter: 1}

  - id: G-legacy-rdc-swizzle
    target: T-deter-band-schedule
    controls: [sparse_mode]
    predicate: {op: eq, field: case.sparse_mode, value: 3}
    negate_hint: {sparse_mode: 0}

  - id: G-tnd-layout
    target: T-deter-band-schedule
    controls: [Input_Layout]
    predicate: {op: eq, field: case.Input_Layout, value: TND}
    negate_hint: {Input_Layout: BNSD}

coverage:
  L0:
    dimensions: [D-schedule-mode, D-sparse-arm, D-seq-scale, D-head-gqa, D-layout, D-batch-parity]
  L1:
    combinations:
      - dims: [D-schedule-mode, D-sparse-arm]
        reason: sparse_mode 决定 deterSparseType 分支；Pre/Next_Tockens 与 S1/S2 决定 SelectDeterBandSchedule 的 p/q 与三支比较
      - dims: [D-schedule-mode, D-seq-scale]
        reason: S1/S2 规模同时影响 enableSwizzle 与 BAND/DENSE/CAUSAL 代价比较
      - dims: [D-sparse-arm, D-layout]
        reason: canSplitByBlockIdx 要求非 TND；sparse_mode 与 layout 共同决定 sparseType 与 band 几何
  L2:
    combinations:
      - dims: [D-schedule-mode, D-batch-parity]
        reason: CAUSAL schedule 的 pairCount=b/2 与 odd-batch tail（SelectDeterBandSchedule:143-151）
  L3:
    guards: [G-non-deter, G-legacy-rdc-swizzle, G-tnd-layout]

oracle:
  - kind: md5
    fields: [Actual_dq_Md5sum, Actual_dk_Md5sum, Actual_dv_Md5sum]
    when: {op: eq, field: case.is_deter, value: 1}

constraints:
  - id: C-hybrid-band-core-ratio
    reason: hybridBandCond 要求 coreNum==aicNum*2（SelectBlockSchedule:194）；coreNum 取自 aivNum（tiling_normal_regbase.cpp:590）
  - id: C-g-equals-one
    reason: hybridBandCond 要求 g==1 即 N1==N2（SelectBlockSchedule:194）；p-g2-gqa 分区预期 replay=0，仅作负例/legacy 覆盖
  - id: C-swizzle-block-outer
    reason: enableSwizzle 要求 blockOuter==aicNum（DoOpTiling:648）
  - id: C-non-dense-tokens
    reason: GetDeterSparseTilingKey 落 DETER_BAND 需 ¬(pre>=S1∧next>=S2)（:1023-1024,:1033-1037）

environment:
  aicNum: 32
  coreNum: 64

untestable:
  - id: u-dtype
    kind: control_gap
    reason: Dtype 列 unresolved，无 host TILING_FIELD/KEY 绑定，无法构造 dtype 驱动的 split/swizzle 差异
    needs_binding:
      - {column: Dtype, want: "confirmed+active，并证实到 deterBandScheduleMode 写点传导链"}
  - id: u-out-dtype
    kind: control_gap
    reason: out_dtype 列 unresolved，未映射到 arch35 host 可控面
    needs_binding:
      - {column: out_dtype, want: "confirmed+active，并证实到 replay.deterBandScheduleMode 传导链"}
  - id: u-atten-mask-dtype
    kind: control_gap
    reason: Atten_mask_dtype 列 unresolved，sparseType 推导链不可直接列控
    needs_binding:
      - {column: Atten_mask_dtype, want: "confirmed+active，并证实到 sparseType!=UNSUPPORTED 路径项"}
  - id: u-atten-mask-shape
    kind: control_gap
    reason: Atten_mask_shape 列 unresolved，isSparse/atten_mask 存在性不可列控
    needs_binding:
      - {column: Atten_mask_shape, want: "confirmed+active，并证实到 GetDeterSparseTilingKey 分支"}
  - id: u-pse-shape
    kind: control_gap
    reason: PSE_shape 列 unresolved，不影响 deterBandScheduleMode 写点的已证实列控
    needs_binding:
      - {column: PSE_shape, want: "confirmed+active，并证实与 deter band schedule 交互"}
  - id: u-eod
    kind: control_gap
    reason: eod 列 unresolved，host isEOD 为派生布尔非输入列（init candidate isEOD）
    needs_binding:
      - {column: eod, want: "confirmed+active，并证实 actualBatch/tailZeroCount 传导链"}
  - id: u-inner-drop
    kind: control_gap
    reason: inner_drop 列 unresolved，IsDrop TILING_KEY 由 keepProb 驱动非 inner_drop
    needs_binding:
      - {column: inner_drop, want: "confirmed+active，并证实到确定性 band schedule 路径"}
  - id: u-is-sink
    kind: control_gap
    reason: is_sink 列 unresolved，sink kwarg 存在性无 UO 绑定
    needs_binding:
      - {column: is_sink, want: "confirmed+active，并证实到 tiling 写点"}

