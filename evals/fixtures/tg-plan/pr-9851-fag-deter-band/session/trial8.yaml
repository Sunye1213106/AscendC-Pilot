schema: tg-plan/v3
requirement:
  id: R-fag-deter-band-schedule
  text: >
    新增（host）：DeterBandScheduleMode 枚举、DeterBandScheduleResult/BlockScheduleResult 结构体、
    NormalizeDeterBandScheduleParams、CalcCausalSingleBatchRound、SelectDeterBandSchedule；
    改动（host）：SelectBlockSchedule、DetermineBlockSchedule（写点
    fBaseParams.deterBandScheduleMode，replay 落盘 tiling_data_regbase.h:139）。
    新增/改动（kernel）：CalBandDeterIndex、CalDeterMaxLoopNum（flash_attention_score_grad_kernel_deter.h），
    只读 replay.deterBandScheduleMode / isSplitByBlockIdx；deter.h、flash_attention_score_grad_block_vec.h、
    flash_attention_score_grad_tiling_data_regbase.h 同步字段/枚举。
    Target HIT：replay.deterBandScheduleMode∈{1,2,3}（CAUSAL/DENSE/BAND）。
    路径合取（否定项）：is_deter=1；Input_Layout≠TND；N1=N2（g=1）；enableSwizzle=1∧splitAxis=BN2GS1S2∧
    s1Inner·s1CvRatio=s2Inner·s2CvRatio∧sparseType≠UNSUPPORTED；isDeterministic=1；
    deterSparseType=DETER_BAND（GetDeterSparseTilingKey，sparse_mode 0/2 或 3+奇数 B·N2 绕过 legacy）；
    coreNum=aicNum·2（platform）；actualBatch>0；¬(rightDownBandCond∧isSplitByBlockIdx) 早退（sparse_mode=3
    偶数 batch 走 legacy DISABLED=0，非本 Target）；hybridBandCond 成立 → SelectDeterBandSchedule 按代价选 1/2/3。
    既有：isSplitByBlockIdx 布尔语义保留；DISABLED=0 为默认/legacy，非 Target。

targets:
  - id: T-deterBandScheduleMode
    evidence:
      kind: derived
      predicate: {op: in, field: replay.deterBandScheduleMode, values: [1, 2, 3]}

dimensions:
  - id: D-deterBandScheduleMode
    target: T-deterBandScheduleMode
    controls: [B, S1, S2, Pre_Tockens, Next_Tockens, sparse_mode]
    classifier: {requires: [replay.deterBandScheduleMode]}
    partitions:
      - id: p-causal
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 1}
      - id: p-dense
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 2}
      - id: p-band
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 3}

  - id: D-sparse-entry
    target: T-deterBandScheduleMode
    controls: [sparse_mode, Pre_Tockens, Next_Tockens, S1, S2]
    classifier: {requires: [case.sparse_mode]}
    partitions:
      - id: p-no-mask-band
        predicate: {op: eq, field: case.sparse_mode, value: 0}
      - id: p-explicit-band
        predicate: {op: eq, field: case.sparse_mode, value: 2}

  - id: D-batch-parity
    target: T-deterBandScheduleMode
    controls: [B, N2]
    classifier: {requires: [case.B]}
    partitions:
      - id: p-even-batch
        predicate: {op: mod_eq, field: case.B, divisor: 2, value: 0}
      - id: p-odd-batch
        predicate: {op: mod_eq, field: case.B, divisor: 2, value: 1}

  - id: D-band-token
    target: T-deterBandScheduleMode
    controls: [Pre_Tockens, Next_Tockens, S1, S2]
    classifier: {requires: [case.Next_Tockens]}
    partitions:
      - id: p-wide-next
        predicate: {op: eq, field: case.Next_Tockens, value: 65536}
      - id: p-narrow-next
        predicate: {op: eq, field: case.Next_Tockens, value: 128}

guards:
  - id: G-is-deter-off
    target: T-deterBandScheduleMode
    controls: [is_deter]
    predicate: {op: eq, field: case.is_deter, value: 0}
    negate_hint: {is_deter: 1}

  - id: G-layout-tnd
    target: T-deterBandScheduleMode
    controls: [Input_Layout]
    predicate: {op: eq, field: case.Input_Layout, value: TND}
    negate_hint: {Input_Layout: BNSD}

  - id: G-gqa-g-ne-1
    target: T-deterBandScheduleMode
    controls: [N1, N2]
    predicate:
      op: and
      args:
        - {op: eq, field: case.N1, value: 4}
        - {op: eq, field: case.N2, value: 2}
    negate_hint: {N1: 4, N2: 1}

coverage:
  L0:
    dimensions: [D-deterBandScheduleMode, D-sparse-entry, D-batch-parity, D-band-token]
  L1:
    combinations:
      - dims: [D-deterBandScheduleMode, D-batch-parity]
        reason: >
          SelectDeterBandSchedule 选 CAUSAL(1) 时 CalBandDeterIndex 对 (b&1)≠0 走
          CalCausalSingleBatchDeterIndex 尾段；偶数 batch 走 CalCausalSwizzleIndex 配对段。
      - dims: [D-deterBandScheduleMode, D-band-token]
        reason: >
          Pre_Tockens/Next_Tockens 经 NormalizeDeterBandScheduleParams 决定 (p,q) 与
          denseRound/causalRound/bandRound 比较，影响 SelectDeterBandSchedule 在 1/2/3 间切换。
  L2: []
  L3:
    guards: [G-is-deter-off, G-layout-tnd, G-gqa-g-ne-1]

oracle:
  - id: o-dq-md5
    kind: md5
    column: Actual_dq_Md5sum
    tensor: dq
  - id: o-dk-md5
    kind: md5
    column: Actual_dk_Md5sum
    tensor: dk
  - id: o-dv-md5
    kind: md5
    column: Actual_dv_Md5sum
    tensor: dv

constraints:
  - id: c-enable-swizzle
    predicate: {op: eq, field: probe.enableSwizzle, value: 1}
  - id: c-deter-band-sparse-type
    predicate: {op: eq, field: probe.deterSparseType, value: 4}
  - id: c-g-eq-1
    predicate: {op: eq, field: probe.g, value: 1}

environment:
  aicNum: 32
  coreNum: 64

untestable:
  - id: u-dtype
    kind: control_gap
    reason: Dtype 列 unresolved，无 host TILING_FIELD/KEY 绑定，无法证伪 dtype 分岔对 deterBandScheduleMode 的影响。
    needs_binding:
      - {column: Dtype, want: "confirmed+active，并证实 dtype→inputDtype→tiling key 传导链"}
  - id: u-out-dtype
    kind: control_gap
    reason: out_dtype 列 unresolved，未映射到 deter band schedule 写点谓词。
    needs_binding:
      - {column: out_dtype, want: "confirmed+active，并证实 out_dtype→replay 观测链"}
  - id: u-atten-mask-dtype
    kind: control_gap
    reason: Atten_mask_dtype unresolved，mask dtype 不经 SelectBlockSchedule/SelectDeterBandSchedule。
    needs_binding:
      - {column: Atten_mask_dtype, want: "confirmed+active，并证实 atten_mask dtype 到 sparseType 链"}
  - id: u-atten-mask-shape
    kind: control_gap
    reason: Atten_mask_shape unresolved，shape 空/non-empty 未绑定到 band schedule 判定点。
    needs_binding:
      - {column: Atten_mask_shape, want: "confirmed+active，并证实 Atten_mask_shape→isSparse/sparseType 链"}
  - id: u-pse-shape
    kind: control_gap
    reason: PSE_shape unresolved，PSE tensor 形状不进入 deterBandScheduleMode 写点。
    needs_binding:
      - {column: PSE_shape, want: "confirmed+active，并证实 PSE_shape→host tiling 分岔链"}
  - id: u-eod
    kind: control_gap
    reason: eod 列 partial（isEOD 为派生布尔非输入），TND batch trim 不可直接构造。
    needs_binding:
      - {column: eod, want: "confirmed+active，并证实 eod→actualBatch/tailZeroCount 传导链"}
  - id: u-inner-drop
    kind: control_gap
    reason: inner_drop unresolved，驱动 drop_mask 造数策略而非 IsDrop/schedule 写点。
    needs_binding:
      - {column: inner_drop, want: "confirmed+active，并证实 inner_drop→tiling key 或 schedule 链"}
  - id: u-is-sink
    kind: control_gap
    reason: is_sink unresolved，sink kwarg 存在性无 replay 观测绑定到 band schedule。
    needs_binding:
      - {column: is_sink, want: "confirmed+active，并证实 is_sink→kernel 分岔观测链"}
