schema: tg-plan/v3
requirement:
  id: R-deter-band-schedule
  text: >
    本次 PR 新增 DeterBandScheduleMode 枚举（DISABLED=0, CAUSAL=1, DENSE=2, BAND=3）和 deterBandScheduleMode
    TILING_FIELD（flash_attention_score_grad_tiling_data_regbase.h:139，新增）。Host 新增 SelectDeterBandSchedule
    （tiling_normal_regbase.cpp:83，新增）与 SelectBlockSchedule 调用链（tiling_normal_regbase.cpp:161，新增），按
    aicNum/m/n/p/q/b 的 round 比较写入 fBaseParams.deterBandScheduleMode 并最终落盘 replay.deterBandScheduleMode
    （tiling_normal_regbase.cpp:2100，新增写点）。既有 isSplitByBlockIdx（tiling_data_regbase.h:133）本次新增联动：
    mode != DISABLED 时强制 isSplitByBlockIdx=true（tiling_normal_regbase.cpp:209-210，新增）。既有
    CalBandDeterIndex / CalDeterMaxLoopNum（kernel_deter.h:489/590）新增按 replay.deterBandScheduleMode 分支。
    到写点路径条件（含早退否定项）：(1) 既有 isDeterministic=true（case.is_deter=1），否定 SelectBlockSchedule L169
    ¬isDeterministic 早退；(2) 既有 canSplitByBlockIdx：enableSwizzle ∧ layoutType≠TND ∧ splitAxis==BN2GS1S2 ∧
    s1Inner×s1CvRatio==s2Inner×s2CvRatio ∧ sparseType≠UNSUPPORTED；(3) 既有 deterSparseType==DETER_BAND（由 case.sparse_mode
    经 GetDeterSparseTilingKey 推导）；(4) 环境 coreNum==aicNum×2（platform aicNum）；(5) 派生 g==1（case.N1==case.N2）、
    actualBatch=(B-tailZeroCount)×N2>0；(6) 新增 hybridBandCond=true（probe.hybridBandCond=1），否定 L195 ¬hybridBandCond
    早退；(7) 新增 ¬(rightDownBandCond ∧ isSplitByBlockIdx) legacy 保留下界，否定 L185 早退（RIGHT_DOWN_CAUSAL 且
    isSplitByBlockIdx 时 schedule 保持 DISABLED）；(8) 新增 SelectDeterBandSchedule 需 k,m,n,p,q,b>0（否定 L86-88
    无效参数早退）。RIGHT_DOWN_CAUSAL（sparse_mode=3）在 legacy 门满足时不可达 mode>0，应用 sparse_mode=4 或 NO_MASK 非 dense
    token 入口。

targets:
  - id: T-deter-band-schedule-active
    evidence:
      kind: derived
      predicate: {op: gt, field: replay.deterBandScheduleMode, value: 0}
  - id: T-is-split-by-block-idx-on
    evidence:
      kind: derived
      predicate: {op: eq, field: replay.isSplitByBlockIdx, value: 1}

dimensions:
  - id: D-sparse-band-entry
    target: T-deter-band-schedule-active
    controls: [sparse_mode, is_deter]
    classifier:
      requires: [case.sparse_mode, case.is_deter]
    construct_hint:
      columns: [sparse_mode, is_deter, Input_Layout, B, N1, N2, S1, S2, Pre_Tockens, Next_Tockens]
    partitions:
      - id: p-band-deter
        predicate:
          op: and
          args:
            - {op: eq, field: case.sparse_mode, value: 4}
            - {op: eq, field: case.is_deter, value: 1}
      - id: p-no-mask-band-deter
        predicate:
          op: and
          args:
            - {op: eq, field: case.sparse_mode, value: 0}
            - {op: eq, field: case.is_deter, value: 1}

  - id: D-deter-band-schedule-mode
    target: T-deter-band-schedule-active
    controls: [S1, S2, B, N1, N2]
    classifier:
      requires: [replay.deterBandScheduleMode]
    partitions:
      - id: p-disabled
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 0}
      - id: p-causal
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 1}
      - id: p-dense
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 2}
      - id: p-band
        predicate: {op: eq, field: replay.deterBandScheduleMode, value: 3}

  - id: D-probe-hybrid-band-cond
    target: T-deter-band-schedule-active
    controls: [Input_Layout, S1, S2]
    classifier:
      requires: [probe.hybridBandCond]
    partitions:
      - id: p-hybrid-on
        predicate: {op: eq, field: probe.hybridBandCond, value: 1}
      - id: p-hybrid-off
        predicate: {op: eq, field: probe.hybridBandCond, value: 0}

  - id: D-is-split-by-block-idx
    target: T-is-split-by-block-idx-on
    controls: [is_deter, sparse_mode]
    classifier:
      requires: [replay.isSplitByBlockIdx]
    partitions:
      - id: p-split-on
        predicate: {op: eq, field: replay.isSplitByBlockIdx, value: 1}
      - id: p-split-off
        predicate: {op: eq, field: replay.isSplitByBlockIdx, value: 0}

guards:
  - id: G-is-deter-off
    target: T-deter-band-schedule-active
    controls: [is_deter]
    predicate: {op: eq, field: case.is_deter, value: 0}
    negate_hint: {is_deter: 1}
  - id: G-legacy-rd-causal
    target: T-deter-band-schedule-active
    controls: [sparse_mode]
    predicate: {op: eq, field: case.sparse_mode, value: 3}
    negate_hint: {sparse_mode: 4}

coverage:
  L0:
    dimensions: [D-sparse-band-entry, D-deter-band-schedule-mode, D-probe-hybrid-band-cond, D-is-split-by-block-idx]
  L1:
    combinations:
      - dims: [D-sparse-band-entry, D-deter-band-schedule-mode]
        reason: sparse_mode 决定 deterSparseType 是否为 DETER_BAND 进入 SelectDeterBandSchedule，S1/S2/B/N 形状决定 round 比较选 CAUSAL/DENSE/BAND
      - dims: [D-probe-hybrid-band-cond, D-deter-band-schedule-mode]
        reason: hybridBandCond 是 SelectDeterBandSchedule 唯一入口门，mode 非零分区仅能在 probe.hybridBandCond=1 出现
      - dims: [D-deter-band-schedule-mode, D-is-split-by-block-idx]
        reason: 新增 linkage：mode∈{1,2,3} 时 host 强制 isSplitByBlockIdx=true（L209-210）
  L2: []
  L3:
    guards: [G-is-deter-off, G-legacy-rd-causal]

oracle: []

constraints:
  - id: C-non-tnd
    predicate: {op: eq, field: case.Input_Layout, value: BNSD}
  - id: C-n1-eq-n2-g1
    predicate: {op: eq, field: case.N1, value: 4}
  - id: C-n2-eq-n1-g1
    predicate: {op: eq, field: case.N2, value: 4}
  - id: C-b-even
    predicate: {op: mod_eq, left: case.B, divisor: 2, value: 0}
  - id: C-s1-ge-aicnum128
    predicate: {op: ge, field: case.S1, value: 1024}
  - id: C-s2-fixed
    predicate: {op: eq, field: case.S2, value: 2048}
  - id: C-s1-lt-s2
    predicate: {op: lt, field: case.S1, value: 2048}
  - id: C-pre-lt-s1-no-mask
    predicate: {op: lt, field: case.Pre_Tockens, value: 1024}

environment:
  aicNum: 8
