version: 1
skill: testcase-generation
mode: dry
cases:
  - id: bind_init_columns
    query: 把测试脚本仓列映射到 CodeMap，写出 init.yaml，有仓但 mapping 空则失败
    expect_skill: testcase-generation
    forbid_skill: ce-review

  - id: plan_fuse_columns
    query: 把意图融进 plan.md 义务表，控制面是 CSV 列不是 T=D，指标只有 replay 和 derived
    expect_skill: testcase-generation
    expect_references:
      - references/planning.md
      - references/plan-heuristics.md

  - id: solve_worklog
    query: 构造脚本可读的 cases 表，Host tiling 回放，worklog 四段直到 open 为空
    expect_skill: testcase-generation
    expect_references:
      - references/oracle.md

  - id: harness_intent
    query: 算子有 INPUT 但 CSV 缺列，先 CE apply 测试脚本仓再 tg-init，禁止 start solve
    expect_skill: testcase-generation
    expect_references:
      - references/test-script-repo.md
