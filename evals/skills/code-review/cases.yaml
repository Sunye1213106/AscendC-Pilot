version: 1
skill: code-review
mode: dry
cases:
  - id: review_operator_diff
    query: 审查算子代码改动，找潜在 bug
    expect_skill: code-review
    expect_references:
      - references/ascendc-checks.md

  - id: not_tg_solve
    query: 代码审查分析改动与跨层契约，假设检验，先 CodeMap 再源码窗，不签发证书
    expect_skill: code-review
    forbid_skill: tg-solve

  - id: precision_perf_finding
    query: 代码审查 PR 检视 Cast 与 DataCopy 变更，假设检验精度或性能场景线索，不签发证书
    expect_skill: code-review
    expect_references:
      - references/precision-perf-findings.md

  - id: two_axis_review
    query: 代码审查对照需求做 Spec 轴，对照仓规范做 Standards 轴，两轴分开写不合成 LGTM
    expect_skill: code-review
    forbid_skill: ce-verify
