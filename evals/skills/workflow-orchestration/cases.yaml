version: 1
skill: workflow-orchestration
mode: dry
cases:
  - id: slash_io_uo_init
    query: 无 .uo 时用 /uo-init 建 CodeMap，有 .uo 不准再 init
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_uo_update
    query: 已有 .uo 且有 PR 或 apply-diff 才 /uo-update，无 diff 不准走
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_uo_query
    query: /uo-query 走 pilot_cli 或 Task，禁止 pilot_run
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_uo_investigate
    query: /uo-investigate 读 unresolved，调查结论不改 .uo
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_ce_plan
    query: /ce-plan 语义一律 uo-query，写出 ce/plan.md 可接 apply 和 tg-plan
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_ce_apply
    query: /ce-apply 产出源码 diff，回到变更入口下一步 /uo-update
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_ce_review
    query: /ce-review 审查结论可接到 /tg-plan，语义走 uo-query
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_tg_init
    query: /tg-init 脚本仓可选，先问有没有测试脚本仓，.uo 产物边进入
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md
      - references/product-pipelines.md

  - id: slash_io_tg_plan
    query: /tg-plan 融合 init.yaml 与可选 ce/plan.md 或审查结论
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_tg_solve
    query: /tg-solve 写出 cases 表与 worklog
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: slash_io_handoff
    query: /handoff 把当前会话正式产物写成 session_handoff.md
    expect_skill: workflow-orchestration
    expect_references:
      - references/slash-io.md

  - id: golden_nl_pr_cases
    query: 分析这个 PR 并生成对应测试用例，交付 ce-review tg-plan tg-solve
    expect_skill: workflow-orchestration
    forbid_skill: source-proof
    expect_references:
      - references/product-pipelines.md
      - routing/resolve-intent.md
