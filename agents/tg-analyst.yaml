id: tg-analyst
version: 1
name_zh: TG 分析
role: producer
mode: subagent
description: >
  TG bind、plan、solve 的分阶段 producer。bind 写 `runs/` 草稿；
  plan/solve 窗 return_value，禁止 Write。
  禁止写算子源码、`.uo`、正式 `tg/init.yaml` / `plan.md` / `worklog.md` / `cases.*`。
max_skill_ids: &skills [bind-init, test-plan, solve, uo-query]
skill_ids: *skills
write_scopes:
- pilot:runs/**/actions/bind_init/parts/**
- pilot:runs/**/actions/bind_init/scratch/**
- pilot:runs/**/actions/bind_init/staging.yaml
read_scopes:
- pilot:tg/**
- pilot:uo/**
- pilot:ce/plan/**
- pilot:session_handoff.md
- pilot:runs/**
- pilot:context/**
- source:test_script/**
- method:skills/bind-init/**
- method:skills/test-plan/**
- method:skills/solve/**
- method:skills/uo-query/**
- method:skills/source-proof/**
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
