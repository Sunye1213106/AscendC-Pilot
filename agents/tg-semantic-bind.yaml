id: tg-semantic-bind
version: 1
name_zh: TG semantic bind producer
role: producer
mode: subagent
description: Bounded semantic-bind producer; writes candidate-cited patches only
read_scopes:
  - "tg/realization/**"
  - "tg/snapshot/**"
  - "tg/contract/**"
  - "uo/**"
  - "runs/**"
  - "context/**"
write_scopes:
  - "tg/realization/semantic_bind_patch.yaml"
  - "runs/**"
forbidden:
  - modify_pilot_state
  - declare_workflow_passed
  - write_outside_declared_scope
  - write_uo_formal_products
  - invent_csv_columns_or_keys
  - free_repo_search
tool_budget:
  max_calls: 16
