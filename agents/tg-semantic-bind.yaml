id: tg-semantic-bind
version: 1
name_zh: TG semantic bind producer
role: producer
mode: subagent
description: Semantic bind producer. Read session prompt.md first, then skills/testcase-generation/SKILL.md.
read_scopes:
- tg/realization/**
- tg/snapshot/**
- tg/contract/**
- uo/**
- runs/**
- context/**
- skills/testcase-generation/**
- skills/operator-analysis/**
write_scopes:
- tg/realization/semantic_bind_patch.yaml
- runs/**/actions/semantic_bind/**
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- invent_csv_columns_or_keys
- free_repo_search
