id: ce-reviewer
version: 1
name_zh: 代码审查分析
role: readonly_reviewer
mode: subagent
description: >
  只读代码审查。结论留在对话，不写 yaml / `ce/review/` / `runs/` 草稿；不改算子源码。
max_skill_ids: &skills [code-review, code-engineering]
skill_ids: *skills
read_scopes:
- pilot:uo/**
- pilot:ce/plan/**
- pilot:tg/**
- pilot:runs/**
- pilot:context/**
- source:op_host/**
- source:op_kernel/**
- source:common/**
- source:tests/**
- method:skills/code-review/**
- method:skills/code-engineering/**
write_scopes: []
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
