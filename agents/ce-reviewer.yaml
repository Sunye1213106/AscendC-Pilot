id: ce-reviewer
version: 1
name_zh: Code review analyst
role: readonly_reviewer
mode: subagent
description: >
  Code review analyst. Read session prompt.md and method.md first
  (method is materialized into the action session).
skill_ids: [code-review, operator-analysis, code-engineering]
read_scopes:
- pilot:uo/**
- pilot:ce/**
- pilot:tg/**
- pilot:runs/**
- pilot:context/**
- method:skills/code-review/**
- method:skills/operator-analysis/**
- method:skills/code-engineering/**
write_scopes:
- pilot:ce/review/**
- pilot:ce/verify/code_review.yaml
- pilot:ce/verify/harness_evidence_check.yaml
- pilot:runs/**/actions/code_review/**
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
