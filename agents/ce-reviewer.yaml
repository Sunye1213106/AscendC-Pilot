id: ce-reviewer
version: 1
name_zh: Code review analyst
role: readonly_reviewer
mode: subagent
description: >
  Code review analyst. Read session prompt.md and method.md first
  (method is materialized into the action session). Writes only the declared
  review report; never edits operator source.
max_skill_ids: &skills [code-review, code-engineering]
skill_ids: *skills
read_scopes:
- pilot:uo/**
- pilot:ce/**
- pilot:tg/**
- pilot:runs/**
- pilot:context/**
- method:skills/code-review/**
- method:skills/code-engineering/**
write_scopes:
- pilot:ce/review/**
- pilot:ce/verify/code_review.yaml
- pilot:ce/verify/harness_evidence_check.yaml
- pilot:runs/**/actions/code_review/**
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
