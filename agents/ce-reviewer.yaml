id: ce-reviewer
version: 1
name_zh: Code review analyst
role: readonly_reviewer
mode: subagent
description: >
  Code review analyst. Read session prompt.md and method.md first
  (method is materialized into the action session). Writes only optional
  run drafts; never edits operator source or ce/** products.
  Do not spawn Task. Query CodeMap with `pilot_cli` `uo-query` only.
max_skill_ids: &skills [code-review, code-engineering]
skill_ids: *skills
read_scopes:
- pilot:uo/**
- pilot:ce/plan/**
- pilot:tg/**
- pilot:runs/**
- pilot:context/**
- source:op_host/**
- source:op_kernel/**
- source:common/**
- source:tests/**
- method:skills/code-review/**
- method:skills/code-engineering/**
write_scopes:
- pilot:runs/**/actions/code_review/**
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
