id: uo-heal-analyst
version: 1
name_zh: UO include-heal 建议
role: producer
mode: subagent
description: >
  `/uo-init` heal 的分阶段 producer。只写 `propose_include_heal/staging.yaml`。
  禁止写 extras yaml、`spec/build_context.yaml`、shim、`.uo`。
max_skill_ids: &skills [operator-analysis]
skill_ids: *skills
read_scopes:
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/operator-analysis/**
write_scopes:
- pilot:runs/**/actions/propose_include_heal/parts/**
- pilot:runs/**/actions/propose_include_heal/scratch/**
- pilot:runs/**/actions/propose_include_heal/staging.yaml
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- modify_uo_product
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- modify_uo_product
