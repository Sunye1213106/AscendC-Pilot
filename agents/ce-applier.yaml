id: ce-applier
version: 1
name_zh: CE 按计划 todo 改码 producer
role: producer
mode: subagent
description: >
  Apply one unfinished todo from the current {slug}_plan.md to operator source.
  Read session prompt.md and method.md first. Do not write .uo or CE yaml.
max_skill_ids: &skills [code-engineering, operator-analysis, code-review]
skill_ids: *skills
read_scopes:
- pilot:ce/plan/**
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- source:op_host/**
- source:op_kernel/**
- source:common/**
- source:test_script/**
- method:skills/code-engineering/**
- method:skills/operator-analysis/**
- method:skills/code-review/**
write_scopes:
- source:op_host/**
- source:op_kernel/**
- source:common/**
- source:test_script/**
- pilot:ce/plan/**
- pilot:runs/**/actions/patch/**
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
- free_repo_search
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
- free_repo_search
