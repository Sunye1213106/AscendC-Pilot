id: ce-applier
version: 1
name_zh: CE 按计划改码
role: producer
mode: subagent
description: >
  按当前 `{slug}_plan.md` 未完成 todo 改算子源码。禁止写 `.uo` 与 CE yaml。
max_skill_ids: &skills [ce-apply]
skill_ids: *skills
read_scopes:
- pilot:ce/plan/**
- pilot:runs/**
- source:op_host/**
- source:op_kernel/**
- source:common/**
- source:test_script/**
- method:skills/ce-apply/**
write_scopes:
- source:op_host/**
- source:op_kernel/**
- source:common/**
- source:test_script/**
- pilot:ce/plan/**
- pilot:runs/**/actions/patch/**
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
