id: deterministic-uo-engine
version: 1
name_zh: UO 确定性引擎
# 仅作 authorize / write_scopes 身份，不是 LLM agent。
# compose_runtime 对 kind=deterministic_engine 不生成 host agent MD。
kind: deterministic_engine
role: deterministic_engine
mode: subagent
description: UO CodeMap 确定性引擎（非 LLM）
skill_ids: [operator-analysis]
read_scopes:
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/operator-analysis/**
write_scopes:
- pilot:uo/**
- pilot:runs/**/actions/**
- pilot:context/pilot_params.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
