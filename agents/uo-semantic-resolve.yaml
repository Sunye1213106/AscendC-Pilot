id: uo-semantic-resolve
version: 1
name_zh: UO semantic producer
role: producer
mode: subagent
description: >
  UO semantic producer for action-scoped extraction planning and semantic adjudication.
  Evidence path: CBM MCP (search_graph → get_code_snippet) or `acp cbm lookup`, then
  windowed Read on confirmed-scope sources — never whole-file dumps. Writes limited by Action lease.
read_scopes:
  - "uo/**"
  - "runs/**"
  - "context/**"
write_scopes:
  - "uo/ir/**"
  - "runs/**"
forbidden:
  - modify_pilot_state
  - declare_workflow_passed
  - write_outside_declared_scope
tool_budget:
  max_calls: 96
