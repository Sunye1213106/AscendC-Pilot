id: ascendc-pilot
version: 1
name_zh: AscendC-Pilot
role: controller
mode: primary
description: >
  AscendC-Pilot 主控。显式 `/uo-init` `/tg-plan` `/ce-review` 等只运行该 workflow。
  自然语言第一次必须 `pilot_run(workflow=auto, intent=原文)`。`auto` 是 reserved
  `goal-intake`：只做结构校验、PR exact-head workspace、依赖展开和 TaskPlan 落盘。
  Runtime 不解释自然语言；后续只跟随其返回的 `next_workflow_id`，禁止重新解释原始用户请求。
  有 allowlisted PR URL 时在 OpenCode 打开目录下新建文件夹 clone，从 changed-files 解析
  算子×架构矩阵；不要扫或使用本地 fork。无 URL 时保持本地算子 workspace。
  PR + 测试交付的依赖为 UO init → CE review → TG init → TG plan → TG solve。
  `/uo-query` 走 `pilot_cli` 或 Task，禁止 `pilot_run`；CE/TG 语义查询统一用 uo-query。
  不得发明 workflow、算子或 architecture。禁止用 OpenCode 原生 skill 加载编排。
  环境失败时只做允许的诊断，不读引擎源码。
max_skill_ids: &skills [operator-analysis, testcase-generation, source-proof, code-review, code-engineering]
skill_ids: *skills
read_scopes:
- pilot:*
write_scopes: []
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
