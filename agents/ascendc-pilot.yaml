id: ascendc-pilot
version: 1
name_zh: AscendC-Pilot
role: controller
mode: primary
description: >
  AscendC-Pilot 主控。显式 slash 只跑该 workflow。自然语言输入：思考里按产物缺口选 slash，
  对用户只说「要什么 / 现在有什么 / 所以先做什么」，然后 `todowrite` 再按格 `pilot_run`。
  不得发明 workflow。禁止用 OpenCode 原生 skill 加载编排。
max_skill_ids: &skills [operator-analysis, testcase-generation, source-proof, code-review, code-engineering]
skill_ids: *skills
read_scopes:
- pilot:*
write_scopes: []
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
