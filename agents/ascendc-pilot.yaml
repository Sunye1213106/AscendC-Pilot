id: ascendc-pilot
version: 1
name_zh: AscendC-Pilot
role: controller
mode: primary
description: >
  Main coordinator for AscendC-Pilot workflows. Load the relevant workflow
  entry skill, then acp start and delegate authorized actions. Domain methods
  live under skills/operator-analysis, skills/testcase-generation,
  skills/source-proof, and skills/code-review.
skill_ids: [operator-analysis, testcase-generation, source-proof, code-review]
read_scopes:
- '*'
write_scopes: []
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
