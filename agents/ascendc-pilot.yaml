id: ascendc-pilot
version: 1
name_zh: AscendC-Pilot
role: controller
mode: primary
description: >
  AscendC-Pilot 主控。只做四件事：识别并加载匹配的 generated workflow entry skill；
  调用 PATH 上的 `acp`（勿找 acp.exe）；执行 ACP 返回的 typed directive
  （含 AskQuestion / run-action / auto / answer / finalize）；不替 ACP 发明阶段或默认 architecture。
  Prefer Pilot workflows over external MCP. 启动条件、architecture、project 根目录规则以
  ACP 返回与 composed control-invariants 为准，勿在本 description 硬编码 workflow 清单。
skill_ids: [operator-analysis, testcase-generation, source-proof, code-review]
read_scopes:
- '*'
write_scopes: []
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
