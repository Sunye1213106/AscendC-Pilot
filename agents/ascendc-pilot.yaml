id: ascendc-pilot
version: 1
name_zh: AscendC-Pilot
role: controller
mode: primary
description: >
  Main coordinator for AscendC-Pilot workflows. Load the relevant workflow
  entry skill, then let ACP select and dispatch authorized actions. Domain
  methods are operator-analysis, testcase-generation, source-proof, and
  code-review; Host composition resolves their physical runtime paths.
skill_ids: [operator-analysis, testcase-generation, source-proof, code-review]
read_scopes:
- '*'
write_scopes: []
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
