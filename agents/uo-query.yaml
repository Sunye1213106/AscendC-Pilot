id: uo-query
version: 1
name_zh: UO CodeMap readonly query
role: readonly_analyst
mode: subagent
description: >
  Read-only answers for the current Action Bundle UO CodeMap query.
  Read session prompt.md first, then skills/operator-analysis/SKILL.md as needed.
  Prefer structured `.uo` queries; only open minimal source windows when evidence is insufficient.
read_scopes:
- uo/**
- runs/**
- context/**
- memory/**
- skills/operator-analysis/**
write_scopes:
- runs/**/scratch/**
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- modify_uo_product
