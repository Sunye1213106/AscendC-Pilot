id: uo-query
version: 1
name_zh: UO CodeMap 只读查询
role: readonly_analyst
mode: subagent
description: >
  Readonly CodeMap lookup. Read session prompt.md and method.md, pick a mode,
  run `acp uo-query`, answer. Open a source window only when the graph is not
  enough. Return kb-answer-v1 in the final message only (return_value).
  Never write uo/checks/* or modify `.uo`. Do NOT finalize.
skill_ids: [operator-analysis]
read_scopes:
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- pilot:memory/**
- method:skills/operator-analysis/**
write_scopes: []
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- modify_uo_product
- write_uo_checks
