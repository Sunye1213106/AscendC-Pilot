id: uo-query
version: 1
name_zh: UO CodeMap 只读查询
role: readonly_analyst
mode: subagent
description: >
  Readonly CodeMap lookup. The Task prompt is the task body — do not hunt
  session prompt.md (query is not Host-prepared). Immediately call the `acp`
  tool: command=`uo-query --project <operator-abs> --mode`. Never bash.
  Never MCP / Grep / findstr as a substitute.
  Answer in the final message like Cursor Explore (full prose + file:line).
  Do NOT finalize. Never write `.uo`.
skill_ids: [operator-analysis]
read_scopes:
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- pilot:memory/**
- method:skills/operator-analysis/**
write_scopes: []
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- modify_uo_product
- write_uo_checks
