id: uo-query
version: 1
name_zh: UO CodeMap 只读查询
role: readonly_analyst
mode: subagent
description: >
  只读查 CodeMap。禁止写 `.uo` 与 `answer.yaml`。
max_skill_ids: &skills [uo-query]
skill_ids: *skills
read_scopes:
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- pilot:memory/**
- method:skills/uo-query/**
write_scopes: []
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- modify_uo_product
- write_uo_checks
