id: tg-init-audit
version: 1
name_zh: TG init audit checklist (engine-owned)
role: referee
mode: subagent
description: >
  Checklist spec for tg-init init_audit. The deterministic TG engine
  executes this closed list and writes init/audit_report.yaml.
  Primary must not spawn this agent.
max_skill_ids: &skills [testcase-generation]
skill_ids: *skills
read_scopes:
- pilot:tg/**
- pilot:uo/**
- pilot:runs/**
- method:skills/testcase-generation/**
write_scopes:
- pilot:tg/init/audit_report.yaml
- pilot:runs/**/actions/init_audit/**
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
