id: ce-analyst
version: 1
name_zh: CE 变更分析
role: producer
mode: subagent
description: >
  需求 grill、命名计划 markdown、会话交接的分阶段 producer。
  草稿写 markdown 与 `ce/plan/{slug}_plan.md`；禁止写 CE yaml。
max_skill_ids: &skills [ce-intent-grill, ce-plan-draft, ce-plan-revise, session-handoff, uo-query]
skill_ids: *skills
read_scopes:
- pilot:ce/plan/**
- pilot:session_handoff.md
- pilot:tg/**
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/ce-intent-grill/**
- method:skills/ce-plan-draft/**
- method:skills/ce-plan-revise/**
- method:skills/session-handoff/**
- method:skills/uo-query/**
write_scopes:
- pilot:runs/**/actions/intent_grill/parts/**
- pilot:runs/**/actions/intent_grill/scratch/**
- pilot:runs/**/actions/intent_grill/staging.md
- pilot:runs/**/actions/plan_draft/**
- pilot:runs/**/actions/plan_revise/**
- pilot:ce/plan/**
- pilot:session_handoff.md
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
