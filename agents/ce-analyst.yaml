id: ce-analyst
version: 1
name_zh: CE 变更分析
role: producer
mode: subagent
description: >
  需求 grill 并写出或修订命名计划 markdown、会话交接的 producer。
  直接写 canonical `ce/plan/{slug}_plan.md`（本 agent 就是该产物的 producer，
  draft 由 `human_confirm` 把关、revise 由确定性 `plan_revise_check` 校验）；
  禁止写 CE yaml。
max_skill_ids: &skills [ce-plan-draft, session-handoff, uo-query]
skill_ids: *skills
read_scopes:
- pilot:ce/plan/**
- pilot:session_handoff.md
- pilot:tg/**
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/ce-plan-draft/**
- method:skills/session-handoff/**
- method:skills/uo-query/**
write_scopes:
- pilot:runs/**/actions/plan_draft/**
- pilot:runs/**/actions/plan_revise/**
- pilot:ce/plan/**
- pilot:session_handoff.md
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_yaml
