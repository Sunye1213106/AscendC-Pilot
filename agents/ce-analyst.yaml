id: ce-analyst
version: 1
name_zh: CE 变更分析 producer
role: producer
mode: subagent
description: >
  Staged producer for requirement grill, named plan markdown, and session
  handoff. Read session prompt.md and method.md first. Write grill drafts as
  markdown and ce/plan/{slug}_plan.md; do not write CE yaml.
max_skill_ids: &skills [code-engineering, testcase-generation, operator-analysis]
skill_ids: *skills
read_scopes:
- pilot:ce/plan/**
- pilot:session_handoff.md
- pilot:tg/**
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/operator-analysis/**
- method:skills/code-engineering/**
- method:skills/testcase-generation/**
write_scopes:
- pilot:runs/**/actions/intent_grill/parts/**
- pilot:runs/**/actions/intent_grill/scratch/**
- pilot:runs/**/actions/intent_grill/staging.md
- pilot:runs/**/actions/plan_draft/**
- pilot:runs/**/actions/plan_revise/**
- pilot:ce/plan/**
- pilot:session_handoff.md
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
- free_repo_search
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
- free_repo_search
