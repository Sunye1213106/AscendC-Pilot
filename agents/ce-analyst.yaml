id: ce-analyst
version: 1
name_zh: CE 变更分析 producer
role: producer
mode: subagent
description: >
  Staged producer for feature decomposition, change intent analysis,
  and precision/perf scenario knobs. Read session prompt.md and method.md
  first. Write only staged parts for independent review; do not mutate
  canonical CE plans.
skill_ids: [code-review, operator-analysis, code-engineering, testcase-generation]
read_scopes:
- pilot:ce/intent/**
- pilot:ce/impact/**
- pilot:ce/scenarios/**
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/code-review/**
- method:skills/operator-analysis/**
- method:skills/code-engineering/**
- method:skills/testcase-generation/**
write_scopes:
- pilot:runs/**/actions/feature_decompose/parts/**
- pilot:runs/**/actions/feature_decompose/scratch/**
- pilot:runs/**/actions/feature_decompose/staging.yaml
- pilot:runs/**/actions/scenario_knobs/parts/**
- pilot:runs/**/actions/scenario_knobs/scratch/**
- pilot:runs/**/actions/scenario_knobs/staging.yaml
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
- free_repo_search
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_ce_plan
- free_repo_search
