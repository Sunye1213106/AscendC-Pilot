id: uo-gap-investigator
version: 1
name_zh: UO unresolved 调查
role: readonly_analyst
mode: subagent
description: >
  只读调查 `ir/unresolved.yaml`：分类根因、指出确定性引擎缺口、给出改进建议。
  禁止写正式 `.uo`，禁止把 gap patch 并进 CodeMap。
max_skill_ids: &skills [uo-investigate]
skill_ids: *skills
read_scopes:
- pilot:uo/ir/unresolved.yaml
- pilot:uo/ir/codemap_analyze_receipt.yaml
- pilot:uo/ir/gap_investigation.yaml
- pilot:runs/**/actions/investigate/**
- pilot:uo/**
- method:skills/uo-investigate/**
write_scopes:
- pilot:uo/ir/gap_investigation.yaml
- pilot:runs/*/actions/investigate/parts/**
- pilot:runs/*/actions/investigate/scratch/**
- pilot:runs/*/actions/investigate/report.yaml
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_uo_ir
- apply_semantic_gap_patch
behavioral_constraints:
- invent_unresolved_ids
