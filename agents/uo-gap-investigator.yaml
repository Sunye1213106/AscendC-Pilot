id: uo-gap-investigator
version: 1
name_zh: UO unresolved residual investigation
role: readonly_analyst
mode: subagent
description: >
  Read-only investigation of semantic residuals in ir/unresolved.yaml:
  classify root causes, point out missing deterministic-engine capability,
  and suggest improvements. Read session prompt.md and method.md first.
  Must not write canonical `.uo` or merge gap patches into CodeMap.
  Must not redo human file-list confirmation or bypass Clang Source Scope.
max_skill_ids: &skills [operator-analysis]
skill_ids: *skills
read_scopes:
- pilot:uo/ir/unresolved.yaml
- pilot:uo/ir/codemap_analyze_receipt.yaml
- pilot:uo/ir/gap_investigation.yaml
- pilot:runs/**/actions/investigate/**
- pilot:uo/**
- method:skills/operator-analysis/**
write_scopes:
- pilot:uo/ir/gap_investigation.yaml
- pilot:runs/*/actions/investigate/parts/**
- pilot:runs/*/actions/investigate/scratch/**
- pilot:runs/*/actions/investigate/report.yaml
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_uo_ir
- apply_semantic_gap_patch
- no_free_repo_search
behavioral_constraints:
- invent_unresolved_ids
