id: deterministic-tg-engine
version: 1
name_zh: TG deterministic engine
# Engine identity for authorize/write_scopes — NOT an LLM-spawned agent.
# compose_runtime skips kind=deterministic_engine when emitting host agent MD.
kind: deterministic_engine
role: deterministic_engine
mode: subagent
description: TG deterministic engine
read_scopes:
- tg/**
- ../uo/**
- uo/**
- runs/**
- context/**
- operators/**
- skills/domain/**
write_scopes:
- tg/**
- runs/**
- context/pilot_params.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
