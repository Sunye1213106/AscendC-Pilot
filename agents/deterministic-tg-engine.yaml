id: deterministic-tg-engine
version: 1
name_zh: TG 确定性引擎
# 仅作 authorize / write_scopes 身份，不是 LLM agent。
# compose_runtime 对 kind=deterministic_engine 不生成 host agent MD。
kind: deterministic_engine
role: deterministic_engine
mode: subagent
description: TG 确定性引擎（非 LLM）
skill_ids: []
read_scopes:
- pilot:tg/**
- pilot:uo/**
- pilot:ce/scenarios/**
- pilot:ce/impact/**
- pilot:local/**
- pilot:runs/**
- pilot:context/**
- source:test_script/**
- method:skills/test-plan/**
- method:skills/source-proof/**
write_scopes:
- pilot:tg/**
- pilot:runs/**
- pilot:runs/**/actions/**
- pilot:local/**
- pilot:context/pilot_params.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
