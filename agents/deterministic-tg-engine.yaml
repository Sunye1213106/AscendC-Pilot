id: deterministic-tg-engine
version: 1
name_zh: TG deterministic engine
# Engine identity for authorize/write_scopes only — not an LLM agent.
# compose_runtime skips kind=deterministic_engine when emitting host agent MD.
kind: deterministic_engine
role: deterministic_engine
mode: subagent
description: TG deterministic engine
skill_ids: [testcase-generation, operator-analysis, source-proof]
read_scopes:
- pilot:tg/**
- pilot:uo/**
- pilot:ce/scenarios/**
- pilot:ce/impact/**
- pilot:local/**
- pilot:runs/**
- pilot:context/**
- method:skills/testcase-generation/**
- method:skills/operator-analysis/**
- method:skills/source-proof/**
write_scopes:
- pilot:tg/**
- pilot:runs/**
- pilot:runs/**/actions/**
- pilot:context/pilot_params.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
