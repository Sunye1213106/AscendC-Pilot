id: uo-semantic-resolver
version: 1
name_zh: UO CodeMap semantic gap resolver
role: producer
mode: subagent
description: Resolve unresolved CodeMap semantic gaps. Read session prompt.md first,
  then skills/domain/uo-codemap-build/SKILL.md. Write only declared staging parts.
  Merges former uo-gap-resolve / uo-key-resolve / uo-semantic-resolve producer duties
  for uo-init resolve.
read_scopes:
- uo/ir/unresolved.yaml
- uo/ir/resolve_gaps_staging.yaml
- runs/**/actions/resolve_gaps/**
- runs/**/actions/resolve/**
- skills/domain/**
write_scopes:
- uo/ir/resolve_gaps_staging.yaml
- runs/*/actions/resolve_gaps/parts/**
- runs/*/actions/resolve_gaps/scratch/**
- runs/*/actions/resolve_gaps/staging.yaml
- runs/*/actions/resolve/parts/**
- runs/*/actions/resolve/scratch/**
- runs/*/actions/resolve/staging.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_uo_ir
