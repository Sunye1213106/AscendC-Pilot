id: uo-semantic-resolver
version: 1
name_zh: UO CodeMap 语义缺口消解
role: producer
mode: subagent
description: >
  仅消解当前 Action Bundle 明确分配的 unresolved CodeMap semantic gaps。
  先读 session prompt.md，再按需读取 skills/operator-analysis/SKILL.md；
  只产出有 provenance 的 staging patch，不能替代确定性 frontend/pass。
  不得重新做人文件清单确认或绕过 Clang Source Scope。
read_scopes:
- uo/ir/unresolved.yaml
- uo/ir/resolve_gaps_staging.yaml
- runs/**/actions/resolve_gaps/**
- runs/**/actions/resolve/**
- skills/operator-analysis/**
- skills/testcase-generation/**
- skills/source-proof/**
- skills/code-review/**
- skills/_shared/**
write_scopes:
- uo/ir/resolve_gaps_staging.yaml
- runs/*/actions/resolve_gaps/parts/**
- runs/*/actions/resolve_gaps/scratch/**
- runs/*/actions/resolve_gaps/staging.yaml
- runs/*/actions/resolve/parts/**
- runs/*/actions/resolve/scratch/**
- runs/*/actions/resolve/staging.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_uo_ir
- invent_unresolved_ids
