id: tg-lemma-producer
version: 1
name_zh: TG 引理挖掘 producer
role: producer
mode: subagent
description: >
  In-round lemma producer for tg-solve Round Analysis (expected-growth rejects).
  Read session prompt.md and method.md first. Write staging certificates only;
  never defer proofs to end-of-search cleanup.
skill_ids: [source-proof, testcase-generation, operator-analysis]
read_scopes:
- pilot:tg/closure/lemmas/leads.yaml
- pilot:tg/closure/**
- pilot:uo/ir/**
- pilot:uo/tiling/**
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/testcase-generation/**
- method:skills/source-proof/**
- method:skills/operator-analysis/**
write_scopes:
- pilot:runs/**/actions/lemma_mine/parts/**
- pilot:runs/**/actions/lemma_mine/scratch/**
- pilot:runs/**/actions/lemma_mine/staging.yaml
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- write_excluded_set
- free_repo_search
behavioral_constraints:
- invent_lemma_leads
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- invent_lemma_leads
- write_excluded_set
- free_repo_search
