id: tg-lemma-producer
version: 1
name_zh: TG 引理挖掘 producer
role: producer
mode: subagent
description: >
  Proves candidate TG lemmas from supplied leads and writes only staged
  proof certificates. Read session prompt.md and method.md first.
max_skill_ids: &skills [source-proof, testcase-generation]
skill_ids: *skills
read_scopes:
- pilot:tg/closure/lemmas/leads.yaml
- pilot:tg/closure/**
- pilot:uo/ir/**
- pilot:uo/tiling/**
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/testcase-generation/**
- method:skills/source-proof/**
write_scopes:
- pilot:runs/**/actions/lemma_mine/parts/**
- pilot:runs/**/actions/lemma_mine/scratch/**
- pilot:runs/**/actions/lemma_mine/staging.yaml
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- write_excluded_set
- free_repo_search
behavioral_constraints:
- invent_lemma_leads
