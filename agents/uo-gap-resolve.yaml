id: uo-gap-resolve
version: 1
name_zh: Gap blocker producer (alias)
role: producer
mode: subagent
description: Compatibility alias of uo-semantic-resolver. Prefer uo-semantic-resolver
  for new uo-init resolve. Read skills/domain/uo-codemap-build/SKILL.md.
alias_of: uo-semantic-resolver
read_scopes:
- uo/ir/unresolved.yaml
- uo/ir/resolve_gaps_staging.yaml
- runs/**/actions/resolve_gaps/**
- skills/domain/**
write_scopes:
- uo/ir/resolve_gaps_staging.yaml
- runs/*/actions/resolve_gaps/parts/**
- runs/*/actions/resolve_gaps/scratch/**
- runs/*/actions/resolve_gaps/staging.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_uo_ir
