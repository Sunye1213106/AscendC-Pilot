id: uo-gap-resolve
version: 1
name_zh: Gap blocker producer
role: producer
mode: subagent
description: Resolve KB gaps. Read session prompt.md first, then skills/domain/uo-kb-build/SKILL.md.
  Write only declared staging parts.
read_scopes:
- uo/ir/unresolved.yaml
- uo/ir/resolve_gaps_staging.yaml
- runs/**/actions/resolve_gaps/**
- skills/domain/**
write_scopes:
- uo/ir/resolve_gaps_staging.yaml
- runs/*/actions/resolve_gaps/parts/**
- runs/*/actions/resolve_gaps/scratch/**
- runs/*/actions/resolve_gaps/staging.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_canonical_uo_ir
