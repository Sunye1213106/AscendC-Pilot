id: tg-closure-referee
version: 1
name_zh: TG 闭环审查 referee
role: referee
mode: subagent
description: >
  Referee for lemma certificates and closure audit. Read session prompt.md and
  method.md first. Writes review.yaml only; never excluded set.
skill_ids: [source-proof, testcase-generation]
read_scopes:
- pilot:tg/closure/**
- pilot:uo/**
- pilot:runs/**
- pilot:context/**
- method:skills/testcase-generation/**
- method:skills/source-proof/**
write_scopes:
- pilot:runs/**/actions/lemma_review/review.yaml
- pilot:runs/**/actions/closure_audit/review.yaml
machine_constraints:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- write_excluded_set
- free_repo_search
behavioral_constraints:
- invent_evidence
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- write_excluded_set
- invent_evidence
- free_repo_search
