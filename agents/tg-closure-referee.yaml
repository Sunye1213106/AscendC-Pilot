id: tg-closure-referee
version: 1
name_zh: TG 闭环审查 referee
role: referee
mode: subagent
description: Referee for lemma certificates and closure audit. Read session prompt.md
  first, then skills/source-proof (referee-replay) or skills/testcase-generation. Writes
  review.yaml only; never excluded set.
skill_ids: [source-proof, testcase-generation]
read_scopes:
- tg/closure/**
- uo/**
- ../uo/**
- runs/**
- context/**
- skills/testcase-generation/**
- skills/source-proof/**
write_scopes:
- runs/**/actions/lemma_review/review.yaml
- runs/**/actions/closure_audit/review.yaml
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
- write_uo_formal_products
- write_excluded_set
- invent_evidence
- free_repo_search
