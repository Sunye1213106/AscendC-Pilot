id: deterministic-ce-engine
version: 1
name_zh: CE 确定性引擎
# 仅作 authorize / write_scopes 身份，不是 LLM agent。
# compose_runtime 对 kind=deterministic_engine 不生成 host agent MD。
kind: deterministic_engine
role: deterministic_engine
mode: subagent
description: CE 确定性引擎（非 LLM）
skill_ids: []
read_scopes:
- pilot:ce/**
- pilot:uo/**
- pilot:tg/**
- pilot:runs/**
- pilot:context/**
- source/**
- local/**
- method:skills/ce-plan-draft/**
- method:skills/standalone-review/**
write_scopes:
- pilot:ce/**
- pilot:runs/**
- pilot:runs/**/actions/**
forbidden:
- modify_pilot_state
- declare_workflow_passed
- write_outside_declared_scope
