version: 1
op_name: demo_op
fields:
  SplitAxis:
    bits: [0, 1, 2]
    domain: [0, 1, 2]
  InputDType:
    bits: [3, 4]
    domain: [0, 1, 2]
  DeterType:
    bits: [5, 6]
    domain: [0, 1]
  IsTnd:
    bits: [7]
    domain: [0, 1]
constants:
  Reserved: 0
legal_constraints:
  - id: R_DETER_TND
    if: {IsTnd: 1}
    then: {DeterType: 0}
    reason: TND requires DeterType=0
unreachable:
  - constraint: {SplitAxis: 7}
    reason: SplitAxis=7 not used
input_realization:
  InputDType:
    "0": {query_dtype: float16}
    "1": {query_dtype: bfloat16}
    "2": {query_dtype: float32}
  IsTnd:
    "0": {layout: BSH}
    "1": {layout: TND}
  DeterType:
    "0": {deterministic: false}
    "1": {deterministic: true}
  SplitAxis:
    "0": {split: batch}
    "1": {split: s1}
    "2": {split: s2}
