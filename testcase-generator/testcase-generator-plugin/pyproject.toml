[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testcase-generator"
version = "0.1.0"
description = "AscendC operator testcase generator consuming understand-operator KB"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "click>=8.0",
]

[project.scripts]
tg-init = "testcase_generator.scripts.tg_init:main"
tg-plan = "testcase_generator.scripts.tg_plan:main"
tg-generate = "testcase_generator.scripts.tg_generate:main"
tg-probe = "testcase_generator.scripts.tg_probe:main"
tg-audit = "testcase_generator.scripts.tg_audit:main"
tg-repair = "testcase_generator.scripts.tg_repair:main"
tg-pr = "testcase_generator.scripts.tg_pr:main"
tg-report = "testcase_generator.scripts.tg_report:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["testcase_generator*"]
