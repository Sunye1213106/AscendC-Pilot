[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascendc-pilot"
version = "0.1.0"
description = "AscendC-Pilot control plane for Understand Operator, Testcase Generation, and Code Engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
acp = "ascendc_pilot.cli:main"
ascendc-pilot = "ascendc_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ascendc_pilot*"]
