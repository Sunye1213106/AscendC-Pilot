id: bounded-semantic-batch
version: 1
name_zh: 有界语义批次
description: 单个 shard 最多 30 个 semantic obligations，并受 token budget 约束；超限由公共 llm_work_scheduler 继续拆分。
applies_when:
  - llm_work_scheduler
  - extract_plan / adjudicate prepare
requires:
  inputs: [obligation_list]
  tools: []
  context: [max_per_shard, token_budget]
produces: [batch_manifest]
compatible_roles: [deterministic_engine, producer]
policies: [pilot-control]
method_file: METHOD.md
