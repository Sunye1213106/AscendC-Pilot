schema: tg-plan-fill/v1
description: >
  Plan Owner fill-in. LLM writes semantic content only. Engine expands this
  into schema tg-plan/v3 (predicates, coverage.L0/L2.mode/L3, classifier,
  controls, untestable from init unresolved+active).
engine_owned:
  - schema  # on the expanded v3 document
  - targets[].id
  - requirement.id
  - dimensions[].target
  - dimensions[].classifier
  - dimensions[].controls
  - dimensions[].partitions[].predicate
  - guards[].target
  - guards[].controls
  - guards[].predicate
  - guards[].negate_hint
  - coverage.L0
  - coverage.L2.mode
  - coverage.L3
  - constraints
  - untestable
llm_owned:
  - requirement
  - target
  - dimensions[].id
  - dimensions[].cuts
  - dimensions[].arms
  - dimensions[].extra_controls
  - guards[].id
  - guards[].field
  - guards[].eq
  - guards[].op
  - guards[].value
  - guards[].not_in
  - guards[].all
  - guards[].hit
  - l1
  - exclusions
  - oracle
  - environment
  - opaque
