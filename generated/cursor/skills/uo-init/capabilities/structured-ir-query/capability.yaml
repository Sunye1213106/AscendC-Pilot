id: structured-ir-query
version: 1
name_zh: 结构化 IR 查询
description: 通过受控 acp inspect 对 candidates/tasks/yaml 做筛选、计数、分组与覆盖检查，避免整文件人工扫读。
applies_when:
  - extract_plan / adjudicate 需要枚举 candidate_id 或 task_id
  - 需要 accepted/rejected/deferred 覆盖检查
  - 需要 candidate hash / shard 预览
requires:
  inputs: [uo_ir_paths, filters]
  tools: [acp_inspect]
  context: [project_root, run_id, action_id]
produces: [query_result, coverage_report]
compatible_roles: [producer, readonly_analyst]
policies: [code-access, evidence]
method_file: METHOD.md
