id: sharded-semantic-producer
version: 1
name_zh: 分片语义 Producer
description: adjudicate_llm_tasks Map worker 只读写自己的 batch/part/scratch，禁止写 canonical semantic_patches 或控制面命令。
applies_when:
  - adjudicate_llm_tasks Map-Reduce
  - 并行语义裁决 worker
requires:
  inputs: [batch_path, shard_id]
  tools: [write, read]
  context: [action_session_id, worker_session_id]
produces: [semantic_patch_part]
compatible_roles: [producer]
policies: [pilot-control, evidence]
method_file: METHOD.md
