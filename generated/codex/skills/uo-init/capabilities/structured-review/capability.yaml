id: structured-review
version: 1
name_zh: 结构化审查
description: 按 schema 对产物做独立审查并写 review YAML。
applies_when:
  - confidence review / kb review / init audit / code review
requires:
  inputs: [artifact_paths, review_schema]
  tools: [read]
