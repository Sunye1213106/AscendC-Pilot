name: Diagnose FAG graph related regression

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engines/understand-operator pytest
      - name: Capture related UO graph tests
        run: |
          mapfile -t TEST_FILES < <(
            grep -rlE \
              'extract_host_subgraph|extract_kernel_subgraph|function_body|function_call_graph|propose_extract_plan' \
              engines/understand-operator/tests \
              --include='test_*.py' | sort -u
          )
          printf '%s\n' "${TEST_FILES[@]}" > fag-regression-files.txt
          set +e
          pytest -vv "${TEST_FILES[@]}" > fag-regression-output.txt 2>&1
          echo $? > fag-regression-exit-code.txt
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: fag-related-regression-diagnostics
          path: |
            fag-regression-files.txt
            fag-regression-output.txt
            fag-regression-exit-code.txt
          retention-days: 1
