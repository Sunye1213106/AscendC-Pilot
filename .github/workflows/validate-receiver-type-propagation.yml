name: Validate receiver type propagation

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0

      - run: python -m pip install -q pytest pyyaml

      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag

      - name: Capture baseline FAG metrics
        env:
          PYTHONPATH: engines/understand-operator
        run: python .github/receiver_type_report.py --repo real-fag --output receiver-before.json

      - name: Apply receiver type propagation
        run: |
          python .github/apply_receiver_type_propagation.py
          python -m py_compile \
            engines/understand-operator/uo/scripts/receiver_type_facts.py \
            engines/understand-operator/uo/scripts/function_call_graph.py

      - name: Capture focused regressions
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          set +e
          pytest -q \
            engines/understand-operator/tests/test_receiver_type_propagation.py \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_function_call_graph.py \
            engines/understand-operator/tests/test_call_scanner.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py \
            2>&1 | tee receiver-pytest.log
          echo ${PIPESTATUS[0]} > receiver-pytest.status
          exit 0

      - name: Capture patched FAG metrics
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          set +e
          python .github/receiver_type_report.py --repo real-fag --output receiver-after.json 2>&1 | tee receiver-after.log
          echo ${PIPESTATUS[0]} > receiver-after.status
          exit 0

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: fag-receiver-type-propagation
          path: |
            receiver-before.json
            receiver-after.json
            receiver-after.log
            receiver-after.status
            receiver-pytest.log
            receiver-pytest.status

      - name: Gate deterministic improvement
        run: |
          test "$(cat receiver-pytest.status)" = "0"
          test "$(cat receiver-after.status)" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('receiver-before.json').read_text())
          after=json.loads(Path('receiver-after.json').read_text())
          bs=before['status']; ass=after['status']
          print('before', bs)
          print('after ', ass)
          assert ass.get('candidate_set',0) < bs.get('candidate_set',0), (bs,ass)
          assert ass.get('resolved',0) > bs.get('resolved',0), (bs,ass)
          assert ass.get('missing',0) <= bs.get('missing',0), (bs,ass)
          watched=('Get','GetTensor','Init')
          reductions=[]
          for name in watched:
              b=before['watched'].get(name,{})
              a=after['watched'].get(name,{})
              reductions.append(b.get('candidate_set',0)-a.get('candidate_set',0))
              print(name, b, '=>', a)
          assert sum(reductions) > 0, reductions
          PY

      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            engines/understand-operator/uo/scripts/receiver_type_facts.py \
            engines/understand-operator/uo/scripts/function_call_graph.py \
            engines/understand-operator/tests/test_receiver_type_propagation.py
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
          else
            git commit -m 'feat(uo): infer receiver types and propagate direct returns'
            git push origin HEAD:agent/tg-workflow-contract-closure
          fi
