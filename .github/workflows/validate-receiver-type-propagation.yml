name: Validate template type normalization

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0

      - run: python -m pip install -q pytest pyyaml

      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag

      - name: Capture baseline FAG metrics
        env:
          PYTHONPATH: engines/understand-operator
        run: python .github/receiver_type_report.py --repo real-fag --output template-before.json

      - name: Apply template type resolver
        run: |
          python .github/apply_template_type_resolver.py
          python -m py_compile \
            engines/understand-operator/uo/scripts/type_normalizer.py \
            engines/understand-operator/uo/scripts/receiver_type_facts.py

      - name: Run focused regressions
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          pytest -q \
            engines/understand-operator/tests/test_template_type_normalizer.py \
            engines/understand-operator/tests/test_receiver_type_propagation.py \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_function_call_graph.py \
            engines/understand-operator/tests/test_call_scanner.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py \
            2>&1 | tee template-pytest.log

      - name: Capture patched FAG metrics
        env:
          PYTHONPATH: engines/understand-operator
        run: python .github/receiver_type_report.py --repo real-fag --output template-after.json

      - name: Gate deterministic improvement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('template-before.json').read_text())
          after=json.loads(Path('template-after.json').read_text())
          bs=before['status']; ass=after['status']
          print('before', bs)
          print('after ', ass)
          assert ass.get('candidate_set',0) <= bs.get('candidate_set',0), (bs,ass)
          assert ass.get('missing',0) <= bs.get('missing',0), (bs,ass)
          assert ass.get('resolved',0) >= bs.get('resolved',0), (bs,ass)
          watched=('Get','GetTensor','Init')
          improvement=0
          for name in watched:
              b=before['watched'].get(name,{})
              a=after['watched'].get(name,{})
              print(name, b, '=>', a)
              improvement += b.get('candidate_set',0)-a.get('candidate_set',0)
              improvement += a.get('resolved',0)-b.get('resolved',0)
          assert improvement > 0, improvement
          PY

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: fag-template-type-normalization
          path: |
            template-before.json
            template-after.json
            template-pytest.log

      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            engines/understand-operator/uo/scripts/type_normalizer.py \
            engines/understand-operator/uo/scripts/receiver_type_facts.py \
            engines/understand-operator/tests/test_template_type_normalizer.py
          git commit -m 'feat(uo): normalize template receiver types' || true
          git push origin HEAD:agent/tg-workflow-contract-closure

      - name: Remove one-shot validation assets
        run: |
          git rm -f \
            .github/apply_template_type_resolver.py \
            .github/receiver_type_report.py \
            .github/workflows/validate-receiver-type-propagation.yml
          git commit -m 'chore(ci): remove template type validation assets'
          git push origin HEAD:agent/tg-workflow-contract-closure
