name: Time real FAG graph layers

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: read

jobs:
  layers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          path: pilot
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: main
          path: fag
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e pilot/engines/understand-operator
      - name: Prepare confirmed candidate-backed plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          OP="$GITHUB_WORKSPACE/fag/flash_attention_score_grad"
          export PYTHONPATH="$GITHUB_WORKSPACE/pilot/engines/understand-operator"
          python -m uo.scripts.build_layered_kb "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 \
            --layers entrypoints > results/entrypoints.log 2>&1
          python -m uo.scripts.propose_extract_plan "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 --write \
            > results/propose.log 2>&1
          python pilot/tools/agent_prepare_real_fag_plan.py "$OP" \
            --report results/plan-validation.json
      - name: Run each layer with independent timing
        shell: bash
        run: |
          set +e
          OP="$GITHUB_WORKSPACE/fag/flash_attention_score_grad"
          export PYTHONPATH="$GITHUB_WORKSPACE/pilot/engines/understand-operator"
          run_layer() {
            label="$1"; shift
            /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
              -o "results/${label}-time.txt" \
              timeout 600s "$@" > "results/${label}.log" 2>&1
            echo $? > "results/${label}-exit-code.txt"
          }
          run_layer tilingkey python -m uo.scripts.extract_tilingkey_space "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 --write
          run_layer host python -m uo.scripts.extract_host_subgraph "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 --write
          run_layer kernel python -m uo.scripts.extract_kernel_subgraph "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 --write
          run_layer bridge python -m uo.scripts.reconcile_bridge "$OP" \
            --op-name flash_attention_score_grad --write
          run_layer merge python -m uo.scripts.build_layered_kb "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 --layers bridge
          cp -a "$OP/.ascendc-pilot/uo/ir" results/ir 2>/dev/null || true
          set -e
      - name: Summarize layers
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          root = Path('results')
          out = {}
          for label in ('tilingkey','host','kernel','bridge','merge'):
              code = root / f'{label}-exit-code.txt'
              timing = root / f'{label}-time.txt'
              vals = {}
              if timing.is_file():
                  for line in timing.read_text().splitlines():
                      if '=' in line:
                          k,v=line.split('=',1)
                          try: vals[k]=float(v)
                          except ValueError: vals[k]=v
              out[label] = {'exit_code': int(code.read_text()) if code.is_file() else None, **vals}
          ir = root / 'ir'
          def load(name):
              p=ir/name
              if not p.is_file(): return {}
              try: return yaml.safe_load(p.read_text(encoding='utf-8')) or {}
              except Exception as exc: return {'error':str(exc)}
          host, kernel, graph = load('host_subgraph.yaml'), load('kernel_subgraph.yaml'), load('operator_graph.yaml')
          out['graph'] = {
              'host_nodes': len(host.get('nodes') or []),
              'host_edges': len(host.get('edges') or []),
              'kernel_nodes': len(kernel.get('nodes') or []),
              'kernel_edges': len(kernel.get('edges') or []),
              'kernel_branches': len(kernel.get('branches') or []),
              'operator_nodes': len(graph.get('nodes') or []),
              'operator_edges': len(graph.get('edges') or []),
              'unresolved': len(graph.get('unresolved') or []),
              'stats': graph.get('stats') or {},
          }
          (root/'summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-fag-layer-timings
          path: results
          retention-days: 1
