name: Run real FAG layered graph

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          path: pilot
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: main
          path: fag
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e pilot/engines/understand-operator
      - name: Build entrypoints and candidate-backed plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          OP="$GITHUB_WORKSPACE/fag/flash_attention_score_grad"
          export PYTHONPATH="$GITHUB_WORKSPACE/pilot/engines/understand-operator"
          /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            -o results/entrypoints-time.txt \
            python -m uo.scripts.build_layered_kb "$OP" \
              --op-name flash_attention_score_grad --architecture arch35 \
              --layers entrypoints > results/entrypoints.log 2>&1
          python -m uo.scripts.propose_extract_plan "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 --write \
            > results/propose.log 2>&1
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import json
          import re
          import yaml

          from uo.scripts.extract_plan_io import validate_extract_plan_against_candidates

          op = Path('fag/flash_attention_score_grad')
          ir = op / '.ascendc-pilot' / 'uo' / 'ir'
          candidates = yaml.safe_load((ir / 'extract_plan_candidates.yaml').read_text(encoding='utf-8')) or {}
          allowed_roles = {'tiling_writer', 'key_writer', 'workspace_writer', 'provenance_helper', 'ignore'}

          writers = []
          for cand in candidates.get('writer_candidates') or []:
              if not isinstance(cand, dict) or not cand.get('name'):
                  continue
              name = str(cand.get('name'))
              role = str(cand.get('role_suggested') or 'ignore')
              if role not in allowed_roles:
                  role = 'ignore'
              # Macro-like tokens occasionally appear as brace-window call seeds;
              # keep the evidence row but do not promote it to a writer.
              if re.fullmatch(r'[A-Z][A-Z0-9_]{2,}', name):
                  role = 'ignore'
              row = {
                  'name': name,
                  'qualified_name': cand.get('qualified_name') or name,
                  'class_or_namespace': cand.get('class_or_namespace') or '',
                  'file_path': cand.get('file_path') or '',
                  'start_line': int(cand.get('start_line') or 0),
                  'role': role,
                  'evidence_source': 'source',
                  'source_verified': True,
                  'evidence_files': [cand.get('file_path')] if cand.get('file_path') else [],
                  'evidence_lines': [int(cand.get('start_line') or 0)] if cand.get('start_line') else [],
                  'decision_reason': 'candidate source body and structural evidence reviewed for real FAG CI rebuild',
              }
              writers.append(row)

          receivers = []
          for cand in candidates.get('receiver_candidates') or []:
              if not isinstance(cand, dict) or not cand.get('name'):
                  continue
              receivers.append({
                  'name': str(cand.get('name')),
                  'qualified_name': cand.get('qualified_name') or str(cand.get('name')),
                  'class_or_namespace': cand.get('class_or_namespace') or '',
                  'file_path': cand.get('file_path') or '',
                  'start_line': int(cand.get('start_line') or 0),
                  'is_tiling_sink': bool(cand.get('is_tiling_sink_suggested')),
                  'evidence_source': 'candidate_only',
                  'confidence': 'candidate',
              })

          aliases = [
              {
                  'local': str(c.get('local')),
                  'tdf_leaf': str(c.get('tdf_leaf')),
                  'tdf_path': c.get('tdf_path') or c.get('tdf_leaf'),
                  'file_path': c.get('file_path') or '',
                  'start_line': int(c.get('start_line') or 0),
              }
              for c in candidates.get('alias_candidates') or []
              if isinstance(c, dict) and c.get('local') and c.get('tdf_leaf')
          ]
          non_sink = sorted({
              str(c.get('name'))
              for c in candidates.get('non_sink_root_candidates') or []
              if isinstance(c, dict) and c.get('name')
          })
          extra = [
              {
                  'name': str(c.get('name')),
                  'file_path': c.get('file_path') or '',
                  'start_line': int(c.get('start_line') or 0),
              }
              for c in candidates.get('extra_entry_candidates') or []
              if isinstance(c, dict) and c.get('name')
          ]
          plan = {
              'version': 1,
              'op_name': 'flash_attention_score_grad',
              'architecture': 'arch35',
              'status': 'confirmed_for_ci_rebuild',
              'writers': writers,
              'receivers': receivers,
              'aliases': aliases,
              'non_sink_roots': non_sink,
              'derived_roots': [],
              'extra_host_entries': extra,
          }
          errors = validate_extract_plan_against_candidates(plan, candidates)
          Path('results/plan-validation.json').write_text(
              json.dumps({'errors': errors, 'writer_count': len(writers), 'receiver_count': len(receivers),
                          'alias_count': len(aliases), 'non_sink_count': len(non_sink)}, indent=2),
              encoding='utf-8',
          )
          (ir / 'extract_plan.yaml').write_text(
              yaml.safe_dump(plan, sort_keys=False, allow_unicode=True), encoding='utf-8'
          )
          if errors:
              raise SystemExit('extract plan rejected: ' + '; '.join(errors[:20]))
          PY
      - name: Build Host Kernel TilingKey Bridge
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OP="$GITHUB_WORKSPACE/fag/flash_attention_score_grad"
          export PYTHONPATH="$GITHUB_WORKSPACE/pilot/engines/understand-operator"
          /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            -o results/layered-time.txt \
            timeout 1800s python -m uo.scripts.build_layered_kb "$OP" \
              --op-name flash_attention_score_grad --architecture arch35 \
              --layers host,kernel,tilingkey,bridge \
              > results/layered.log 2>&1
          echo $? > results/layered-exit-code.txt
          cp -a "$OP/.ascendc-pilot/uo/ir" results/ir 2>/dev/null || true
          set -e
      - name: Summarize graph
        if: always()
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import json, yaml
          root = Path('results')
          ir = root / 'ir'
          def load(name):
              p = ir / name
              if not p.is_file(): return {}
              try: return yaml.safe_load(p.read_text(encoding='utf-8')) or {}
              except Exception as exc: return {'_error': str(exc)}
          graph, host, kernel = load('operator_graph.yaml'), load('host_subgraph.yaml'), load('kernel_subgraph.yaml')
          unresolved_doc = load('unresolved.yaml')
          unresolved = unresolved_doc.get('items') or graph.get('unresolved') or []
          kinds = Counter(str(x.get('kind') or 'unknown') for x in unresolved if isinstance(x, dict))
          host_names = defaultdict(list)
          for n in host.get('nodes') or []:
              if isinstance(n, dict): host_names[str(n.get('name') or '')].append(n)
          same_name = {
              name: [
                  {'id': n.get('id'), 'qualified_name': n.get('qualified_name'), 'file_path': n.get('file_path'),
                   'class_or_namespace': n.get('class_or_namespace'), 'identity_key': n.get('identity_key')}
                  for n in rows
              ]
              for name, rows in host_names.items()
              if name and len({str(n.get('identity_key') or n.get('id')) for n in rows}) > 1
          }
          code = None
          p = root / 'layered-exit-code.txt'
          if p.is_file(): code = int(p.read_text().strip())
          summary = {
              'exit_code': code,
              'entrypoint_closure': (graph.get('entrypoint_graph') or {}).get('closure'),
              'operator_nodes': len(graph.get('nodes') or []),
              'operator_edges': len(graph.get('edges') or []),
              'host_nodes': len(host.get('nodes') or []),
              'host_edges': len(host.get('edges') or []),
              'kernel_nodes': len(kernel.get('nodes') or []),
              'kernel_edges': len(kernel.get('edges') or []),
              'kernel_branches': len(kernel.get('branches') or []),
              'unresolved_count': len(unresolved),
              'unresolved_kinds': dict(kinds.most_common()),
              'same_name_host_groups': same_name,
              'stats': graph.get('stats') or {},
              'errors': {k: v.get('_error') for k, v in {'graph':graph,'host':host,'kernel':kernel}.items() if v.get('_error')},
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({k:v for k,v in summary.items() if k != 'same_name_host_groups'}, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-fag-layered-graph
          path: results
          retention-days: 1
