name: Time real FAG layers in parallel

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: read

jobs:
  layer:
    strategy:
      fail-fast: false
      matrix:
        layer: [tilingkey, host, kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          path: pilot
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: main
          path: fag
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e pilot/engines/understand-operator
      - name: Prepare candidate-backed plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          OP="$GITHUB_WORKSPACE/fag/flash_attention_score_grad"
          export PYTHONPATH="$GITHUB_WORKSPACE/pilot/engines/understand-operator"
          python -m uo.scripts.build_layered_kb "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 \
            --layers entrypoints > results/entrypoints.log 2>&1
          python -m uo.scripts.propose_extract_plan "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 --write \
            > results/propose.log 2>&1
          python pilot/tools/agent_prepare_real_fag_plan.py "$OP" \
            --report results/plan-validation.json
          if [[ "${{ matrix.layer }}" != "tilingkey" ]]; then
            python -m uo.scripts.extract_tilingkey_space "$OP" \
              --op-name flash_attention_score_grad --architecture arch35 --write \
              > results/tilingkey-setup.log 2>&1
          fi
      - name: Time selected layer
        shell: bash
        run: |
          set +e
          OP="$GITHUB_WORKSPACE/fag/flash_attention_score_grad"
          export PYTHONPATH="$GITHUB_WORKSPACE/pilot/engines/understand-operator"
          case "${{ matrix.layer }}" in
            tilingkey)
              CMD=(python -m uo.scripts.extract_tilingkey_space "$OP" --op-name flash_attention_score_grad --architecture arch35 --write)
              ;;
            host)
              CMD=(python -m uo.scripts.extract_host_subgraph "$OP" --op-name flash_attention_score_grad --architecture arch35 --write)
              ;;
            kernel)
              CMD=(python -m uo.scripts.extract_kernel_subgraph "$OP" --op-name flash_attention_score_grad --architecture arch35 --write)
              ;;
          esac
          /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            -o results/time.txt timeout 300s "${CMD[@]}" > results/layer.log 2>&1
          echo $? > results/exit-code.txt
          cp -a "$OP/.ascendc-pilot/uo/ir" results/ir 2>/dev/null || true
          set -e
      - name: Summarize selected layer
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          root=Path('results')
          vals={}
          p=root/'time.txt'
          if p.is_file():
              for line in p.read_text().splitlines():
                  if '=' in line:
                      k,v=line.split('=',1)
                      try: vals[k]=float(v)
                      except ValueError: vals[k]=v
          code=root/'exit-code.txt'
          layer='${{ matrix.layer }}'
          ir=root/'ir'
          fname={'tilingkey':'tilingkey_space.yaml','host':'host_subgraph.yaml','kernel':'kernel_subgraph.yaml'}[layer]
          doc={}
          fp=ir/fname
          if fp.is_file():
              doc=yaml.safe_load(fp.read_text(encoding='utf-8')) or {}
          out={'layer':layer,'exit_code':int(code.read_text()) if code.is_file() else None,**vals,
               'nodes':len(doc.get('nodes') or []),'edges':len(doc.get('edges') or []),
               'branches':len(doc.get('branches') or []),'unresolved':len(doc.get('unresolved') or [])}
          (root/'summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-fag-${{ matrix.layer }}-timing
          path: results
          retention-days: 1
