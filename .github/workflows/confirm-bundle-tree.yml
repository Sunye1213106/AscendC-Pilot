name: confirm-bundle-tree

on:
  push:
    branches:
      - agent/bundle-sync-staging
    paths:
      - .github/workflows/confirm-bundle-tree.yml

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm exact main tree and publish ready marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_TREE: bcb97f350714cc6559bc3736c6f3eeecdcd91ad8
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          main_sha=""
          for _ in $(seq 1 24); do
            main_sha="$(curl -fsSL "${auth[@]}" "${api}/git/ref/heads/main" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
            main_tree="$(curl -fsSL "${auth[@]}" "${api}/git/commits/${main_sha}" | python -c 'import json,sys; print(json.load(sys.stdin)["tree"]["sha"])')"
            if [ "${main_tree}" = "${TARGET_TREE}" ]; then
              break
            fi
            sleep 5
          done
          test "${main_tree}" = "${TARGET_TREE}"

          ref_payload="$(python -c 'import json,sys; print(json.dumps({"ref":"refs/heads/agent/bundle-baseline-ready","sha":sys.argv[1]}))' "${main_sha}")"
          code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -X POST "${auth[@]}" "${api}/git/refs" -d "${ref_payload}")"
          if [ "${code}" = "422" ]; then
            update_payload="$(python -c 'import json,sys; print(json.dumps({"sha":sys.argv[1],"force":False}))' "${main_sha}")"
            curl -fsSL -X PATCH "${auth[@]}" "${api}/git/refs/heads/agent/bundle-baseline-ready" -d "${update_payload}" >/dev/null
          else
            test "${code}" = "201"
          fi
