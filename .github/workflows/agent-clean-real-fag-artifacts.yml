name: Clean real FAG validation artifacts

on:
  pull_request:
    types: [reopened]
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - name: Remove external checkout and generated validation output
        run: |
          rm -rf fag real-results
          rm -f .github/workflows/agent-clean-real-fag-artifacts.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove real FAG validation artifacts"
          git push origin HEAD:agent/tg-workflow-contract-closure
