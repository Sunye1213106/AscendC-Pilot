name: control-plane-contract

on:
  pull_request:
    paths:
      - "evals/**"
      - "agents/**"
      - "pilot/**"
      - "prompts/**"
      - "skills/**"
      - "knowledge/**"
      - "engines/understand-operator/**"
      - "engines/testcase-generation/**"
      - "engines/code-engineering/**"
      - "opencode-plugin/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "uninstall.sh"
      - "uninstall.ps1"
      - "refresh-opencode.ps1"
      - ".github/workflows/control-plane-contract.yml"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "agents/**"
      - "pilot/**"
      - "prompts/**"
      - "skills/**"
      - "knowledge/**"
      - "engines/understand-operator/**"
      - "engines/testcase-generation/**"
      - "engines/code-engineering/**"
      - "opencode-plugin/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "uninstall.sh"
      - "uninstall.ps1"
      - "refresh-opencode.ps1"
      - ".github/workflows/control-plane-contract.yml"

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install control-plane test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema pytest
      - name: Compile Python packages
        run: >-
          python -m compileall -q
          pilot/ascendc_pilot
          engines/understand-operator/src
          engines/testcase-generation
          engines/code-engineering
          engines/workspace
      - name: Validate execution ownership and prompts
        env:
          PYTHONPATH: pilot
        run: python scripts/check_execution_contracts.py
      - name: Validate existing runtime graph
        env:
          PYTHONPATH: pilot
        run: python scripts/check_runtime_graph.py
      - name: Validate existing ownership contracts
        env:
          PYTHONPATH: pilot
        run: python scripts/check_ownership_contracts.py --repo .
      - name: Validate artifact producer/consumer DAG
        env:
          PYTHONPATH: pilot
        run: python scripts/check_contract_dag.py --repo .
      - name: Validate workflow model (phases/transitions/routing)
        env:
          PYTHONPATH: pilot
        run: python scripts/check_workflow_model.py --repo .
      - name: Validate session replay matrix
        env:
          PYTHONPATH: pilot
        run: pytest -q pilot/tests/test_session_replay_matrix.py
      - name: Validate engine consumes_state contract
        env:
          PYTHONPATH: pilot
        run: python scripts/check_engine_context.py
      - name: Validate skill architecture
        env:
          PYTHONPATH: pilot
        run: python scripts/check_skill_architecture.py
      - name: Validate instruction ownership
        env:
          PYTHONPATH: pilot
        run: python scripts/check_instruction_ownership.py
      - name: Validate shared reference projections
        run: python scripts/sync_shared_references.py --check --repo .
      - name: Validate uo-query Explore control plane
        env:
          PYTHONPATH: pilot
        run: >-
          pytest -q
          pilot/tests/test_exploration_budget.py
          pilot/tests/test_uo_query_return_value_transport.py
          pilot/tests/test_uo_query_policy_ssot.py
          pilot/tests/test_uo_query_opencode_hook.py
          pilot/tests/test_uo_query_eval_gates.py
          pilot/tests/test_instruction_ownership.py
          pilot/tests/test_prepare_placeholders.py::test_kb_lookup_stub_requires_answer_yaml_not_integrity
      - name: Validate UO projection freshness and aggregate queries
        env:
          PYTHONPATH: engines/understand-operator/src
        run: >-
          pytest -q
          engines/understand-operator/tests/unit/test_projection_provenance.py
          engines/understand-operator/tests/unit/test_uo_query_aggregate_modes.py
      - name: Compose the real OpenCode runtime
        env:
          PYTHONPATH: pilot
        run: |
          python scripts/compose_runtime.py --repo . --host opencode
          python scripts/prune_runtime_context.py --repo . --host opencode
          python scripts/compose_opencode_commands.py
      - name: Validate composed OpenCode runtime closure
        env:
          PYTHONPATH: pilot
        run: python scripts/check_generated_runtime_closure.py --repo . --host opencode
      - name: Validate Host Session Driver + Bundle closure
        env:
          PYTHONPATH: pilot
        run: |
          python scripts/check_host_driver_contract.py
          pytest -q pilot/tests/test_host_driver_bundle.py pilot/tests/test_context_compiler.py pilot/tests/test_live_eval_skip.py pilot/tests/test_opencode_isolation_ses_fefd.py
      - name: Validate deterministic drive
        env:
          PYTHONPATH: pilot
        run: pytest -q pilot/tests/test_action_drive.py
      - name: Validate UO TG CE bindings and OpenCode commands
        env:
          PYTHONPATH: pilot
        run: >-
          pytest -q pilot/tests/test_compose_runtime.py::test_execution_contract_audit_clean
          pilot/tests/test_compose_runtime.py::test_uo_actions_match_engine_and_prompt_boundary
          pilot/tests/test_compose_runtime.py::test_tg_and_ce_execution_bindings_are_explicit
          pilot/tests/test_compose_runtime.py::test_native_opencode_commands_are_generated
      - name: Validate runtime handoff closure
        env:
          PYTHONPATH: pilot:engines/understand-operator/src:engines/testcase-generation:engines/code-engineering:engines/common
        run: >-
          pytest -q
          pilot/tests/test_workflow_handoff_contract.py
          pilot/tests/test_s3_uo_ready_and_contracts.py
      - name: Validate shell installer syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          python -c "import subprocess,sys; r=subprocess.check_output(['git','ls-files','--stage','install.sh'], text=True); assert r.split()[0]=='100755', r"
          python -c "import subprocess,sys; r=subprocess.check_output(['git','ls-files','--stage','uninstall.sh'], text=True); assert r.split()[0]=='100755', r"
      - name: Eval smoke (dry; live skip without model)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/pilot
        run: python evals/smoke.py
