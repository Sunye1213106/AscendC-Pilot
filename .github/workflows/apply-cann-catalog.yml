name: Apply and validate CANN API catalog

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Checkout real FAG
        uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Write deterministic evaluator
        run: |
          cat > /tmp/eval_fag_calls.py <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import os

          from uo.scripts.cann_doc_evidence import BUILTIN_CONTRACTS
          from uo.scripts.function_body import iter_function_definitions
          from uo.scripts.function_call_graph import build_call_edges_for_functions

          mode = os.environ['MODE']
          roots = [p for p in Path('real-fag').rglob('flash_attention_score_grad') if p.is_dir()]
          if not roots:
              raise SystemExit('flash_attention_score_grad directory not found')
          root = min(roots, key=lambda p: len(p.parts))
          files = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.h', '.hpp', '.cpp', '.cc', '.cxx'}:
                  continue
              parts = path.relative_to(root).parts
              if 'op_kernel' not in parts:
                  continue
              arch_parts = {part for part in parts if part.startswith('arch') and part[4:].isdigit()}
              if arch_parts and 'arch35' not in arch_parts:
                  continue
              files.append(path)
          files.sort()

          source_texts = {}
          functions = []
          for path in files:
              rel = path.relative_to(root).as_posix()
              text = path.read_text(encoding='utf-8', errors='ignore')
              source_texts[rel] = text
              functions.extend(iter_function_definitions(root, rel, architecture='arch35'))

          unresolved = []
          nodes, edges = build_call_edges_for_functions(
              functions,
              unresolved=unresolved,
              source_texts=source_texts,
              doc_evidence={'items': list(BUILTIN_CONTRACTS.values())},
          )
          status = Counter(str(edge.get('target_status') or '') for edge in edges)
          reasons = Counter(str(edge.get('verification_source') or '') for edge in edges)
          kinds = Counter(str(item.get('kind') or '') for item in unresolved)
          missing_names = Counter(
              str(item.get('callee_name') or '')
              for item in unresolved
              if str(item.get('kind') or '') != 'call_target_ambiguous'
          )
          official_symbols = Counter(
              str(edge.get('callee_name') or '')
              for edge in edges
              if str(edge.get('verification_source') or '').startswith('official_contract:')
          )
          report = {
              'mode': mode,
              'operator_root': root.as_posix(),
              'architecture': 'arch35',
              'files': len(files),
              'functions': len(functions),
              'nodes': len(nodes),
              'edges': len(edges),
              'target_status': dict(status),
              'unresolved_kinds': dict(kinds),
              'verification_reasons': dict(reasons),
              'top_missing_callees': missing_names.most_common(60),
              'official_contract_symbols': official_symbols.most_common(),
              'builtin_contract_count': len(BUILTIN_CONTRACTS),
          }
          out = Path(f'call-resolution-{mode}.json')
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
      - name: Measure baseline
        env:
          PYTHONPATH: engines/understand-operator
          MODE: before
        run: python /tmp/eval_fag_calls.py
      - name: Apply packaged catalog implementation
        run: |
          python .github/apply_cann_catalog.py
          python -m py_compile \
            engines/understand-operator/uo/scripts/cann_doc_evidence.py \
            engines/understand-operator/uo/scripts/function_call_graph.py \
            engines/understand-operator/uo/scripts/function_body.py \
            engines/understand-operator/uo/scripts/extract_kernel_subgraph.py
      - name: Run focused regressions
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          pytest -q \
            engines/understand-operator/tests/test_cann_api_catalog.py \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_call_scanner.py \
            engines/understand-operator/tests/test_function_call_graph.py \
            engines/understand-operator/tests/test_macro_regions.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
      - name: Measure catalog result
        env:
          PYTHONPATH: engines/understand-operator
          MODE: after
        run: python /tmp/eval_fag_calls.py
      - name: Compare and gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('call-resolution-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('call-resolution-after.json').read_text(encoding='utf-8'))
          before_missing = int(before['target_status'].get('missing', 0))
          after_missing = int(after['target_status'].get('missing', 0))
          official = sum(count for _name, count in after.get('official_contract_symbols') or [])
          reasons = after.get('verification_reasons') or {}
          kinds = after.get('unresolved_kinds') or {}
          missing = dict(after.get('top_missing_callees') or [])
          comparison = {
              'before_missing': before_missing,
              'after_missing': after_missing,
              'missing_reduction': before_missing - after_missing,
              'before_external': before['target_status'].get('external', 0),
              'after_external': after['target_status'].get('external', 0),
              'official_contract_edges': official,
              'before': before,
              'after': after,
          }
          Path('cann-catalog-comparison.json').write_text(
              json.dumps(comparison, indent=2, ensure_ascii=False), encoding='utf-8'
          )
          print(json.dumps({k: v for k, v in comparison.items() if k not in {'before', 'after'}}, indent=2))
          assert after_missing < before_missing, (before_missing, after_missing)
          assert before_missing - after_missing >= 300, (before_missing, after_missing)
          assert official >= 300, official
          assert reasons.get('using_external_namespace_without_internal_definition', 0) == 0
          assert reasons.get('api_style_symbol_without_internal_definition', 0) == 0
          assert kinds.get('call_target_missing', 0) == 0
          assert missing.get('Ceil', 0) > 0
          assert missing.get('Min', 0) > 0
          assert missing.get('Max', 0) > 0
          assert missing.get('LoadDataToL0A', 0) > 0
          PY
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: cann-api-catalog-validation
          path: |
            call-resolution-before.json
            call-resolution-after.json
            cann-catalog-comparison.json
      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            engines/understand-operator/pyproject.toml \
            engines/understand-operator/uo/resources/cann_api_catalog.yaml \
            engines/understand-operator/uo/scripts/cann_doc_evidence.py \
            engines/understand-operator/uo/scripts/function_call_graph.py \
            engines/understand-operator/uo/scripts/function_body.py \
            engines/understand-operator/tests/test_cann_api_catalog.py \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_call_scanner.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
          else
            git commit -m 'feat(uo): resolve CANN calls from official symbol contracts'
            git push origin HEAD:agent/tg-workflow-contract-closure
          fi
