name: Debug deterministic call resolution tests

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: read

jobs:
  debug-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
      - name: Apply patch in workspace
        run: |
          cat .github/call-resolution-payload.part* | base64 -d | gzip -d > /tmp/apply_call_opt.py
          python /tmp/apply_call_opt.py
      - name: Install dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Run tests and capture output
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          set +e
          pytest -vv \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_call_scanner.py \
            engines/understand-operator/tests/test_function_call_graph.py \
            engines/understand-operator/tests/test_macro_regions.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py \
            > call-resolution-test.log 2>&1
          echo "$?" > call-resolution-test.rc
          cat call-resolution-test.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: call-resolution-test-diagnostics
          path: |
            call-resolution-test.log
            call-resolution-test.rc
      - name: Gate tests
        run: test "$(cat call-resolution-test.rc)" = "0"
