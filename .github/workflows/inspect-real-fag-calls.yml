name: Inspect real FAG unresolved calls

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Inspect unresolved call context
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import json, re

          from uo.scripts.function_body import iter_function_definitions
          from uo.scripts.function_call_graph import build_call_edges_for_functions

          roots = [p for p in Path('real-fag').rglob('flash_attention_score_grad') if p.is_dir()]
          root = min(roots, key=lambda p: len(p.parts))
          all_files = sorted(
              p for p in root.rglob('*')
              if p.is_file() and p.suffix.lower() in {'.h', '.hpp', '.cpp', '.cc', '.cxx'}
          )
          kernel_files = [p for p in all_files if 'op_kernel' in p.as_posix()]
          functions = []
          for path in kernel_files:
              functions.extend(iter_function_definitions(root, path.relative_to(root).as_posix(), architecture='arch35'))

          unresolved = []
          nodes, edges = build_call_edges_for_functions(functions, unresolved=unresolved)
          sites = {str(n.get('id')): n for n in nodes if n.get('node_type') == 'CallSite'}
          source_lines = {}
          source_text = {}
          for p in all_files:
              try:
                  rel = p.relative_to(root).as_posix()
                  text = p.read_text(encoding='utf-8', errors='ignore')
                  source_text[rel] = text
                  source_lines[rel] = text.splitlines()
              except OSError:
                  pass

          def context_for(site):
              file_path = str(site.get('file_path') or '')
              line = int(site.get('start_line') or 0)
              lines = source_lines.get(file_path, [])
              lo, hi = max(0, line - 2), min(len(lines), line + 1)
              return '\n'.join(f'{i+1}: {lines[i]}' for i in range(lo, hi))

          def declaration_hits(name):
              pat = re.compile(r'\b' + re.escape(name) + r'\s*(?:<[^;{}\n]{0,160}>)?\s*\(')
              hits = []
              for rel, lines in source_lines.items():
                  for idx, line in enumerate(lines, 1):
                      if pat.search(line):
                          hits.append(f'{rel}:{idx}:{line.strip()}')
                          if len(hits) >= 12:
                              return hits
              return hits

          macro_defs = defaultdict(list)
          macro_pat = re.compile(r'^\s*#\s*define\s+([A-Za-z_]\w*)\s*\(')
          for rel, lines in source_lines.items():
              for idx, line in enumerate(lines, 1):
                  m = macro_pat.match(line)
                  if m:
                      macro_defs[m.group(1)].append(f'{rel}:{idx}:{line.strip()}')

          missing = defaultdict(list)
          for item in unresolved:
              if item.get('kind') != 'internal_definition_not_indexed':
                  continue
              name = str(item.get('callee_name') or '')
              site = next((s for s in sites.values() if s.get('file_path') == item.get('file_path') and int(s.get('start_line') or 0) == int(item.get('start_line') or 0) and s.get('callee_name') == name), {})
              missing[name].append({
                  'file_path': site.get('file_path'), 'line': site.get('start_line'),
                  'call_expression': site.get('call_expression'), 'receiver': site.get('receiver_type_or_object'),
                  'context': context_for(site),
              })

          external = defaultdict(list)
          external_reasons = Counter()
          for edge in edges:
              if edge.get('target_status') != 'external':
                  continue
              site = sites.get(str(edge.get('call_site_id')), {})
              name = str(edge.get('callee_name') or '')
              reason = str(edge.get('verification_source') or '')
              external_reasons[reason] += 1
              external[name].append({
                  'reason': reason, 'file_path': site.get('file_path'), 'line': site.get('start_line'),
                  'call_expression': site.get('call_expression'), 'receiver': site.get('receiver_type_or_object'),
                  'context': context_for(site),
              })

          ambiguous = defaultdict(list)
          for item in unresolved:
              if item.get('kind') != 'call_target_ambiguous':
                  continue
              name = str(item.get('callee_name') or '')
              site = next((s for s in sites.values() if s.get('file_path') == item.get('file_path') and int(s.get('start_line') or 0) == int(item.get('start_line') or 0) and s.get('callee_name') == name), {})
              ambiguous[name].append({
                  'file_path': site.get('file_path'), 'line': site.get('start_line'),
                  'call_expression': site.get('call_expression'), 'receiver': site.get('receiver_type_or_object'),
                  'candidate_ids': item.get('candidate_ids'), 'context': context_for(site),
              })

          missing_counts = Counter({k: len(v) for k, v in missing.items()})
          external_counts = Counter({k: len(v) for k, v in external.items()})
          ambiguous_counts = Counter({k: len(v) for k, v in ambiguous.items()})
          report = {
              'summary': {
                  'functions': len(functions), 'nodes': len(nodes), 'edges': len(edges),
                  'status': Counter(str(e.get('target_status') or '') for e in edges),
                  'unresolved': Counter(str(u.get('kind') or '') for u in unresolved),
                  'external_reasons': external_reasons,
              },
              'missing': {}, 'external': {}, 'ambiguous': {},
          }
          for name, _ in missing_counts.most_common(80):
              report['missing'][name] = {'count': len(missing[name]), 'samples': missing[name][:5], 'macro_defs': macro_defs.get(name, [])[:12], 'declaration_hits': declaration_hits(name)}
          for name, _ in external_counts.most_common(100):
              report['external'][name] = {'count': len(external[name]), 'samples': external[name][:5], 'macro_defs': macro_defs.get(name, [])[:12], 'declaration_hits': declaration_hits(name)}
          for name, _ in ambiguous_counts.most_common(60):
              report['ambiguous'][name] = {'count': len(ambiguous[name]), 'samples': ambiguous[name][:5]}
          Path('real-fag-call-classification.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(report['summary'], indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-fag-call-classification
          path: real-fag-call-classification.json
