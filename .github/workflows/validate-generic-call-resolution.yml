name: Validate generic call resolution

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout real FAG source
        uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Install test dependencies
        run: python -m pip install -q pytest pyyaml
      - name: Run focused regressions
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          pytest -q \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
      - name: Scan real FAG call resolution
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json

          from uo.scripts.function_body import iter_function_definitions
          from uo.scripts.function_call_graph import build_call_edges_for_functions

          roots = [p for p in Path('real-fag').rglob('flash_attention_score_grad') if p.is_dir()]
          if not roots:
              raise SystemExit('flash_attention_score_grad directory not found')
          root = min(roots, key=lambda p: len(p.parts))
          files = sorted(
              p for p in root.rglob('*')
              if p.is_file() and p.suffix.lower() in {'.h', '.hpp', '.cpp', '.cc', '.cxx'}
              and 'op_kernel' in p.as_posix()
          )
          functions = []
          for path in files:
              functions.extend(iter_function_definitions(root, path.relative_to(root).as_posix(), architecture='arch35'))
          unresolved = []
          nodes, edges = build_call_edges_for_functions(functions, unresolved=unresolved)
          target_status = Counter(str(e.get('target_status') or '') for e in edges)
          kinds = Counter(str(u.get('kind') or '') for u in unresolved)
          callees = Counter(str(u.get('callee_name') or '') for u in unresolved)
          report = {
              'operator_root': root.as_posix(),
              'files': len(files),
              'functions': len(functions),
              'nodes': len(nodes),
              'edges': len(edges),
              'target_status': dict(target_status),
              'unresolved_kinds': dict(kinds),
              'top_unresolved_callees': callees.most_common(30),
          }
          print(json.dumps(report, indent=2, ensure_ascii=False))
          Path('call-resolution-report.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8'
          )
          assert callees.get('constexpr', 0) == 0
          assert target_status.get('external', 0) > 0
          assert kinds.get('call_target_missing', 0) == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: call-resolution-report
          path: call-resolution-report.json
