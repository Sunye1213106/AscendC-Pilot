name: UO arch35 FlashAttention fresh-source audit

on:
  pull_request:
    paths:
      - "engines/understand-operator/**"
      - ".github/workflows/uo-arch35-flashattention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch35-fresh-source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AscendC-Pilot
        uses: actions/checkout@v4

      - name: Checkout real FlashAttention source
        uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: main
          path: external/flashattention

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UO runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./engines/common
          pip install -e ./engines/understand-operator
          pip install pytest

      - name: Prepare audit output
        run: mkdir -p "$GITHUB_WORKSPACE/artifacts/uo-arch35"

      - name: Targeted source-soundness tests
        run: |
          set -o pipefail
          python -m pytest \
            engines/understand-operator/tests/unit/test_codemap_soundness_audit.py \
            engines/understand-operator/tests/unit/test_host_key_source_soundness.py -q \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/uo-arch35/pytest-targeted.txt"

      - name: Full UO test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engines/understand-operator/src
        run: |
          set -o pipefail
          cd engines/understand-operator
          python -m pytest tests -q 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/uo-arch35/pytest-full.txt"

      - name: Build fresh graph from real FlashAttention source and audit 19/19
        env:
          UO_AUDIT_OUT: ${{ github.workspace }}/artifacts/uo-arch35
        run: |
          python engines/understand-operator/tools/arch35_flashattention_audit.py \
            --operator external/flashattention/flash_attention_score_grad \
            --out-dir "$UO_AUDIT_OUT"

      - name: Publish audit summary
        if: always()
        run: |
          REPORT="$GITHUB_WORKSPACE/artifacts/uo-arch35/arch35-audit.md"
          JSON_REPORT="$GITHUB_WORKSPACE/artifacts/uo-arch35/arch35-audit.json"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$JSON_REPORT" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$JSON_REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload fresh binary and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-attention-score-grad-arch35-fresh-uo-audit
          path: ${{ github.workspace }}/artifacts/uo-arch35/
          if-no-files-found: error
