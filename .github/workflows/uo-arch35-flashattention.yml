name: UO arch35 FlashAttention audit

on:
  pull_request:
    paths:
      - "engines/understand-operator/**"
      - ".github/workflows/uo-arch35-flashattention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch35-binary-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AscendC-Pilot
        uses: actions/checkout@v4

      - name: Checkout real FlashAttention source
        uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: main
          path: external/flashattention

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./engines/common
          pip install -e ./engines/understand-operator

      - name: Targeted CodeMap soundness tests
        run: |
          python -m pytest engines/understand-operator/tests/unit/test_codemap_soundness_audit.py -q

      - name: Inventory real archived facts
        env:
          UO_AUDIT_OUT: ${{ github.workspace }}/artifacts/uo-arch35
        run: |
          mkdir -p "$UO_AUDIT_OUT"
          unzip -l external/flashattention/flash_attention_score_grad/.understand-operator.zip \
            > "$UO_AUDIT_OUT/archive-list.txt"

      - name: Build and audit arch35 UO
        id: audit
        continue-on-error: true
        env:
          UO_AUDIT_OUT: ${{ github.workspace }}/artifacts/uo-arch35
        run: |
          python engines/understand-operator/tools/arch35_flashattention_audit.py \
            --operator external/flashattention/flash_attention_score_grad \
            --out-dir "$UO_AUDIT_OUT"

      - name: Inspect audit outputs
        if: always()
        run: |
          echo "workspace=$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE/artifacts" -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Publish audit summary
        if: always()
        run: |
          REPORT="$GITHUB_WORKSPACE/artifacts/uo-arch35/arch35-audit.md"
          JSON_REPORT="$GITHUB_WORKSPACE/artifacts/uo-arch35/arch35-audit.json"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$JSON_REPORT" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$JSON_REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "audit outcome: ${{ steps.audit.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload binary and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-attention-score-grad-arch35-uo-audit
          path: ${{ github.workspace }}/artifacts/uo-arch35/
          if-no-files-found: error
