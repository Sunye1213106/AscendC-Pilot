name: Validate FAG runtime follow-up

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          host = Path('engines/understand-operator/uo/scripts/extract_host_subgraph.py')
          text = host.read_text(encoding='utf-8')
          old = '''        if role in {"tiling_writer", "workspace_writer"} or (
                      name_l in tiling_writers and role != "provenance_helper"
                  ):
          '''
          new = '''        if role in {"tiling_writer", "workspace_writer"}:
          '''
          if old not in text:
              raise SystemExit('host short-name TDF fallback marker missing')
          host.write_text(text.replace(old, new, 1), encoding='utf-8')

          kernel = Path('engines/understand-operator/uo/scripts/extract_kernel_subgraph.py')
          text = kernel.read_text(encoding='utf-8')
          old = '''def parse_enum_class_domains(text: str, file_path: str = "") -> list[DeclaredDomain]:
              out: list[DeclaredDomain] = []
          '''
          new = '''def parse_enum_class_domains(text: str, file_path: str = "") -> list[DeclaredDomain]:
              out: list[DeclaredDomain] = []
              text_line_starts = _line_starts(text)
          '''
          if old not in text:
              raise SystemExit('enum parser marker missing')
          text = text.replace(old, new, 1)
          old = '''    out: list[DeclaredDomain] = []
              i = 0
          '''
          new = '''    out: list[DeclaredDomain] = []
              text_line_starts = _line_starts(text)
              i = 0
          '''
          if old not in text:
              raise SystemExit('constexpr parser marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              'line = _line_for(_line_starts(text), run[0].start())',
              'line = _line_for(text_line_starts, run[0].start())',
              1,
          )
          kernel.write_text(text, encoding='utf-8')

          tests = Path('engines/understand-operator/tests/test_fag_graph_identity_and_perf.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'from uo.scripts.function_call_graph import resolve_call_site\n',
              'from uo.scripts.function_call_graph import resolve_call_site\n'
              'from uo.scripts.extract_kernel_subgraph import (\n'
              '    parse_constexpr_block_domains,\n'
              '    parse_enum_class_domains,\n'
              ')\n',
              1,
          )
          text += '''

          def test_declared_domain_parsers_compute_lines_without_external_state() -> None:
              enum_text = "// header\nenum class Mode { A = 0, B = 1 };\n"
              enum_domains = parse_enum_class_domains(enum_text, "mode.h")
              assert enum_domains and enum_domains[0].start_line == 2

              constexpr_text = "// header\nconstexpr int MODE_A = 0;\nconstexpr int MODE_B = 1;\n"
              constexpr_domains = parse_constexpr_block_domains(constexpr_text, "mode.h")
              assert constexpr_domains and constexpr_domains[0].start_line == 2


          def test_host_tdf_writes_do_not_use_short_name_fallback() -> None:
              from inspect import getsource
              from uo.scripts.extract_host_subgraph import extract_host_subgraph

              source = getsource(extract_host_subgraph)
              assert "name_l in tiling_writers" not in source
          '''
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engines/understand-operator pytest
      - name: Compile and test
        run: |
          python -m compileall -q \
            engines/understand-operator/uo/scripts/extract_host_subgraph.py \
            engines/understand-operator/uo/scripts/extract_kernel_subgraph.py
          pytest -q engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/agent-fag-followup.yml
      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(uo): close FAG runtime identity and domain parser gaps"
          git push origin HEAD:agent/tg-workflow-contract-closure
