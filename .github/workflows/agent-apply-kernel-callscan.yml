name: Apply linear FAG kernel call scanner

on:
  pull_request:
    types: [reopened]
    branches:
      - cursor/semantic-control-plane-closure-44d6

concurrency:
  group: apply-linear-fag-kernel-callscan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: main
          path: fag
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply linear scanner patch
        run: python tools/agent_apply_kernel_callscan_fix.py
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engines/understand-operator -e pilot pytest
      - name: Compile and run graph regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/engines/understand-operator:${{ github.workspace }}/pilot
        run: |
          python -m compileall -q \
            engines/understand-operator/uo/scripts/function_body.py \
            engines/understand-operator/uo/scripts/function_call_graph.py \
            engines/understand-operator/uo/scripts/extract_kernel_subgraph.py
          pytest -q engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
          mapfile -t TEST_FILES < <(
            grep -rlE 'function_body|function_call_graph|extract_kernel_subgraph' \
              engines/understand-operator/tests --include='test_*.py' | sort -u
          )
          mapfile -t CLEAN_FILES < <(
            printf '%s\n' "${TEST_FILES[@]}" | grep -vE \
              'test_session_optimizations.py|test_synthetic_operator_pipeline.py'
          )
          pytest -q "${CLEAN_FILES[@]}"
          pytest -q engines/understand-operator/tests/test_session_optimizations.py \
            -k 'not test_propagate_empty_tensor_siblings'
          pytest -q engines/understand-operator/tests/test_synthetic_operator_pipeline.py \
            -k 'not test_opdef_unquoted_and_input_desc_hint'
      - name: Run real FAG layered graph
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/engines/understand-operator
        run: |
          set -euo pipefail
          mkdir -p real-results
          OP="$GITHUB_WORKSPACE/fag/flash_attention_score_grad"
          python -m uo.scripts.build_layered_kb "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 \
            --layers entrypoints > real-results/entrypoints.log 2>&1
          python -m uo.scripts.propose_extract_plan "$OP" \
            --op-name flash_attention_score_grad --architecture arch35 --write \
            > real-results/propose.log 2>&1
          python tools/agent_prepare_real_fag_plan.py "$OP" \
            --report real-results/plan-validation.json
          /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            -o real-results/tilingkey-time.txt \
            python -m uo.scripts.extract_tilingkey_space "$OP" \
              --op-name flash_attention_score_grad --architecture arch35 --write \
              > real-results/tilingkey.log 2>&1
          /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            -o real-results/host-time.txt \
            python -m uo.scripts.extract_host_subgraph "$OP" \
              --op-name flash_attention_score_grad --architecture arch35 --write \
              > real-results/host.log 2>&1
          set +e
          /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            -o real-results/kernel-time.txt \
            timeout 120s python -m uo.scripts.extract_kernel_subgraph "$OP" \
              --op-name flash_attention_score_grad --architecture arch35 --write \
              > real-results/kernel.log 2>&1
          KERNEL_RC=$?
          set -e
          echo "$KERNEL_RC" > real-results/kernel-exit-code.txt
          test "$KERNEL_RC" -eq 0
          /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            -o real-results/merge-time.txt \
            python -m uo.scripts.build_layered_kb "$OP" \
              --op-name flash_attention_score_grad --architecture arch35 --layers bridge \
              > real-results/merge.log 2>&1
          cp -a "$OP/.ascendc-pilot/uo/ir" real-results/ir
          python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import json, yaml

          root = Path('real-results')
          ir = root / 'ir'
          def load(name):
              return yaml.safe_load((ir/name).read_text(encoding='utf-8')) or {}
          graph = load('operator_graph.yaml')
          host = load('host_subgraph.yaml')
          kernel = load('kernel_subgraph.yaml')
          unresolved = (load('unresolved.yaml').get('items') or [])
          def timing(name):
              out={}
              p=root/f'{name}-time.txt'
              for line in p.read_text().splitlines():
                  if '=' in line:
                      k,v=line.split('=',1)
                      try: out[k]=float(v)
                      except ValueError: out[k]=v
              return out
          same=defaultdict(list)
          for node in kernel.get('function_definitions') or []:
              same[str(node.get('name') or '')].append(node)
          duplicate={
              name: sorted({str(n.get('qualified_name'))+'|'+str(n.get('identity_key')) for n in rows})
              for name,rows in same.items()
              if name and len({str(n.get('identity_key')) for n in rows}) > 1
          }
          summary={
              'source_repo':'Sunye1213106/flashattention',
              'source_sha':'94e37bc4630a6b2b5695e6a76809d1e94931d8c8',
              'entrypoint_closure':(graph.get('entrypoint_graph') or {}).get('closure'),
              'timing':{name:timing(name) for name in ('tilingkey','host','kernel','merge')},
              'operator_nodes':len(graph.get('nodes') or []),
              'operator_edges':len(graph.get('edges') or []),
              'host_nodes':len(host.get('nodes') or []),
              'host_edges':len(host.get('edges') or []),
              'kernel_nodes':len(kernel.get('nodes') or []),
              'kernel_edges':len(kernel.get('edges') or []),
              'kernel_branches':len(kernel.get('branches') or []),
              'kernel_function_definitions':len(kernel.get('function_definitions') or []),
              'duplicate_function_name_groups':len(duplicate),
              'duplicate_function_samples':dict(list(sorted(duplicate.items()))[:20]),
              'unresolved_count':len(unresolved),
              'unresolved_kinds':dict(Counter(str(x.get('kind') or 'unknown') for x in unresolved if isinstance(x,dict)).most_common()),
              'stats':graph.get('stats') or {},
          }
          closure=summary['entrypoint_closure'] or {}
          assert closure.get('closed') is True
          assert summary['kernel_nodes'] > 0
          assert summary['kernel_branches'] > 0
          assert summary['kernel_function_definitions'] > 0
          assert summary['timing']['kernel'].get('elapsed_seconds',999) < 120
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in summary.items() if k!='duplicate_function_samples'},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-fag-linear-callscan-result
          path: real-results
          retention-days: 3
      - name: Remove one-shot validation files
        run: |
          rm -f .github/workflows/agent-real-fag-e2e.yml
          rm -f .github/workflows/agent-real-fag-kernel-profile.yml
          rm -f .github/workflows/agent-apply-kernel-callscan.yml
          rm -f tools/agent_prepare_real_fag_plan.py
          rm -f tools/agent_apply_kernel_callscan_fix.py
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(uo): make kernel call-site extraction linear"
          git push origin HEAD:agent/tg-workflow-contract-closure
