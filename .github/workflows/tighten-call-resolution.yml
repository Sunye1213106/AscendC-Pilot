name: Tighten fail-closed call resolution

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - name: Tighten namespace evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          graph = Path('engines/understand-operator/uo/scripts/function_call_graph.py')
          text = graph.read_text(encoding='utf-8')
          old = '''    used_external = facts.using_namespaces_by_file.get(site.file_path, set()) & facts.external_namespaces
    if used_external and not site.receiver_type_or_object:
        return _emit_target(
            site, caller, site_id, site_node, base_edge,
            node_type="ExternalFunction", status="external",
            reason="using_external_namespace_without_internal_definition",
            confidence="structurally_inferred",
        )

    if site.receiver_type_or_object:
'''
          new = '''    # A using-directive only expands lookup candidates. It does not prove that an
    # unknown unqualified call belongs to that namespace; keep such calls unresolved
    # unless a symbol contract, qualification, or receiver type provides evidence.
    used_external = facts.using_namespaces_by_file.get(site.file_path, set()) & facts.external_namespaces

    if site.receiver_type_or_object:
'''
          if old not in text:
              raise SystemExit('namespace classification block not found')
          graph.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('engines/understand-operator/tests/test_call_external_classification.py')
          t = test.read_text(encoding='utf-8')
          marker = '''def test_external_nodes_are_deduplicated() -> None:
'''
          addition = '''def test_using_namespace_does_not_prove_unknown_free_function_is_external() -> None:
    fn = _fn("void Run() { UnknownHelper(); }")
    facts = collect_call_resolution_facts(
        [fn], source_texts={"op_kernel/test.cpp": "using namespace AscendC;\\nvoid Run() { UnknownHelper(); }"}
    )
    edge, _node, unresolved = resolve_call_site(
        _site("UnknownHelper"),
        fn,
        by_name={},
        by_qn={},
        by_id={},
        facts=facts,
    )
    assert edge and edge["target_status"] == "missing"
    assert unresolved and unresolved["kind"] == "internal_definition_not_indexed"


'''
          if addition not in t:
              if marker not in t:
                  raise SystemExit('test insertion marker not found')
              t = t.replace(marker, addition + marker, 1)
          test.write_text(t, encoding='utf-8')
          PY
          python -m py_compile engines/understand-operator/uo/scripts/function_call_graph.py
      - run: python -m pip install -q pytest pyyaml
      - name: Run focused regressions
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          pytest -q \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_call_scanner.py \
            engines/understand-operator/tests/test_function_call_graph.py \
            engines/understand-operator/tests/test_macro_regions.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
      - name: Checkout real FAG
        uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Validate real FAG arch35
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          from uo.scripts.cann_doc_evidence import BUILTIN_CONTRACTS
          from uo.scripts.function_body import iter_function_definitions
          from uo.scripts.function_call_graph import build_call_edges_for_functions

          root = min([p for p in Path('real-fag').rglob('flash_attention_score_grad') if p.is_dir()], key=lambda p: len(p.parts))
          files = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.h','.hpp','.cpp','.cc','.cxx'}:
                  continue
              parts = path.relative_to(root).parts
              if 'op_kernel' not in parts:
                  continue
              arch_parts = {p for p in parts if p.startswith('arch') and p[4:].isdigit()}
              if arch_parts and 'arch35' not in arch_parts:
                  continue
              files.append(path)
          functions, source_texts = [], {}
          for path in sorted(files):
              rel = path.relative_to(root).as_posix()
              source_texts[rel] = path.read_text(encoding='utf-8', errors='ignore')
              functions.extend(iter_function_definitions(root, rel, architecture='arch35'))
          unresolved = []
          nodes, edges = build_call_edges_for_functions(
              functions, unresolved=unresolved, source_texts=source_texts,
              doc_evidence={'items': list(BUILTIN_CONTRACTS.values())},
          )
          status = Counter(str(e.get('target_status') or '') for e in edges)
          kinds = Counter(str(u.get('kind') or '') for u in unresolved)
          reasons = Counter(str(e.get('verification_source') or '') for e in edges)
          unresolved_names = Counter(str(u.get('callee_name') or '') for u in unresolved)
          call_names = Counter(str(e.get('callee_name') or '') for e in edges)
          report = {
              'architecture':'arch35','files':len(files),'functions':len(functions),
              'nodes':len(nodes),'edges':len(edges),'target_status':dict(status),
              'unresolved_kinds':dict(kinds),'verification_reasons':dict(reasons),
              'top_unresolved_callees':unresolved_names.most_common(50),
          }
          print(json.dumps(report, indent=2, ensure_ascii=False))
          Path('call-resolution-fail-closed-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          assert call_names.get('constexpr', 0) == 0
          assert reasons.get('api_style_symbol_without_internal_definition', 0) == 0
          assert reasons.get('using_external_namespace_without_internal_definition', 0) == 0
          assert unresolved_names.get('likely', 0) == 0
          assert unresolved_names.get('unlikely', 0) == 0
          assert status.get('macro', 0) > 0
          assert kinds.get('call_target_missing', 0) == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: call-resolution-fail-closed-report
          path: call-resolution-fail-closed-report.json
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engines/understand-operator/uo/scripts/function_call_graph.py engines/understand-operator/tests/test_call_external_classification.py
          git commit -m 'fix(uo): require evidence for namespace call targets'
          git push origin HEAD:agent/tg-workflow-contract-closure
