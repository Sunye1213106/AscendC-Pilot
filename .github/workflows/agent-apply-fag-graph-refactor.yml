name: Apply FAG graph refactor

on:
  push:
    branches:
      - agent/tg-workflow-contract-closure
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source refactor
        run: |
          python tools/agent_apply_fag_graph_refactor.py
          sed -i 's/settlingdata/settilingdata/g' engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engines/understand-operator pytest
      - name: Compile changed graph modules
        run: |
          python -m compileall -q \
            engines/understand-operator/uo/scripts/function_body.py \
            engines/understand-operator/uo/scripts/function_call_graph.py \
            engines/understand-operator/uo/scripts/extract_host_subgraph.py \
            engines/understand-operator/uo/scripts/extract_kernel_subgraph.py \
            engines/understand-operator/uo/scripts/propose_extract_plan.py
      - name: Run focused FAG graph tests
        run: |
          pytest -q engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
      - name: Remove one-shot runner
        run: |
          rm -f tools/agent_apply_fag_graph_refactor.py
          rm -f .github/workflows/agent-apply-fag-graph-refactor.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(uo): preserve FAG graph identities and accelerate extraction"
          git push origin HEAD:agent/tg-workflow-contract-closure
