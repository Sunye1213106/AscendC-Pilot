name: Inspect call resolution inputs

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect macro and symbol integrations
        run: |
          set -o pipefail
          {
            echo '=== macro/preprocessor/compiler API references ==='
            grep -RInE 'macro|preprocessor|libclang|clang|compile_commands|translation.?unit|cursor.kind|macro_definition|macro_instantiation|source.lookup|codebase.memory|cbm|mcp|cann_doc_evidence|load_doc_contract' \
              engines/understand-operator/uo engines/understand-operator/tests \
              --include='*.py' --include='*.md' --include='*.yaml' || true
            echo
            echo '=== call graph related definitions ==='
            grep -RInE 'class CallSite|def extract_call_sites|def build_call_edges|def resolve_call_site|receiver_type|argument_count|include|declaration' \
              engines/understand-operator/uo/scripts engines/understand-operator/tests \
              --include='*.py' || true
          } | tee call-resolution-inspection.txt
      - uses: actions/upload-artifact@v4
        with:
          name: call-resolution-inspection
          path: call-resolution-inspection.txt
