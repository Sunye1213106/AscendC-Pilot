name: Validate PR6 TG readiness

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/call-signature-disambiguation-fa0c
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install -q pytest pyyaml

      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag

      - name: Build real FAG call-resolution report
        env:
          PYTHONPATH: engines/understand-operator
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee pr6-fag-report.log
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          from uo.scripts.cann_doc_evidence import packaged_doc_evidence_bundle
          from uo.scripts.function_body import iter_function_definitions
          from uo.scripts.function_call_graph import build_call_edges_for_functions
          from uo.scripts.source_include_closure import expand_local_include_closure

          repo = Path('real-fag').resolve()
          roots = [p for p in repo.rglob('flash_attention_score_grad') if p.is_dir()]
          assert roots, 'operator root missing'
          op_root = min(roots, key=lambda p: len(p.parts))
          seed_files=[]
          for p in op_root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.h','.hh','.hpp','.hxx','.inc','.c','.cc','.cpp','.cxx'}:
                  continue
              parts=p.relative_to(op_root).parts
              if 'op_kernel' not in parts:
                  continue
              arch={x.casefold() for x in parts if x.casefold().startswith('arch') and x[4:].isdigit()}
              if arch and 'arch35' not in arch:
                  continue
              seed_files.append(p.resolve())
          seed_files.sort()
          closure=expand_local_include_closure(repo, seed_files, architecture='arch35')
          functions=[]; texts={}
          for p in closure.files:
              rel=p.relative_to(repo).as_posix()
              texts[rel]=p.read_text(encoding='utf-8',errors='ignore')
              functions.extend(iter_function_definitions(repo, rel, architecture='arch35'))
          unresolved=[]
          nodes,edges=build_call_edges_for_functions(
              functions, unresolved=unresolved, source_texts=texts,
              doc_evidence=packaged_doc_evidence_bundle(cann_version='9.0'))
          seed_rels={p.relative_to(repo).as_posix() for p in seed_files}
          seed_ids={f.stable_id for f in functions if f.file_path in seed_rels}
          edges=[e for e in edges if e.get('source') in seed_ids]
          unresolved=[u for u in unresolved if u.get('caller_function_id') in seed_ids]
          status=Counter(str(e.get('target_status') or '') for e in edges)
          kinds=Counter(str(u.get('kind') or '') for u in unresolved)
          resolution=Counter(str(e.get('resolution_kind') or e.get('verification_source') or '') for e in edges)
          symbols=defaultdict(Counter)
          for e in edges:
              symbols[str(e.get('callee_name') or '')][str(e.get('target_status') or '')]+=1
          report={
              'seed_files':len(seed_files),'closure_files':len(closure.files),'functions':len(functions),
              'edges':len(edges),'status':dict(status),'unresolved_kinds':dict(kinds),
              'resolution_top':resolution.most_common(30),
              'watched':{n:dict(symbols[n]) for n in ['Get','GetTensor','Init','Uninit','DeterCompute','LoadDataToL0A','LoadDataToL0B','Min','Max','Ceil']},
              'closure_truncated':closure.truncated,
          }
          Path('pr6-fag-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert not closure.truncated
          assert status.get('resolved',0) >= 680
          assert status.get('candidate_set',0) <= 50
          assert status.get('missing',0) <= 420
          assert status.get('conditional',0) >= 1
          PY

      - name: Run UO producer regressions
        env:
          PYTHONPATH: engines/understand-operator
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            engines/understand-operator/tests/test_call_signature_disambiguation.py \
            engines/understand-operator/tests/test_call_equivalence_and_hardening.py \
            engines/understand-operator/tests/test_function_call_graph.py \
            engines/understand-operator/tests/test_receiver_type_propagation.py \
            engines/understand-operator/tests/test_template_type_normalizer.py \
            engines/understand-operator/tests/test_source_include_closure.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py \
            2>&1 | tee uo-producer-tests.log

      - name: Run TG init and plan consumer regressions
        shell: bash
        run: |
          set -o pipefail
          find pilot/tests engines/understand-operator/tests -type f | sort | grep -Ei '(tg|extract_plan|entrypoint|coverage_plan|testcase_contract)' | tee tg-test-files.txt || true
          mapfile -t tests < <(find pilot/tests engines/understand-operator/tests -type f -name 'test_*.py' | grep -Ei '(tg|extract_plan|entrypoint|coverage_plan|testcase_contract)' | sort)
          if [ ${#tests[@]} -eq 0 ]; then
            echo 'No TG consumer tests found' | tee tg-consumer-tests.log
            exit 1
          fi
          PYTHONPATH="pilot:engines/understand-operator" pytest -q "${tests[@]}" 2>&1 | tee tg-consumer-tests.log

      - name: Inspect TG and extract-plan interfaces
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== relevant files ==='
            find skills prompts pilot engines/understand-operator -maxdepth 5 -type f 2>/dev/null | grep -Ei '(tg-init|tg-plan|extract_plan|coverage_plan|testcase_contract|intake)' | sort | head -300
            echo '=== propose_extract_plan help ==='
            PYTHONPATH=engines/understand-operator python -m uo.scripts.propose_extract_plan --help || true
          } 2>&1 | tee tg-interface-inspection.log

      - name: Produce readiness verdict
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('pr6-fag-report.json').read_text())
          s=r['status']; u=r['unresolved_kinds']
          verdict={
            'uo_graph_ready_for_tg_init': (
              not r['closure_truncated'] and s.get('resolved',0)>=680 and s.get('candidate_set',0)<=50
            ),
            'tg_plan_ready_without_semantic_fallback': False,
            'tg_plan_ready_with_bounded_semantic_fallback': (
              s.get('candidate_set',0)<=50 and s.get('missing',0)<=420
            ),
            'blocking_reason': 'missing project helpers still require source-lookup/uo-query before semantic binding' if s.get('missing',0) else '',
            'metrics':r,
          }
          Path('tg-readiness-verdict.json').write_text(json.dumps(verdict,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(verdict,ensure_ascii=False,indent=2))
          assert verdict['uo_graph_ready_for_tg_init']
          assert verdict['tg_plan_ready_with_bounded_semantic_fallback']
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pr6-real-fag-tg-readiness
          path: |
            pr6-fag-report.json
            pr6-fag-report.log
            uo-producer-tests.log
            tg-consumer-tests.log
            tg-test-files.txt
            tg-interface-inspection.log
            tg-readiness-verdict.json

      - name: Remove one-shot workflow
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/validate-pr6-tg-readiness.yml
          git commit -m 'chore(ci): remove PR6 TG readiness workflow' || true
          git push origin HEAD:cursor/call-signature-disambiguation-fa0c
