name: Diagnose full FAG discovery regression

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source patch
        run: python tools/agent_apply_real_fag_discovery_fixes.py
      - name: Install full test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engines/understand-operator -e pilot pytest
      - name: Capture test reports
        env:
          PYTHONPATH: ${{ github.workspace }}/engines/understand-operator:${{ github.workspace }}/pilot
        run: |
          mkdir -p diagnostics
          set +e
          pytest -vv engines/understand-operator/tests/test_fag_graph_identity_and_perf.py \
            > diagnostics/focused.txt 2>&1
          echo $? > diagnostics/focused-exit.txt
          mapfile -t TEST_FILES < <(
            grep -rlE 'resolve_entrypoints|propose_extract_plan|extract_host_subgraph|extract_kernel_subgraph' \
              engines/understand-operator/tests --include='test_*.py' | sort -u
          )
          printf '%s\n' "${TEST_FILES[@]}" > diagnostics/selected-tests.txt
          pytest -vv "${TEST_FILES[@]}" > diagnostics/related.txt 2>&1
          echo $? > diagnostics/related-exit.txt
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: real-fag-full-regression-diagnostics
          path: diagnostics
          retention-days: 1
