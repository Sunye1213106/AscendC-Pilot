name: Generate real FAG extraction candidates

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR4 implementation
        uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          path: pilot-new
          fetch-depth: 1
      - name: Checkout real FAG repository
        uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: main
          path: fag-work
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UO dependencies
        working-directory: pilot-new
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engines/understand-operator
      - name: Discover entrypoints and extraction candidates
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p real-fag-candidates
          OP="$GITHUB_WORKSPACE/fag-work/flash_attention_score_grad"
          export PYTHONPATH="$GITHUB_WORKSPACE/pilot-new/engines/understand-operator"

          /usr/bin/time -f 'elapsed_seconds=%e\nmax_rss_kb=%M' \
            -o real-fag-candidates/entrypoints-time.txt \
            timeout 1200s python -m uo.scripts.build_layered_kb \
              "$OP" --op-name flash_attention_score_grad \
              --architecture arch35 --layers entrypoints \
              > real-fag-candidates/entrypoints.log 2>&1
          echo $? > real-fag-candidates/entrypoints-exit-code.txt

          if [[ ! -f "$OP/.ascendc-pilot/uo/ir/operator_boundary.yaml" ]]; then
            timeout 300s python -m uo.scripts.extract_operator_boundary \
              "$OP" --op-name flash_attention_score_grad \
              --architecture arch35 --write \
              > real-fag-candidates/boundary.log 2>&1
            echo $? > real-fag-candidates/boundary-exit-code.txt
          fi

          /usr/bin/time -f 'elapsed_seconds=%e\nmax_rss_kb=%M' \
            -o real-fag-candidates/propose-time.txt \
            timeout 1200s python -m uo.scripts.propose_extract_plan \
              "$OP" --op-name flash_attention_score_grad \
              --architecture arch35 --write \
              > real-fag-candidates/propose.log 2>&1
          echo $? > real-fag-candidates/propose-exit-code.txt

          cp -a "$OP/.ascendc-pilot/uo/ir" real-fag-candidates/ir 2>/dev/null || true
          set -e
      - name: Summarize candidates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import yaml

          root = Path('real-fag-candidates')
          ir = root / 'ir'

          def load(name):
              path = ir / name
              if not path.is_file():
                  return {}
              return yaml.safe_load(path.read_text(encoding='utf-8')) or {}

          entry = load('entrypoint_graph.yaml')
          cands = load('extract_plan_candidates.yaml')
          boundary = load('operator_boundary.yaml')
          writers = [x for x in cands.get('writer_candidates') or [] if isinstance(x, dict)]
          receivers = [x for x in cands.get('receiver_candidates') or [] if isinstance(x, dict)]
          aliases = [x for x in cands.get('alias_candidates') or [] if isinstance(x, dict)]
          role_counts = Counter(str(n.get('role') or 'unknown') for n in entry.get('nodes') or [] if isinstance(n, dict))

          summary = {
              'entrypoint_closure': entry.get('closure'),
              'entrypoint_node_count': len(entry.get('nodes') or []),
              'entrypoint_edge_count': len(entry.get('edges') or []),
              'entrypoint_role_counts': dict(role_counts),
              'boundary_inputs': len(boundary.get('inputs') or []),
              'boundary_outputs': len(boundary.get('outputs') or []),
              'candidate_status': cands.get('status'),
              'candidate_ok': cands.get('ok'),
              'candidate_reason': cands.get('reason'),
              'counts': cands.get('counts'),
              'raw_counts': cands.get('raw_counts'),
              'truncated': cands.get('truncated'),
              'writer_top': writers[:30],
              'receiver_top': receivers[:30],
              'aliases_top': aliases[:30],
              'non_sink_top': (cands.get('non_sink_root_candidates') or [])[:30],
              'extra_entries_top': (cands.get('extra_entry_candidates') or [])[:30],
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-fag-extraction-candidates
          path: real-fag-candidates
          retention-days: 1
