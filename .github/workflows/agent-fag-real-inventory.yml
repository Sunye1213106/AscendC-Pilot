name: Verify PR3 baseline failures

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b9f61a07ba8d33786792bd0b986af703d37b1063
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engines/understand-operator -e pilot pytest
      - name: Run suspected pre-existing failures
        env:
          PYTHONPATH: ${{ github.workspace }}/engines/understand-operator:${{ github.workspace }}/pilot
        run: |
          mkdir -p diagnostics
          set +e
          pytest -vv \
            engines/understand-operator/tests/test_session_optimizations.py::test_propagate_empty_tensor_siblings \
            engines/understand-operator/tests/test_synthetic_operator_pipeline.py::test_opdef_unquoted_and_input_desc_hint \
            > diagnostics/pr3-baseline.txt 2>&1
          echo $? > diagnostics/pr3-baseline-exit.txt
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: pr3-baseline-unrelated-failures
          path: diagnostics
          retention-days: 1
