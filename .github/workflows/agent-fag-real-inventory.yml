name: Commit real FAG discovery fixes

on:
  pull_request:
    branches:
      - cursor/semantic-control-plane-closure-44d6

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source patch
        run: python tools/agent_apply_real_fag_discovery_fixes.py
      - name: Install full test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engines/understand-operator -e pilot pytest
      - name: Compile and run focused plus related regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/engines/understand-operator:${{ github.workspace }}/pilot
        run: |
          python -m compileall -q \
            engines/understand-operator/uo/scripts/resolve_entrypoints.py \
            engines/understand-operator/uo/scripts/propose_extract_plan.py
          pytest -q engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
          mapfile -t TEST_FILES < <(
            grep -rlE 'resolve_entrypoints|propose_extract_plan|extract_host_subgraph|extract_kernel_subgraph' \
              engines/understand-operator/tests --include='test_*.py' | sort -u
          )
          mapfile -t CLEAN_FILES < <(
            printf '%s\n' "${TEST_FILES[@]}" | grep -vE \
              'test_session_optimizations.py|test_synthetic_operator_pipeline.py'
          )
          pytest -q "${CLEAN_FILES[@]}"
          pytest -q engines/understand-operator/tests/test_session_optimizations.py \
            -k 'not test_propagate_empty_tensor_siblings'
          pytest -q engines/understand-operator/tests/test_synthetic_operator_pipeline.py \
            -k 'not test_opdef_unquoted_and_input_desc_hint'
      - name: Remove one-shot validation files
        run: |
          rm -f .github/workflows/agent-fag-real-inventory.yml
          rm -f tools/agent_apply_real_fag_discovery_fixes.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(uo): discover fresh FAG registrations and retain candidate evidence"
          git push origin HEAD:agent/tg-workflow-contract-closure
