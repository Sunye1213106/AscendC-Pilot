name: Validate nested template member aliases

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - run: python -m pip install -q pytest pyyaml
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Capture baseline
        env:
          PYTHONPATH: engines/understand-operator
        run: python .github/nested_type_report.py --repo real-fag --output nested-before.json
      - name: Apply nested member integration
        run: |
          python .github/apply_nested_member_types.py
          python -m py_compile \
            engines/understand-operator/uo/scripts/type_normalizer.py \
            engines/understand-operator/uo/scripts/receiver_type_facts.py \
            engines/understand-operator/uo/scripts/function_call_graph.py
      - name: Strict focused regression
        env:
          PYTHONPATH: engines/understand-operator
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            engines/understand-operator/tests/test_template_type_normalizer.py \
            engines/understand-operator/tests/test_receiver_type_propagation.py \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_function_call_graph.py \
            engines/understand-operator/tests/test_call_scanner.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py \
            2>&1 | tee nested-pytest.log
      - name: Capture patched metrics
        env:
          PYTHONPATH: engines/understand-operator
        run: python .github/nested_type_report.py --repo real-fag --output nested-after.json
      - uses: actions/upload-artifact@v4
        with:
          name: fag-nested-template-member-aliases
          path: |
            nested-before.json
            nested-after.json
            nested-pytest.log
      - name: Gate deterministic improvement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('nested-before.json').read_text())['status']
          a=json.loads(Path('nested-after.json').read_text())['status']
          print('before', b)
          print('after ', a)
          assert a.get('candidate_set',0) < b.get('candidate_set',0), (b,a)
          assert a.get('missing',0) <= b.get('missing',0), (b,a)
          assert a.get('external',0) >= b.get('external',0), (b,a)
          assert a.get('resolved',0) > b.get('resolved',0), (b,a)
          PY
      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            engines/understand-operator/uo/scripts/type_normalizer.py \
            engines/understand-operator/uo/scripts/receiver_type_facts.py \
            engines/understand-operator/tests/test_template_type_normalizer.py
          git commit -m 'feat(uo): resolve nested template member aliases'
          git push origin HEAD:agent/tg-workflow-contract-closure
      - name: Remove one-shot assets
        run: |
          git rm -f \
            .github/apply_nested_member_types.py \
            .github/apply_nested_type_resolution.py \
            .github/apply_selector_type_resolution.py \
            .github/fix_nested_patcher_quotes.py \
            .github/nested_type_report.py \
            .github/workflows/validate-nested-type-resolution.yml
          git commit -m 'chore(ci): remove nested type validation assets'
          git push origin HEAD:agent/tg-workflow-contract-closure
