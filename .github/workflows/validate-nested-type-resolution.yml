name: Diagnose remaining receiver candidates

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
      - run: python -m pip install -q pyyaml
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Capture candidate diagnostics
        env:
          PYTHONPATH: engines/understand-operator
        run: python .github/nested_type_report.py --repo real-fag --output receiver-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: fag-receiver-candidate-diagnostics
          path: receiver-candidates.json
