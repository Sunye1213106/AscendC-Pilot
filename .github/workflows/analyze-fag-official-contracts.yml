name: Inspect FAG wrappers and macros

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Collect helper definitions and include chain
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('real-fag')
          suffixes={'.h','.hpp','.hh','.hxx','.inc','.cpp','.cc','.cxx'}
          symbols=['LoadDataToL0A','LoadDataToL0B','LoadDataToL0AMx','LoadDataToL0BMx','Min','Max','Ceil','CeilDivision']
          definitions=[]; includes=[]; macros=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in suffixes:
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if re.match(r'^\s*#\s*include\b', line):
                      if any(key in p.as_posix() for key in ('flash_attention_score_grad_kernel_deter.h','cube_api/matmul.h','common/op_kernel/matmul.h')):
                          includes.append({'file':p.as_posix(),'line':i+1,'text':line})
                  if re.match(r'^\s*#\s*define\s+INVOKE_FAG_',line):
                      j=i; logical=line
                      while re.search(r'\\\s*$',logical) and j+1<len(lines):
                          logical=re.sub(r'\\\s*$',' ',logical)+lines[j+1]
                          j+=1
                      macros.append({'file':p.as_posix(),'line':i+1,'end_line':j+1,'text':logical[:4000]})
              for sym in symbols:
                  pat=re.compile(rf'\b{re.escape(sym)}\s*(?:<[^;{{}}()]*>)?\s*\(')
                  for m in pat.finditer(text):
                      line=text.count('\n',0,m.start())+1
                      lo=max(0,line-8); hi=min(len(lines),line+12)
                      pre='\n'.join(lines[lo:line])
                      head='\n'.join(lines[lo:hi])
                      looks_def=bool(re.search(r'(#\s*define|\btemplate\b|\binline\b|\bconstexpr\b|\bstatic\b|__aicore__)[^;{}]{0,500}$',pre,re.S))
                      if looks_def:
                          definitions.append({'symbol':sym,'file':p.as_posix(),'line':line,'context':'\n'.join(f'{k+1}: {lines[k]}' for k in range(lo,hi))})
          payload={'definitions':definitions,'includes':includes,'macros':macros}
          Path('fag-helper-definitions.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'definition_count':len(definitions),'include_count':len(includes),'macro_count':len(macros),'symbols':sorted({d['symbol'] for d in definitions})},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fag-helper-definitions
          path: fag-helper-definitions.json
