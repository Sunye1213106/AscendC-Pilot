name: Validate FAG overload-family compression

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
          fetch-depth: 0
      - name: Apply overload-family integration
        run: |
          python .github/apply_overload_family.py
          python -m py_compile engines/understand-operator/uo/scripts/function_call_graph.py
      - run: python -m pip install -q pytest pyyaml
      - name: Run focused regressions
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          pytest -q \
            engines/understand-operator/tests/test_source_include_closure.py \
            engines/understand-operator/tests/test_macro_regions.py \
            engines/understand-operator/tests/test_call_external_classification.py \
            engines/understand-operator/tests/test_call_scanner.py \
            engines/understand-operator/tests/test_function_call_graph.py \
            engines/understand-operator/tests/test_cann_api_catalog.py \
            engines/understand-operator/tests/test_fag_graph_identity_and_perf.py
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Evaluate real FAG arch35
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          set +e
          python - <<'PY' 2>&1 | tee overload-family.log
          from collections import Counter, defaultdict
          from pathlib import Path
          import json

          from uo.scripts.cann_doc_evidence import packaged_doc_evidence_bundle
          from uo.scripts.function_body import iter_function_definitions
          from uo.scripts.function_call_graph import build_call_edges_for_functions
          from uo.scripts.source_include_closure import expand_local_include_closure

          repo = Path('real-fag').resolve()
          roots = [p for p in repo.rglob('flash_attention_score_grad') if p.is_dir()]
          op_root = min(roots, key=lambda p: len(p.parts))
          seed_files = []
          for path in op_root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.h','.hh','.hpp','.hxx','.inc','.c','.cc','.cpp','.cxx'}:
                  continue
              parts = path.relative_to(op_root).parts
              if 'op_kernel' not in parts:
                  continue
              arch_parts = {part.casefold() for part in parts if part.casefold().startswith('arch') and part[4:].isdigit()}
              if arch_parts and 'arch35' not in arch_parts:
                  continue
              seed_files.append(path.resolve())
          seed_files.sort()
          closure = expand_local_include_closure(repo, seed_files, architecture='arch35')

          texts = {}
          functions = []
          seed_paths = set(seed_files)
          for path in closure.files:
              rel = path.relative_to(repo).as_posix()
              source = path.read_text(encoding='utf-8', errors='ignore')
              texts[rel] = source
              functions.extend(iter_function_definitions(repo, rel, architecture='arch35'))
          seed_ids = {
              fn.stable_id for fn in functions
              if (repo / fn.file_path).resolve() in seed_paths
          }
          unresolved = []
          nodes, edges = build_call_edges_for_functions(
              functions, unresolved=unresolved, source_texts=texts,
              doc_evidence=packaged_doc_evidence_bundle(cann_version='9.0'),
          )
          seed_edges = [edge for edge in edges if edge.get('source') in seed_ids]
          seed_unresolved = [item for item in unresolved if item.get('caller_function_id') in seed_ids]
          status = Counter(str(edge.get('target_status') or '') for edge in seed_edges)
          kinds = Counter(str(item.get('kind') or '') for item in seed_unresolved)
          symbols = defaultdict(Counter)
          for edge in seed_edges:
              name = str(edge.get('callee_name') or '')
              symbols[name][str(edge.get('target_status') or '')] += 1
              symbols[name]['reason:' + str(edge.get('verification_source') or '')] += 1
          family_nodes = [node for node in nodes if node.get('node_type') == 'FunctionOverloadSet']
          report = {
              'seed_call_status': dict(status),
              'unresolved_kinds': dict(kinds),
              'overload_family_node_count': len(family_nodes),
              'load_data_to_l0b': dict(symbols.get('LoadDataToL0B', {})),
              'min': dict(symbols.get('Min', {})),
              'max': dict(symbols.get('Max', {})),
              'ceil': dict(symbols.get('Ceil', {})),
              'candidate_symbols': sorted(
                  ((name, counts.get('candidate_set',0)) for name, counts in symbols.items() if counts.get('candidate_set',0)),
                  key=lambda item: (-item[1], item[0]),
              )[:80],
              'family_symbols': sorted(
                  ((name, counts.get('resolved_family',0)) for name, counts in symbols.items() if counts.get('resolved_family',0)),
                  key=lambda item: (-item[1], item[0]),
              )[:80],
          }
          Path('overload-family-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))

          assert status.get('missing',0) <= 481
          assert status.get('candidate_set',0) < 351
          assert status.get('resolved_family',0) > 0
          assert report['load_data_to_l0b'].get('missing',0) == 0
          assert report['min'].get('external',0) == 0
          assert report['max'].get('external',0) == 0
          PY
          echo ${PIPESTATUS[0]} > overload-family.status
          exit 0
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: fag-overload-family
          path: |
            overload-family-report.json
            overload-family.log
            overload-family.status
      - name: Gate real FAG validation
        run: test "$(cat overload-family.status)" = "0"
      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            engines/understand-operator/uo/scripts/function_call_graph.py \
            engines/understand-operator/tests/test_function_call_graph.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
          else
            git commit -m 'feat(uo): compress source overloads into function families'
            git push origin HEAD:agent/tg-workflow-contract-closure
          fi
