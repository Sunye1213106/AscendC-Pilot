name: Inspect FAG receiver-type ambiguity

on:
  pull_request:
    branches: [cursor/semantic-control-plane-closure-44d6]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tg-workflow-contract-closure
      - run: python -m pip install -q pyyaml
      - uses: actions/checkout@v4
        with:
          repository: Sunye1213106/flashattention
          ref: 94e37bc4630a6b2b5695e6a76809d1e94931d8c8
          path: real-fag
      - name: Capture candidate contexts
        env:
          PYTHONPATH: engines/understand-operator
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json

          from uo.scripts.cann_doc_evidence import packaged_doc_evidence_bundle
          from uo.scripts.function_body import iter_function_definitions
          from uo.scripts.function_call_graph import build_call_edges_for_functions
          from uo.scripts.source_include_closure import expand_local_include_closure

          repo=Path('real-fag').resolve()
          op=min([p for p in repo.rglob('flash_attention_score_grad') if p.is_dir()],key=lambda p:len(p.parts))
          seeds=[]
          for p in op.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.h','.hh','.hpp','.hxx','.inc','.c','.cc','.cpp','.cxx'}: continue
              parts=p.relative_to(op).parts
              if 'op_kernel' not in parts: continue
              arches={x.casefold() for x in parts if x.casefold().startswith('arch') and x[4:].isdigit()}
              if arches and 'arch35' not in arches: continue
              seeds.append(p.resolve())
          closure=expand_local_include_closure(repo,seeds,architecture='arch35')
          texts={}; funcs=[]
          for p in closure.files:
              rel=p.relative_to(repo).as_posix(); txt=p.read_text(encoding='utf-8',errors='ignore')
              texts[rel]=txt; funcs.extend(iter_function_definitions(repo,rel,architecture='arch35'))
          unresolved=[]
          nodes,edges=build_call_edges_for_functions(funcs,unresolved=unresolved,source_texts=texts,doc_evidence=packaged_doc_evidence_bundle(cann_version='9.0'))
          sites={str(n.get('id')):n for n in nodes if n.get('node_type')=='CallSite'}
          fns={fn.stable_id:fn for fn in funcs}
          watched={'Get','GetTensor','Init','LoadDataToL0B'}
          out=defaultdict(list)
          for edge in edges:
              name=str(edge.get('callee_name') or '')
              if name not in watched or edge.get('target_status')!='candidate_set': continue
              site=sites.get(str(edge.get('call_site_id') or ''),{})
              file=str(site.get('file_path') or '')
              line=int(site.get('start_line') or 0)
              src_lines=texts.get(file,'').splitlines()
              lo=max(0,line-5); hi=min(len(src_lines),line+4)
              candidates=[]
              for row in edge.get('candidate_scores') or []:
                  fn=fns.get(str(row.get('function_id') or ''))
                  candidates.append({
                      'id':row.get('function_id'),'score':row.get('score'),'evidence':row.get('evidence'),
                      'qualified_name':fn.qualified_name if fn else None,
                      'owner':fn.class_or_namespace if fn else None,
                      'signature':fn.normalized_signature if fn else None,
                      'file':fn.file_path if fn else None,
                  })
              if len(out[name])<30:
                  out[name].append({
                      'call_expression':site.get('call_expression'),
                      'receiver':site.get('receiver_type_or_object'),
                      'receiver_object':site.get('receiver_object'),
                      'receiver_type':site.get('receiver_type'),
                      'argument_count':site.get('argument_count'),
                      'file':file,'line':line,
                      'context':'\n'.join(f'{i+1}: {src_lines[i]}' for i in range(lo,hi)),
                      'candidates':candidates,
                  })
          Path('receiver-ambiguity.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({k:len(v) for k,v in out.items()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fag-receiver-ambiguity
          path: receiver-ambiguity.json
