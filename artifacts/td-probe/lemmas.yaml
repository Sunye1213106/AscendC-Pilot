# Which tiling data values a TilingKey already fixes.
#
# Each rule says: under keys matching `when`, the field can only hold `value`.
# That is a claim about the host, not about the cases that happened to run, so
# each carries the host reasoning it follows from. `check_lemmas.py` then tries
# to refute every rule against every observation on record; a rule that survives
# is used to exclude the branch outcomes it makes impossible, and a rule that
# fails is a bug in the rule, not evidence about the operator.
#
# The point of pinning a field rather than excluding a branch directly: the same
# fact ("dropout is off") closes several branches in different files, and stating
# it once keeps them consistent.
version: 1

rules:
  - id: drop_off_keeps_prob_one
    field: keepProb
    when: {IsDrop: "0"}
    value: 1.0
    evidence:
      argument: >
        IsDrop is the key's encoding of whether dropout is on, and the host
        derives it from keep_prob itself: dropValue is set from keepProb<1. A key
        with IsDrop=0 therefore only arises when keep_prob was 1, and the same
        keepProb is what reaches the tiling data.
      host_writer: flash_attention_score_grad_tiling_normal_regbase.cpp:1840

  - id: drop_off_has_no_mask_outer
    field: dropMaskOuter
    when: {IsDrop: "0"}
    value: 0
    evidence:
      argument: >
        dropMaskOuter sizes the dropout mask's outer loop. With dropout off there
        is no mask tensor to split, and the host leaves the field at zero.
      host_writer: flash_attention_score_grad_tiling_normal_regbase.cpp:1852

  - id: non_tnd_has_no_zero_s_value
    field: sValueZeroUnderTND
    when: {IsTnd: "0"}
    value: False
    evidence:
      argument: >
        The field's own name states its scope: it reports a zero-length sequence
        found while parsing the TND sequence vector. Outside TND there is no such
        vector -- B and S come from the tensor shapes, which cannot be zero for a
        non-empty tensor -- so nothing sets it.
      host_writer: flash_attention_score_grad_tiling_normal_regbase.cpp:1235

  - id: platform_core_num
    field: coreNum
    when: {}
    value: 32
    evidence:
      argument: >
        coreNum is the platform's core count, taken from CompileInfo, not from
        any input. The replay driver pins Ascend950 with CORE_NUM=32, so on this
        platform the field is a constant and VEC_CORE_NUM_64 is unreachable.
        This rule is platform-scoped: a 64-core part would need its own.
      host_writer: flash_attention_score_grad_tiling_normal_regbase.cpp
      scope: platform=Ascend950

  - id: drop_off_divisible_by_8
    field: dropoutIsDivisibleBy8
    when: {IsDrop: "0"}
    value: 1
    evidence:
      argument: >
        ProcessOptionalInput defaults dropoutIsDivisibleBy8 to 1 and only calls
        ProcessDropoutIsDivisibleBy8 when keepProb < 1. IsDrop=0 keys only arise
        when keep_prob was 1, so the host never rewrites the flag and the
        kernel's `dropoutIsDivisibleBy8 == 0` arm cannot fire.
      host_writer: flash_attention_score_grad_tiling_common_regbase.cpp:1012

  - id: no_atten_mask_nondeter_sparse_dense
    field: sparseType
    when: {IsAttenMask: "0", DeterType: "0"}
    value: 0
    evidence:
      argument: >
        SetSparseParams returns false whenever attenMaskOptional is EMPTY
        (IsAttenMask=0). Under non-deterministic keys (DeterType=0),
        GetSparseType then takes denseCondition (!isSparse) and writes
        SparseType::DENSE (0). Deterministic-old keys (DeterType=1) can still
        write UNSUPPORTED (3) through a different path, so this pin is scoped
        to DeterType=0. BAND (2) is unreachable either way under IsAttenMask=0.
      host_writer: flash_attention_score_grad_tiling_common_regbase.cpp:1541
                   flash_attention_score_grad_tiling_normal_regbase.cpp:819
