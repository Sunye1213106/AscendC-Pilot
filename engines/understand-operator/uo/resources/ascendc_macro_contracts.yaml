version: 2
catalog: ascendc_macro_contracts
notes: >
  仅登记 CANN / AscendC 官方包内宏。合同是框架语义权威；源码 invocation 是项目事实权威。
  算子仓自定义宏（例如 FAG 的 TND_/BASE_TILING_DATA_COMMON_ASSIGN、IsTnd 业务维度名）
  禁止写入本文件：能在算子源码 #define / 调用点找到的，一律走源码发现，不做合同登记。
  不得按宏名直接生成最终 writer role。handlers 由 ascendc_macro_facts /
  macro_entrypoint_projection / tiling_* 模块消费。
  验收：源码中出现的已知官方宏必须被物化；不是合同列表每项都必须出现。
contracts:
  - name: REG_OP
    semantic_kind: operator_schema
    invocation_style: function_like
    contract_class: framework_required
    version_scope: "cann>=7.0"
    argument_roles:
      0: operator_type
    emitted_fact_types:
      - operator_registration
    materializer:
      handler: registration_operator
    confidence_rule:
      source_invocation_required: true

  - name: IMPL_OP_OPTILING
    semantic_kind: host_registration
    invocation_style: chained_dsl
    contract_class: framework_required
    version_scope: "cann>=7.0"
    argument_roles:
      0: operator_type
    chained_methods:
      Tiling:
        argument_roles:
          0: tiling_function
        emitted_fact_types:
          - binds_tiling
      TilingParse:
        argument_roles:
          0: tiling_parse_function
        emitted_fact_types:
          - binds_tiling_parse
    emitted_fact_types:
      - public_host_entry
      - registers
    materializer:
      handler: registration_host_chained
    confidence_rule:
      source_invocation_required: true

  - name: DEVICE_IMPL_OP_OPTILING
    semantic_kind: host_registration
    invocation_style: chained_dsl
    contract_class: optional_framework_pattern
    version_scope: "cann>=8.0"
    argument_roles:
      0: operator_type
    chained_methods:
      Tiling:
        argument_roles:
          0: tiling_function
        emitted_fact_types:
          - binds_tiling
      TilingParse:
        argument_roles:
          0: tiling_parse_function
        emitted_fact_types:
          - binds_tiling_parse
    emitted_fact_types:
      - public_host_entry
      - registers
    materializer:
      handler: registration_host_chained
    confidence_rule:
      source_invocation_required: true

  - name: REGISTER_TILING_TEMPLATE
    semantic_kind: template_registration
    invocation_style: function_like
    contract_class: framework_required
    version_scope: "cann>=7.0"
    argument_roles:
      0: operator_type
      1: template_class
      2: architecture
      3: priority
    emitted_fact_types:
      - registers_template
      - available_on_arch
    materializer:
      handler: registration_template
    confidence_rule:
      source_invocation_required: true

  - name: REGISTER_TILING_TEMPLATE_WITH_ARCH
