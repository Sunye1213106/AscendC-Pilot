version: 1
catalog: ascendc_macro_contracts
notes: >
  Public AscendC registration / template / KEY macro contracts for deterministic
  semantic materialization. Handlers live in uo.scripts.macro_semantic_materializer.
contracts:
  - name: REG_OP
    semantic_kind: operator_schema
    invocation_style: function_like
    argument_roles:
      0: operator_type
    emits:
      nodes:
        - role: operator_registration
      edges:
        - type: declares_operator
    materializer:
      handler: registration_operator
    confidence_rule:
      source_invocation_required: true

  - name: IMPL_OP_OPTILING
    semantic_kind: host_registration
    invocation_style: chained_dsl
    argument_roles:
      0: operator_type
    chained_methods:
      Tiling:
        argument_roles:
          0: tiling_function
        emits:
          edges:
            - type: binds_tiling
      TilingParse:
        argument_roles:
          0: tiling_parse_function
        emits:
          edges:
            - type: binds_tiling_parse
    emits:
      nodes:
        - role: public_host_entry
      edges:
        - type: registers
    materializer:
      handler: registration_host_chained
    confidence_rule:
      source_invocation_required: true

  - name: REGISTER_TILING_TEMPLATE
    semantic_kind: template_registration
    invocation_style: function_like
    argument_roles:
      0: operator_type
      1: template_class
      2: architecture
      3: priority
    conditions:
      architecture_argument: 2
    emits:
      nodes:
        - role: template_registration
      edges:
        - type: registers_template
        - type: available_on_arch
    materializer:
      handler: registration_template
    confidence_rule:
      source_invocation_required: true

  - name: REGISTER_TILING_TEMPLATE_WITH_ARCH
    semantic_kind: template_registration
    invocation_style: function_like
    argument_roles:
      0: operator_type
      1: template_class
      2: architecture
      3: priority
    conditions:
      architecture_argument: 2
    emits:
      nodes:
        - role: template_registration
      edges:
        - type: registers_template
        - type: available_on_arch
    materializer:
      handler: registration_template
    confidence_rule:
      source_invocation_required: true

  - name: ASCENDC_TPL_ARGS_SEL
    semantic_kind: kernel_compile_selection
    invocation_style: nested_selection
    argument_roles: {}
    emits:
      edges:
        - type: selects_tiling_key
    materializer:
      handler: kernel_tpl_selection
    confidence_rule:
      source_invocation_required: true

  - name: GET_TPL_TILING_KEY
    semantic_kind: kernel_compile_selection
    invocation_style: function_like
    argument_roles: {}
    emits:
      edges:
        - type: writes_tiling_key
    materializer:
      handler: kernel_tpl_selection
    confidence_rule:
      source_invocation_required: true

  - name: GET_TILING_DATA
    semantic_kind: kernel_runtime_binding
    invocation_style: function_like
    argument_roles:
      0: tiling_data_type
    emits:
      edges:
        - type: uses_tiling_data
    materializer:
      handler: kernel_tiling_data_bind
    confidence_rule:
      source_invocation_required: true
