[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uo-init"
version = "0.1.0"
description = "Ascend C understand-operator init: control-source closure graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "libclang>=18.1.1",
  "PyYAML>=6.0",
  "acp-common",
]

[project.optional-dependencies]
legacy-solver = ["z3-solver>=4.12", "acp-common[legacy-solver]"]
dev = ["pytest>=8.0"]

[project.scripts]
uo-init = "uo_init.workflow:main"
uo-dump = "uo_init.dump:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requires_cann: needs extracted CANN headers under cann_root",
  "requires_fag: needs FAG operator sources under ops_root",
]
filterwarnings = ["ignore::DeprecationWarning"]
