[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uo-init"
version = "0.1.0"
description = "AscendC UO CodeMap compiler"
readme = { text = "AscendC UO CodeMap compiler package.", content-type = "text/plain" }
requires-python = ">=3.10"
dependencies = [
  "libclang>=18.1.1",
  "PyYAML>=6.0",
  "acp-common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uo-init = "uo_init.workflow:main"
uo-dump = "uo_init.dump:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requires_cann: needs extracted CANN headers under cann_root",
  "requires_fag: needs FAG operator sources under ops_root",
]
filterwarnings = ["ignore::DeprecationWarning"]
