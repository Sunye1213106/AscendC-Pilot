# Spec bundle for the active layered-KB pipeline.
# Only paths listed under hash_inputs participate in spec_bundle_hash.

version: 1
name: understand-operator
compatible_plugin_versions:
  - "0.2"

# Ordered list; relative to this directory (spec/).
hash_inputs:
  - ownership.yaml
  - kb_layout.yaml
  - schemas/diff/index.schema.yaml
  - schemas/diff/change_set.schema.yaml
  - schemas/diff/impact.schema.yaml
  - schemas/diff/unresolved.schema.yaml
  - schemas/kb_graph/metadata.schema.yaml
  - schemas/review/index.schema.yaml
  - schemas/review/functional_report.schema.yaml
  - schemas/review/bug_report.schema.yaml

notes:
  - Do not copy these files into .ascendc-pilot/uo/.
  - Changing any hash_inputs file (or this list via code) invalidates stored spec_bundle_hash
    and may trigger /uo-update scope reconfirmation (field needs_scope_review is an internal alias).
