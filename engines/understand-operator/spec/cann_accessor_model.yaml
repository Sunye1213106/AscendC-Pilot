# Minimal CANN accessor binding rules (global asset; no FAG-only hardcoding).
version: 1
rules:
  GetAttrs.GetAttrPointer:
    pattern: 'GetAttrs\(\)->GetAttrPointer<[^>]+>\(\s*(?:static_cast<size_t>\()?AttrIndex::(\w+)'
    root: ATTRIBUTE
  GetInputDesc.GetDataType:
    pattern: 'GetInputDesc\(\s*(?:static_cast<size_t>\()?InputIndex::(\w+)'
    root: INPUT_DTYPE
  GetStorageShape.GetDim:
    pattern: 'GetStorageShape\(\)\.GetDim\(\s*(\d+)\s*\)'
    root: INPUT_SHAPE
  GetOptionalInputTensor:
    pattern: 'GetOptionalInputTensor\(\s*(?:static_cast<size_t>\()?InputIndex::(\w+)'
    root: OPTIONAL_INPUT_PRESENCE
