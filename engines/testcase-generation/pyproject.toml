[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testcase-agent"
version = "0.2.0"
description = "AscendC Testcase Generation (TG) engine for AscendC-Pilot"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "acp-common",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "numpy>=1.24",
]
closure = [
  "testcase-agent[ml]",
]

[project.scripts]
# tg-contract / tg-plan / tg-solve / tg-init (testcase_agent.cli) removed with the
# csv_consumer stack — the pilot's tilingkey_full_coverage flow now owns
# contract_build / plan / solve via `acp run-action` (ascendc_pilot.actions.engines).
tg-closure = "testcase_agent.closure.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["testcase_agent*"]
