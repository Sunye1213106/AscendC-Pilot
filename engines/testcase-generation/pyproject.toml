[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testcase-agent"
version = "0.2.0"
description = "AscendC Testcase Generation (TG) engine for AscendC-Pilot"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
solver = [
  "z3-solver>=4.12",
]

[project.scripts]
# tg-contract removed from public CLI — invoke via acp run-action contract_build
tg-plan = "testcase_agent.cli:plan_main"
tg-solve = "testcase_agent.cli:solve_main"
tg-init = "testcase_agent.cli:init_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["testcase_agent*"]
