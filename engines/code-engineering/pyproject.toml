[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-engineering"
version = "0.1.0"
description = "AscendC Code Engineering (CE) engine for AscendC-Pilot"
readme = "README.md"
requires-python = ">=3.10"
# CE closure workflows consume the finalized UO CodeMap directly. Keep this
# explicit so standalone CE installs cannot silently degrade because the
# sibling UO package was omitted.
dependencies = [
  "PyYAML>=6.0",
  "acp-common",
  "uo-init>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["code_engineering*"]
