version: 1
source: test_fixture
key_tokens:
  IS_TND: {var: VAR_KEY_ISTND, true_value: 1}
  IS_ROPE: {var: VAR_KEY_ISROPE, true_value: 1}
  IS_ATTEN_MASK: {var: VAR_KEY_ISATTENMASK, true_value: 1}
  IS_PSE: {var: VAR_KEY_ISPSE, true_value: 1}
  IS_DROP: {var: VAR_KEY_ISDROP, true_value: 1}
  IS_N_EQUAL: {var: VAR_KEY_ISNEQUAL, true_value: 0}
  ENABLE_UNITFLAG: {var: VAR_KEY_ENABLEUNITFLAG, true_value: 1}
csv_field_aliases:
  issink: {column: is_sink, value: 1}
  is_sink: {column: is_sink, value: 1}
  rope: {column: rope, value: 1}
key_derivations:
  - id: VAR_KEY_ISTND
    type: int
    domain: [0, 1]
    expr:
      op: if_then_else
      condition: {op: eq, var: VAR_CSV_Input_Layout, value: TND}
      then: 1
      else: 0
    rationale: test fixture Input_Layout==TND
    source_refs: [{path: tests/fixtures/sample_binding_lexicon.yaml}]
  - id: VAR_KEY_ISROPE
    type: int
    domain: [0, 1]
    expr:
      op: if_then_else
      condition: {op: eq, var: VAR_CSV_rope, value: 1}
      then: 1
      else: 0
    rationale: test fixture rope==1
    source_refs: [{path: tests/fixtures/sample_binding_lexicon.yaml}]
