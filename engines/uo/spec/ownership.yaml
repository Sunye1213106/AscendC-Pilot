version: 1
owners:
  uo-orchestrator:
    may_read:
      - manifest.yaml
      - ir/**
      - contracts/**  # retired residue only; do not recreate
      - tiling/**
      - kernel/**
      - cross_layer/**
      - checks/**
      - runs/**
      - cbm/**
      - diff/**
      - summary/**
      - indexes/**
      - review/**
      - query/**
    may_write:
      - manifest.yaml
      - runs/*/phase0/**
      - cbm/index_meta.json
      - ir/**
      - tiling/**
      - kernel/**
      - cross_layer/**
      - checks/final.yaml
      - checks/artifact_hashes.yaml
      - checks/integrity.yaml
      - checks/confidence_gate.yaml
      - diff/**
      - summary/**
      - runs/*/update/**
      - indexes/kb_graph.sqlite
      - query/**
  uo-code-review:
    may_read:
      - manifest.yaml
      - ir/**
      - contracts/**
      - tiling/**
      - kernel/**
      - cross_layer/**
      - checks/**
      - runs/**
      - cbm/**
      - diff/**
      - summary/**
      - indexes/**
      - query/**
      - review/**
    may_write:
      - review/**
      - runs/*/review/**
  uo-kb-review:
    may_read:
      - manifest.yaml
      - ir/**
      - contracts/**
      - tiling/**
      - kernel/**
      - cross_layer/**
      - checks/**
      - summary/**
      - indexes/**
      - review/**
    may_write:
      - review/kb_product_review.yaml
  uo-semantic-resolve:
    may_read:
      - manifest.yaml
      - ir/**
      - tiling/key_cards/**
      - runs/**
      - cbm/**
    may_write:
      - ir/resolution_patch.yaml
      - ir/entrypoint_confirm.yaml
      - ir/extract_plan.yaml
  uo-key-resolve:
    may_read:
      - manifest.yaml
      - ir/**
      - tiling/key_cards/**
      - runs/**
      - cbm/**
      - indexes/**
    may_write:
      - ir/key_triage.yaml
      - ir/input_derivable_patch.yaml
      - ir/key_shape_resolve/**
  uo-query:
    may_read:
      - manifest.yaml
      - ir/**
      - contracts/**
      - tiling/**
      - kernel/**
      - cross_layer/**
      - checks/**
      - summary/**
      - indexes/**
      - query/**
      - cbm/index_meta.json
    may_write:
      # Staging only (post-KB); parent/orchestrator merges — not free-form KB edits
      - ir/key_shape_resolve/**
      - query/**
  deterministic-extractors:
    may_read:
      - manifest.yaml
      - ir/**
      - runs/**
      - cbm/**
      - diff/**
      - summary/**
    may_write:
      - ir/**
      - tiling/**
      - kernel/**
      - cross_layer/**
      - diff/**
      - summary/**
      - checks/artifact_hashes.yaml
      - checks/confidence_gate.yaml
      - checks/integrity.yaml
  kb-compiler:
    may_read:
      - manifest.yaml
      - ir/**
      - contracts/**
      - tiling/**
      - kernel/**
      - cross_layer/**
      - checks/**
      - indexes/**
    may_write:
      - checks/final.yaml
      - checks/artifact_hashes.yaml
      - checks/integrity.yaml
      - indexes/kb_graph.sqlite
rules:
  - TestAgent may read KB artifacts but must not write UO KB or CBM data (use TG realization/ and contract/ outside UO_ROOT).
  - UO must not write contracts/**; testcase contracts are TG-owned at `.ascendc-agent/tg/contract/`.
  - TG must never write any file under `$UO_ROOT/**` (including ir/input_derivable*, key_shape_resolve, contracts/**); CSV↔HOST mapping lives only under `$OUT_ROOT`.
  - uo-query post-init: (a) TG bind MUST write only OUT_ROOT/realization/uo_query_resolve/** and TG --merge-uo-resolve never reads key_shape_resolve; (b) non-TG UO staging may write ir/key_shape_resolve/** and query/** — parent merges via apply_resolution; must not write tiling/kernel or other ir/* except that staging tree; must not put VAR_CSV_* into UO graph staging.
  - Build-time (/uo-init) must not dispatch uo-query as a substitute for KEY closure; input_derivable / complex KEY gaps use uo-key-resolve (triage then single/batch resolve). CBM is MAY, not required.
  - After KB is finalized, TG may read input_derivable_gaps as evidence and close KEY→CSV in OUT_ROOT via uo-key-resolve / uo-query patterns; that must not rewrite UO input_derivable classification files.
  - uo-semantic-resolve only emits entrypoint_confirm / extract_plan / resolution_patch; uo-key-resolve emits key_triage / input_derivable_patch / key_shape_resolve/**; apply_* / classify scripts merge whitelist fields.
  - uo-kb-review writes only review/kb_product_review.yaml; never modifies ir/**.
  - checks/confidence_gate.yaml and checks/integrity.yaml are written by orchestrator-invoked scripts (check_final_confidence / check_kb_integrity), not by LLM free-form.
  - PR test generation prefers diff/**; uncertain items look up the KB via kb_refs / kb_lookup.
  - indexes/kb_graph.sqlite is derived and may be rebuilt; YAML under ir/tiling/kernel remains source of truth.
  - /uo-code-review writes only review/** and runs/*/review/**; never overwrite diff/**.
  - Prefer summary/human_overview.md then kb_graph (list_templates / neighbors_of) before opening large YAML; do not rely on key_cards/**.
