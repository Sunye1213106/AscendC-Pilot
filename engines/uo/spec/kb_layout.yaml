version: 1
description: >-
  Active layered KB layout under <op_repo>/.ascendc-agent/uo/.
  This is the contract surface for /uo-init and /uo-update (not the retired facts/* tree).

roots:
  kb: .ascendc-agent/uo/

artifacts:
  - path: manifest.yaml
    role: revision + spec_bundle_hash + current_run
  - path: ir/**
    role: layered IR (host/kernel/bridge/operator_graph/entrypoints/unresolved); cold for Q&A
  - path: contracts/**
    role: >-
      retired (historical residue). UO must not write or rebuild this tree;
      testcase contracts live only under TG `.ascendc-agent/tg/contract/`.
      Ignore on read; never_default.
  - path: tiling/**
    role: >-
      tiling export views. exhaustive_key_space is summary-only (no cartesian
      template_blocks); legal template instances live as KTPL_* in kb_graph.
  - path: tiling/key_cards/**
    role: >-
      not a default product. Init/export do not write cards; agents follow
      kb_graph writes/derives/determined_by + source file_path instead.
  - path: kernel/**
    role: runtime variables / branches / conditions
  - path: cross_layer/**
    role: host↔kernel bridge views (impact_graph is never_default)
  - path: checks/**
    role: validate_kb outputs (final.yaml, integrity.yaml, confidence_gate.yaml) + artifact_hashes.yaml
  - path: checks/artifact_hashes.yaml
    role: canonical hashes for layered KB artifacts (single export path)
  - path: checks/confidence_gate.yaml
    role: final confidence gate (pass|reported|fail); written by check_final_confidence.py
  - path: checks/integrity.yaml
    role: KB integrity report; written by check_kb_integrity.py
  - path: ir/input_derivable.yaml
    role: per-KEY input_derivable classification (compact host_parent / derivation_roots)
  - path: ir/input_derivable_gaps.yaml
    role: open gaps for uo-key-resolve (after triage)
  - path: ir/input_derivable_patch.yaml
    role: LLM patch surface (uo-key-resolve); consumed by classify_input_derivable.py
  - path: ir/key_triage.yaml
    role: KEY complexity triage (complex|simple); written by tpl_key_triage; no closure
  - path: ir/key_shape_resolve/**
    role: KEY shape staging (init or post-KB); parent merges — not free-form KB edits
  - path: ir/tilingkey_space.yaml
    role: template_aliases + KEY dims; source of KTPL_* entities and fixes_flag edges
  - path: review/kb_product_review.yaml
    role: uo-kb-review verdict (init final gate)
  - path: runs/*/scope/**
    role: scope proposal / review / receipt
  - path: runs/*/update/**
    role: incremental update receipts
  - path: cbm/**
    role: index_stage + index_meta (not source of truth for Q&A)
  - path: diff/**
    role: /uo-update PR-facing product (read first)
  - path: summary/**
    role: update_plan + human_overview.md + keys_table.yaml
  - path: summary/human_overview.md
    role: human/AI orientation; preferred first read
  - path: indexes/kb_graph.sqlite
    role: >-
      Derived read-only semantic graph (entities/relations/aliases).
      Rebuild via export_kb_graph.py after /uo-init or /uo-update. Not YAML source of truth.
      Legal compile-time template instance count = number of KTPL_* entities.
  - path: review/**
    role: /uo-code-review reports (functional + bug); must not overwrite diff/**
  - path: query/**
    role: routes.yaml + terminology.yaml for uo-query (includes never_default)
  - path: runs/*/review/**
    role: review context_pack and run receipts

# Single materialization path (no lean/full profiles).
export:
  notes: >-
    kb_query_export writes layered views + artifact hashes; does not write
    contracts/** or key_cards/**. Template legality is KTPL_* + fixes_flag in sqlite.

diff_product:
  - diff/index.yaml
  - diff/change_set.yaml
  - diff/impact.yaml
  - diff/unresolved.yaml

review_product:
  - review/index.yaml
  - review/summary.md
  - review/functional_report.yaml
  - review/functional_report.md
  - review/bug_report.yaml
  - review/bug_report.md
  - review/kb_product_review.yaml

kb_graph:
  path: indexes/kb_graph.sqlite
  tables: [entities, relations, aliases, metadata]
  entity_kinds:
    - KernelTemplateArgument  # KTPL_*; one per legal template_alias
    - TilingKey               # KEY_*
  relation_types:
    - constrains
    - enables_branch
    - belongs_to_key
    - covers
    - maps_to_file
    - anchors_to_symbol
    - graph_edge
    - fixes_flag             # KTPL_* → KEY_* with fields_json.value
    - writes
    - derives
    - determined_by
    - reaches_input
    - selects
  query_patterns:
    - entity_of
    - neighbors_of
    - constraints_for
    - branches_for_key
    - entities_in_files
    - affected_shapes
    - list_templates         # all KTPL_*
    - templates_for_key      # KTPL that fixes_flag a KEY
