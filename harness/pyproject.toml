[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascendc-harness"
version = "0.1.0"
description = "Unified AscendC Agent Harness control plane for UO and TG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
ascendc-harness = "ascendc_harness.cli:main"
harness = "ascendc_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ascendc_harness*"]
