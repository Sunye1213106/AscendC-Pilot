id: ascendc-agent
version: 1
name_zh: AscendC primary control agent
role: producer
mode: primary
description: >-
  AscendC primary control agent. Tab-select this agent before /uo-init|/tg-init;
  default Build agent will skip harness.
read_scopes:
  - "*"
write_scopes:
  []
forbidden:
  - modify_harness_state
  - declare_workflow_passed
  - write_outside_declared_scope
tool_budget:
  max_calls: 12
