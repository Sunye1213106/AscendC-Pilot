# How to read a replay run's output.
#
# Two vocabularies meet here. The driver prints structured marks it is asked
# to print, and the tiling prints whatever its own OP_LOGD calls say -- which
# is where the interesting values are, and which no engine should have to
# recognise by name. Both land in the same four slots, so the engine reads
# slots and this file does the recognising.
version: 1

#: What the driver prints. Named groups are the interface: the engine reads
#: `case_id`, `ok`, `key`, `name`, `value` and knows nothing else.
marks:
  case:  '^###CASE (?P<case_id>\S+)'
  done:  '^###DONE (?P<case_id>\S+) ok=(?P<ok>\d+) key=(?P<key>\d+)'
  key:   '^###KEY (?P<key>\d+)'
  dim:   '^###DIM (?P<name>\w+)=(?P<value>-?\d+)'
  state: '^###STATE (?P<name>\w+)=(?P<value>-?\d+)'

#: What the tiling prints on its own. Until the driver emits ###DIM and
#: ###STATE for these, they are scraped out of the operator's log lines and
#: put into the same slots. Each scrape names the slot it fills, so removing
#: one when the driver learns to print it changes nothing downstream.
scrapes:
  #: The tiling logs every dimension it decided before it packs them. Decoding
  #: the key gives the same nineteen values, and this gives them one step
  #: earlier -- which is what tells a dimension that did not flip from one
  #: that flipped and was then overwritten.
  - into: dim
    when: ['GetTilingKey', 'splitAxis[']
    pairs: '(\w+)\s*=?\s*\[(-?\d+)\]'
    fields:
      - splitAxis
      - inputDtype
      - isTnd
      - dropValue
      - pseValue
      - attenMaskCfg
      - s1TemplateType
      - s2TemplateType
      - dTemplateType
      - isDeterministic
      - nEqual
      - isBn2MultiBlk
      - dNoEqual
      - hasRope
      - outDtype
      - isNzOut
      - isTndSwizzle
      - isRegbasePlatformValue

  #: The intermediates behind the dimensions that no input sets directly.
  #: Without these a failed probe says only that the dimension did not move,
  #: not which of the two thresholds it missed.
  #:
  #: No field list: whatever the tiling chose to print on this line is what
  #: there is to know about that decision, and naming a subset here would
  #: silently drop a value the next version of the operator starts logging.
  #: `report_state` below decides which of them widen the table.
  - into: state
    when: ['isExceedL2Cache']
    pairs: '(\w+)\s*=?\s*\[(-?\d+)\]'

  #: The five conditions sparseType is chosen from. The dimension itself is
  #: already recorded; these say which of the five moved when it changed,
  #: which is the difference between knowing a probe failed and knowing which
  #: threshold it missed. Printed as `name = value` rather than `name[value]`,
  #: which is why nothing collected them before this file existed.
  - into: state
    when: ['OpName:[GetSparseType]']
    pairs: '(\w+)\s*=\s*(-?\d+)'

  #: Whether the pre-softmax-grad pass runs at all, and over how many cores.
  - into: state
    when: ['OpName:[DoPreTiling]']
    pairs: '(\w+)\s*=\s*(-?\d+)'

  #: The pre-softmax-grad block's own sizing. It mixes `=` and `is` for the
  #: same kind of fact, so both are read.
  - into: state
    when: ['OpName:[DoPreSfmgTiling]']
    pairs: '(\w+)\s*(?:=|is)\s*(-?\d+)'

  #: One line per batch index, from
  #: `OP_LOGD("Sparse", " idx = %ld: Begin = %ld, End = %ld, ...")`.
  #: Unlike everything above this is a series rather than a value, and it is
  #: the only per-sample evidence the run produces: a loop-summary claim about
  #: what the sparse parse did to each batch is checkable against it, and is
  #: otherwise only checkable in aggregate.
  - into: series
    name: sparse_parse_info
    when: ['Sparse', 'idx =']
    each: 'idx = (?P<idx>-?\d+): Begin = (?P<begin>-?\d+), End = (?P<end>-?\d+)'

#: Why the tiling refused, when it did. The host writes its own diagnostics
#: before the operator name; everything after it is the reason.
reject:
  when: ['[ERROR]']
  after: 'OpName:'
  limit: 160

#: Which state values earn their own column in the wide table. A state not
#: listed is still parsed and still reaches the searcher; it just does not
#: widen every row.
report_state: [isExceedL2Cache, enableSwizzle, sparseType]
