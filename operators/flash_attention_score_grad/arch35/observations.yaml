# Host state the tiling logs, and which variable each observation fills.
#
# Unlike bridge_spec.yaml this file is written by hand, because what it holds
# cannot be derived: "the log printed isTnd=1" is a fact, and "so layoutType
# is INPUT_FORMAT_TND" is a reading of that fact. Only a person who has read
# the tiling can say the second part.
#
# What is *not* written by hand is any number. Constants are named, and the
# export resolves each name against the constexprs it found in the operator's
# headers. A transcribed 4 would be wrong the day the header renumbers and
# nothing would notice; a name that no longer resolves fails the export.
#
# `withheld_from` is the honesty clause. Filling VAR_TDF_SPLITAXIS from the
# logged SplitAxis and then "predicting" SplitAxis proves nothing -- the
# answer was the question. Using it to predict IsNzOut, which reads the same
# field, is a real check. So each observation records which dimension it came
# from and is withheld when that dimension is the one being predicted.
version: 1
observations:
  - variable: VAR_TDF_FBASEPARAMS_LAYOUTTYPE
    column: isTnd
    withheld_from: IsTnd
    reading: boolean_constant
    when_true: INPUT_FORMAT_TND
    when_false: INPUT_FORMAT_BS2N2GD
    note: >
      The tiling logs the boolean it derived, and the dimension asks for TND
      specifically. A true one settles it. A false one says the layout is not
      TND as the tiling used it, which is not the same as the attr's value:
      SupportTrans2BS2N2GD rewrites a TND layout to BS2N2GD when the
      sequences allow, and the attr still reads TND. Reading the attr back
      would resurrect the value the boolean just ruled out.

  - variable: VAR_TDF_SPLITAXIS
    column: splitAxis
    withheld_from: SplitAxis
    reading: integer

  - variable: VAR_TDF_FBASEPARAMS_ISDETERMINISTIC
    column: isDeterministic
    withheld_from: DeterType
    reading: boolean

  - variable: VAR_AUX_FBASEPARAMS_ISDETERMINISTIC
    column: isDeterministic
    withheld_from: DeterType
    reading: boolean
