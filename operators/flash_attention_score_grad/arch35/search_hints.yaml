# Which generators to use when a dimension cannot be set by writing one
# Binding from bridge_spec. The reverse map covers attrs / presence / axes;
# everything below is a Case construction that spans several fields at once.
version: 1

# Dimensions with no writable Binding (tiling state). Candidates come from a
# compensation grid over sizes, not from a knob.
host_state_dims: [SplitAxis, IsBn2MultiBlk, IsNzOut]

# Dimensions whose own size is the knob; compensating on s1/s2 would fight them.
no_compensation: [SplitAxis, IsBn2MultiBlk, IsNzOut, S1TemplateNum, S2TemplateNum]

special_generators:
  IsPse:
    generator: pse
  IsDrop:
    generator: keep_prob
  IsRope:
    generator: rope
  IsAttenMask:
    generator: atten_mask
  IsTnd:
    generator: tnd_layout
  DTemplateNum:
    generator: d_ladder
  IsDNoEqual:
    generator: d1_pair
  S1TemplateNum:
    generator: s1_ladder
  S2TemplateNum:
    generator: s2_ladder
  InputDType:
    generator: input_dtype
  OutDType:
    generator: out_dtype
  DeterType:
    generator: deter_sparse

ladders:
  d: [64, 72, 96, 128, 192, 256, 512, 768]
  d1_on: [16, 32, 64, 96, 128]

input_dtype_codes:
  "1": FLOAT
  "2": BF16
  "3": FLOAT16

deter_sparse_modes: [0, 2, 3, 5]

# Binding reverse-map without engine if-ladders (obligations._binding_named).
named_bindings:
  IsPse:
    kind: presence
    var: VAR_OPT_PSE_SHIFT
    tensor: pse_shift
    on_field: pse_shape
    on_values_attr: PSE_SHAPES
  IsDrop:
    kind: presence
    var: VAR_OPT_DROP_MASK
    tensor: drop_mask
  IsRope:
    kind: presence
    var: VAR_OPT_QUERY_ROPE_IDX
    tensor: query_rope
  IsAttenMask:
    kind: presence
    var: VAR_OPT_ATTEN_MASK
    tensor: atten_mask
    on_field: atten_mask
    on_values_attr: ATTEN_MASKS
  InputDType:
    kind: dtype
    var: VAR_DTYPE_QUERY
    root: INPUT_DTYPE
    operand: query
    codes_key: input_dtype_codes
  OutDType:
    kind: case_field
    field: out_dtype
    cast: int
  IsDNoEqual:
    kind: d1_pair
  S1TemplateNum:
    kind: ladder
    field: s1
    mode: template
  S2TemplateNum:
    kind: ladder
    field: s2
    mode: s2
  DTemplateNum:
    kind: ladder
    field: d
    mode: d
  IsNEqual:
    kind: group_equal
    on: {g: 1}
    off: {g: 2, n2: max1}

compensation:
  s1_s2:
    cap: 8192
  grid_host_state:
    max_per_key: 12

# Directed-search sampling envelope (closure/generate.py).
sampling_grid:
  layout: [SBH, BSH, BNSD, BSND, TND]
  dtype: [FLOAT16, BF16, FLOAT]
  b: [1, 2, 3, 4, 8, 16, 32, 48, 64]
  s1: [1, 64, 128, 192, 256, 512, 768, 1024, 2048, 4096]
  s2: [1, 64, 128, 192, 256, 512, 768, 1024, 2048, 4096]
  n2: [1, 2, 4, 5, 8, 12, 16, 40]
  g: [1, 2, 4, 8]
  d: [16, 32, 64, 72, 96, 128, 144, 192, 256, 512, 768]
  pse_type: [0, 1, 2, 3]
  keep_prob: [1.0, 0.9, 0.5]
  sparse_mode: [0, 1, 2, 3, 4, 5, 6]
  tokens: [0, 1, 64, 128, 256, 512, 1024, 2048, 65536]
  out_dtype: [0, 1, 2, 3]

# Residual distance-1 sweeps (closure/generate.sweep_nearest).
nearest_knobs:
  DTemplateNum:
    - {knob: d, values: [64, 128, 192, 256, 512]}
  IsDrop:
    - {knob: keep_prob, values: [1.0, 0.5]}
  IsAttenMask:
    - {knob: atten_mask, values: [none, ss, bnss, b1ss, 11ss]}
  DeterType:
    - {knob: deterministic, values: [0, 1]}
    - {knob: sparse_mode, values: [0, 1, 2, 3, 4, 5, 6]}
  IsPse:
    - {knob: pse, values: [true, false]}
  IsRope:
    - {knob: rope, values: [true, false]}
  InputDType:
    - {knob: dtype, values: [FLOAT16, BF16, FLOAT]}
  IsNEqual:
    - {knob: g, values: [1, 2, 4]}
