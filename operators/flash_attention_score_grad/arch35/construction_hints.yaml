# Construction tables for FlashAttentionScoreGrad arch35.
# Consumed by testcase_agent.closure.construct — not by the host driver.
version: 1

dtype_dim: InputDType
out_dtype_dim: OutDType

dtype:
  "1": FLOAT
  "2": BF16
  "3": FLOAT16

d_for:
  "64": [64, 63]
  "128": [128, 96, 72]
  "192": [192, 160]
  "256": [256, 224]
  "768": [320, 512, 384, 768]

# Each entry is [deterministic, sparse_mode]
deter_for:
  "0": [[0, 0], [0, 2], [0, 3]]
  "1": [[1, 6], [1, 5]]
  "2": [[1, 0], [1, 1], [1, 4]]
  "3": [[1, 2]]
  "4": [[1, 3]]

s1_for:
  "128": [1024, 2048, 512, 256]
  "64": [256, 2048, 1024]
  "0": [0]

masks: [ss, bnss, b1ss, 11ss]

require:
  IsRegbase: "1"
  IsEmptyTensor: "0"

defaults:
  layout: BSND
  b: 2
  n2: 2
  g: 2
  pse_shape: bnss
  pse_type: 1
  pre_tokens: 65536
  next_tokens: 65536
  out_dtype: 0

rope_d_templates: ["192"]

loops:
  - {table: d_for, dim: DTemplateNum, knob: d}
  - {table: s1_for, dim: S1TemplateNum, knob: s1, default: [1024]}
  - {table: deter_for, dim: DeterType, pair_knobs: [deterministic, sparse_mode], default: [[0, 0]]}
  - {table: masks, dim: IsAttenMask, when: "1", knob: atten_mask, else_value: [none]}

bool_knobs:
  IsRope: {knob: rope, on: true, off: false}
  IsPse: {knob: pse, on: true, off: false}
  IsDrop: {knob: keep_prob, on: 0.5, off: 1.0}
  IsNEqual: {knob: g, on: 1, off_default: 2}
  IsTnd: {knob: layout, on: TND, off_from_defaults: layout}

post:
  - {kind: skip_unless, when_knob: rope, dim: DTemplateNum, in: ["192"]}
  - {kind: d1_split, dim: IsDNoEqual, equal: "0"}
  - {kind: s2_from_s1, dim: S2TemplateNum, match: "128", then: 1024, else: s1}

derived:
  - when: {IsTnd: "1"}
    set: {layout: TND, pse_shape: slope, pse_type: 2}
  - when: {IsRope: "1"}
    set: {d1: null}
