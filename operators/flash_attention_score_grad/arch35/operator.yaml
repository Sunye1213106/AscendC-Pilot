# Everything about FlashAttentionScoreGrad on arch35 that the replay engine
# would otherwise have to know by name.
#
# The engine reads this and nothing else about the operator. Anything that has
# to be spelled here rather than derived is a boundary that is not clean yet,
# so the list is meant to shrink: P3 moves the variable bindings out of
# bridge.py into bridge_spec.yaml, P4 moves the shape semantics, P5 the search
# hints. What stays for good is the part that is genuinely a choice -- where
# the sources live, which machine runs the driver.
version: 1

operator:
  name: flash_attention_score_grad
  #: Where the operator sits inside the ops checkout. Resolved against
  #: ops_root by uo_init.paths, so it is a relative path and never absolute.
  path: attention/flash_attention_score_grad
  arch: arch35

sources:
  #: The header that declares how the key packs its dimensions. `{op}` and
  #: `{arch}` expand from the operator block above.
  tiling_key_header: op_kernel/{arch}/{op}_template_tiling_key.h

replay:
  #: Which machine runs the built driver. This block is about the developer's
  #: setup rather than the operator, which is why every entry can be
  #: overridden from the environment: a distribution registered by
  #: `wsl --install` carries a dot in its name, an imported tarball carries
  #: whatever it was imported as, and the driver lives wherever it was built.
  host: wsl
  distro: Ubuntu-22.04
  entry: /work/wsl/setup/run_replay.sh
  #: Printed by the driver once a batch is complete. Its absence is how an
  #: empty run is told from a finished one that produced nothing.
  done_marker: BATCH_DONE
  #: Environment variables that override the three above, in that order.
  overrides:
    distro: UO_REPLAY_DISTRO
    entry: UO_REPLAY_SCRIPT
    tiling_key_header: UO_REPLAY_TPL

artifacts:
  #: Relative to ``<op_src>/.ascendc-pilot/<arch>/``. Batches, logs and
  #: snapshots for this operator live here and nowhere else.
  cache: tg/replay
  #: Wide tables that record a run. Operator-agnostic so a second package
  #: does not need a fag_ prefix to be found.
  wide_glob: "*key_cases*.csv"

#: How to read what the run printed. Kept separate because it changes when the
#: operator's logging changes, which is far more often than any of the above.
log_protocol: log_protocol.yaml
