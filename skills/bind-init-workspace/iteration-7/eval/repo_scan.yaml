test_script_root: d:\PR-review\pr_workspace\.ascendc-harness\gitcode.com--coder_linx--fag_debug_tools
inventory:
  schema: tg-test-repo-inventory/v1
  kind: script_repo
  root: D:\PR-review\pr_workspace\.ascendc-harness\gitcode.com--coder_linx--fag_debug_tools
  entries:
  - path: run_fag.py
    is_entry: true
    relative_import: false
    imports:
    - fag_test.main
  - path: fag_test/main.py
    is_entry: true
    relative_import: true
    imports:
    - argparse
    - config
    - datetime
    - os
    - runner
    - shutil
    - test_utils
    - torch
    - tqdm
    - traceback
  - path: fag_test/show_prof.py
    is_entry: true
    relative_import: false
    imports:
    - argparse
    - csv
    - glob
    - os
    - re
    - shutil
    - sys
    - time
  flags:
  - path: fag_test/main.py
    flag: --data
    dest: ''
    help: 自定义测试数据路径 --data ./auto_input
    takes_value: true
    choices: []
  - path: fag_test/main.py
    flag: --cache-data
    dest: ''
    help: 使用已生成的golden数据测试
    takes_value: false
    choices: []
  - path: fag_test/main.py
    flag: --backend
    dest: ''
    help: '[当前未接线] backend参数, 历史 ascendc tool 路径使用'
    takes_value: true
    choices: []
  - path: fag_test/main.py
    flag: --no-tiling
    dest: ''
    help: '[当前未接线] 只测试不产生数据'
    takes_value: false
    choices: []
  - path: fag_test/main.py
    flag: --case
    dest: ''
    help: 自定义测试文件 --case ./data/FASG_merged.xls
    takes_value: true
    choices: []
  - path: fag_test/main.py
    flag: --pta
    dest: ''
    help: '[当前未接线] 历史开关, 现统一走 pta 路径'
    takes_value: false
    choices: []
  - path: fag_test/main.py
    flag: --pta_mode
    dest: ''
    help: pta运行模式,"auto_grad"自动反向，"only_grad"单反向，"profiler"单反向性能
    takes_value: true
    choices: []
  - path: fag_test/main.py
    flag: --start-from
    dest: ''
    help: 根据xls文件, 从上至下指定起始用例. --start-from 1
    takes_value: true
    choices: []
  - path: fag_test/main.py
    flag: --end-at
    dest: ''
    help: 指定结束用例
    takes_value: true
    choices: []
  - path: fag_test/main.py
    flag: --device
    dest: ''
    help: 使用device的编号。--device 0
    takes_value: true
    choices: []
  - path: fag_test/main.py
    flag: --sheet
    dest: ''
    help: 使用sheet参数。--sheet Sheet1
    takes_value: true
    choices: []
  - path: fag_test/main.py
    flag: --old-data
    dest: ''
    help: 使用过去的数据BNSD输出, maxsum都没有对齐
    takes_value: false
    choices: []
  - path: fag_test/main.py
    flag: --only_input_golden
    dest: ''
    help: 仅生成输入golden
    takes_value: false
    choices: []
  - path: fag_test/main.py
    flag: --no-save-golden
    dest: ''
    help: golden数据仅在内存中传递，不落盘
    takes_value: false
    choices: []
  - path: fag_test/main.py
    flag: --flash-golden
    dest: ''
    help: golden按flash模式生成(128x128块切分matmul+online softmax)
    takes_value: false
    choices: []
  - path: fag_test/main.py
    flag: --golden-only
    dest: ''
    help: 仅生成golden数据，不调用pta_test(无需NPU环境)
    takes_value: false
    choices: []
  - path: fag_test/main.py
    flag: --casename
    dest: ''
    help: 指定运行的用例名称，多个用逗号分隔。--casename xxx,yyy,zzz
    takes_value: true
    choices: []
  - path: fag_test/show_prof.py
    flag: --all
    dest: ''
    help: 显示所有 CSV（默认只显示最新一个）
    takes_value: false
    choices: []
  - path: fag_test/show_prof.py
    flag: --wait
    dest: ''
    help: CSV 不存在时轮询等待的秒数（profiler 异步生成场景）
    takes_value: true
    choices: []
