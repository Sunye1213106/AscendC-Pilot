mapping:
  Testcase_Name:
    role: script_meta
    uo_id: ''
    encoding: 用例标识名，不进调用
    evidence: fag_test/test_utils.py:414
  Enable:
    role: script_meta
    uo_id: ''
    encoding: Enable/Disable 是否跑该行
    evidence: fag_test/test_utils.py:454
  Dtype:
    role: api_arg
    uo_id: InputDType
    encoding: fp16/bf16/fp32 输入张量 dtype，列即 InputDType 模板维开关
    evidence: fag_test/runner.py:50
  out_dtype:
    role: api_arg
    uo_id: OutDType
    encoding: golden attention_out 张量 dtype，cast 到 pttype 后作 attention_in
    evidence: fag_test/runner.py:57
  Input_Layout:
    role: api_arg
    uo_id: inputLayout
    encoding: BSH/SBH/BNSD/BSND/TND，input_layout 关键字 + 张量布局
    evidence: op_host/arch35/flash_attention_score_grad_tiling_common_regbase.cpp:1024
  B:
    role: api_arg
    uo_id: b
    encoding: batch 维，构造 q/k/v/dx/atten_mask 张量形状
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:105
  N1:
    role: api_arg
    uo_id: headNum
    encoding: query head 数，head_num 位置实参（具名实参赢过形状，无 n1 字段）
    evidence: op_host/arch35/flash_attention_score_grad_tiling_normal_regbase.cpp:244
  N2:
    role: api_arg
    uo_id: n2
    encoding: kv head 数，构造 k/v 张量形状
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:106
  S1:
    role: api_arg
    uo_id: s1
    encoding: query seq len，构造 q/dx 张量形状；TND 下取 actual_seq_qlen 最大值
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:108
  S2:
    role: api_arg
    uo_id: s2
    encoding: kv seq len，构造 k/v 张量形状；TND 下取 actual_seq_kvlen 最大值
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:109
  D:
    role: api_arg
    uo_id: scaleValue
    encoding: head dim，scale_value=1/sqrt(D)（具名实参赢过形状 d）
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:112
  D_V:
    role: api_arg
    uo_id: d1
    encoding: v head dim，构造 v/dx 张量形状
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:111
  Drop_Out_Possibility:
    role: api_arg
    uo_id: keepProb
    encoding: keep_prob 关键字，1.0 表示无 dropout
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:113
  Pre_Tockens:
    role: api_arg
    uo_id: preTokens
    encoding: pre_tokens 关键字，空值默认 65536
    evidence: op_kernel/arch35/attenmask_arch35.h:47
  Next_Tockens:
    role: api_arg
    uo_id: nextTokens
    encoding: next_tokens 关键字，空值默认 65536
    evidence: op_kernel/arch35/attenmask_arch35.h:48
  Atten_mask_dtype:
    role: api_arg
    uo_id: ''
    encoding: atten_mask 张量 dtype（全 bool），无单一 tiling 字段，运行期 AttenDataType 推断
    evidence: fag_test/test_utils.py:450
  Atten_mask_shape:
    role: api_arg
    uo_id: attenMaskShapeType
    encoding: NONE/SS/B1SS/11SS/BNSS，构造 atten_mask 张量形状
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:128
  sparse_mode:
    role: api_arg
    uo_id: sparseMode
    encoding: 0-6 稀疏掩码模式关键字
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:129
  PSE_type:
    role: api_arg
    uo_id: pseType
    encoding: 0-3 pse_type 关键字 + 构造 pse 张量
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:122
  PSE_shape:
    role: api_arg
    uo_id: pseShapeType
    encoding: BNSS/N/BN/BN1S/1NSS/BNHS/1NHS，构造 pse 张量形状
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:123
  seqlens_list_q:
    role: api_arg
    uo_id: ''
    encoding: TND 变长 query 段长列表，参与 numels 与 actual_seq_qlen 派生
    evidence: fag_test/test_utils.py:539
  seqlens_list_kv:
    role: api_arg
    uo_id: ''
    encoding: TND 变长 kv 段长列表，参与 numels 与 actual_seq_kvlen 派生
    evidence: fag_test/test_utils.py:542
  cu_seqlens_q:
    role: api_arg
    uo_id: ''
    encoding: TND query 前缀和，actual_seq_qlen 关键字来源（本 CSV 全空，由 seqlens_list_q 派生）
    evidence: fag_test/test_utils.py:539
  cu_seqlens_kv:
    role: api_arg
    uo_id: ''
    encoding: TND kv 前缀和，actual_seq_kvlen 关键字来源（本 CSV 全空，由 seqlens_list_kv 派生）
    evidence: fag_test/test_utils.py:542
  eod:
    role: api_arg
    uo_id: ''
    encoding: TND 尾部 padding token 数，trim B 与 seqlens，无单一 tiling 字段
    evidence: fag_test/test_utils.py:469
  same_as_input:
    role: api_arg
    uo_id: tndMaxSumLayout
    encoding: 1→softmax_layout="TND"，0→空串
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:121
  seed:
    role: api_arg
    uo_id: seed
    encoding: dropout seed 关键字（全 2）
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:117
  offset:
    role: api_arg
    uo_id: offset
    encoding: dropout offset 关键字（全 0）
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:118
  is_deter:
    role: feature
    uo_id: DeterType
    encoding: true/false 设置 ctx.deterministic，影响 golden 确定性，不进调用
    evidence: fag_test/main.py:89
  rope:
    role: api_arg
    uo_id: IsRope
    encoding: 0/1 门控 query_rope/key_rope 张量与关键字，列即 IsRope 模板维开关
    evidence: op_kernel/arch35/flash_attention_score_grad_entry_regbase.h:201
  inner_drop:
    role: feature
    uo_id: ''
    encoding: 0/1 门控 drop_mask 输入张量生成，不进 grad 调用
    evidence: fag_test/test_utils.py:462
  is_sink:
    role: api_arg
    uo_id: sinkOptional
    encoding: 0/1 门控 sink 张量与 sink 关键字
    evidence: op_kernel/arch35/flash_attention_score_grad_tiling_data_regbase.h:132
  prefix:
    role: api_arg
    uo_id: ''
    encoding: prefix 关键字（List[int]）；本 CSV 全空，runner 用 np.random.randint 生成
    evidence: fag_test/test_utils.py:465
  Actual_dq_pricision:
    role: result_sink
    uo_id: ''
    encoding: dq 精度结果列
    evidence: fag_test/main.py:60
  Actual_dk_pricision:
    role: result_sink
    uo_id: ''
    encoding: dk 精度结果列
    evidence: fag_test/main.py:60
  Actual_dv_pricision:
    role: result_sink
    uo_id: ''
    encoding: dv 精度结果列
    evidence: fag_test/main.py:60
  Actual_kernel_time_backward:
    role: result_sink
    uo_id: ''
    encoding: 反向 kernel 耗时结果列
    evidence: fag_test/main.py:60
  Actual_dq_Md5sum:
    role: result_sink
    uo_id: ''
    encoding: dq md5 结果列
    evidence: fag_test/main.py:60
  Actual_dk_Md5sum:
    role: result_sink
    uo_id: ''
    encoding: dk md5 结果列
    evidence: fag_test/main.py:60
  Actual_dv_Md5sum:
    role: result_sink
    uo_id: ''
    encoding: dv md5 结果列
    evidence: fag_test/main.py:60
