    api_arg。
- code: literal_arg
  detail: 'padding_mask=None、softmax_in=None、inner_precise=0 为调用内字面量；numels 为派生公式（TND:
    (seqlens_list_q*seqlens_list_kv).sum()*Nq，非 TND: B*Nq*S*Skv）。均无 CSV 列。'
