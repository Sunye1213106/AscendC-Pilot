findings:
  - code: partial_mapping
    column: Dtype
    detail: 输入 dtype 无同名 tiling 字段；InputDType 为开关维，非 dtype 列身份
  - code: partial_mapping
    column: out_dtype
    detail: 输出 dtype 无同名 tiling 字段；OutDType 为开关维
  - code: partial_mapping
    column: N1
    detail: Q head 数无 n1/headNum 字段，n1 由 n2*g 派生
  - code: partial_mapping
    column: Atten_mask_dtype
    detail: mask dtype 无同名字段；IsAttenMask 为开关维
  - code: partial_mapping
    column: cu_seqlens_q
    detail: cu 累积形式替代 seqlens_list_q，无独立字段，不与 seqlens_list_q 共用 uo_id
  - code: partial_mapping
    column: cu_seqlens_kv
    detail: cu 累积形式替代 seqlens_list_kv，无独立字段
  - code: test_harness_gap
    detail: padding_mask 硬编码 None、softmax_in 硬编码 None、inner_precise 硬编码 0，无 CSV 列控制
  - code: test_harness_gap
    detail: scale_value=1/sqrt(D) 现场公式、numels 由 seqlens 派生，source_column 留空
