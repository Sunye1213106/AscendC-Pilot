mapping:
  Testcase_Name:
    role: script_meta
    uo_id: ''
    evidence: fag_test/main.py:69
    encoding: 用例名，casename 过滤与结果落盘键
  Enable:
    role: script_meta
    uo_id: ''
    evidence: fag_test/main.py:85
    encoding: Enable/Disable，跳过 Disable 行
  Dtype:
    role: api_arg
    uo_id: ''
    evidence: fag_test/runner.py:333
    encoding: 输入 dtype(fp16/bf16/fp32)，塑造 query/key/value 张量
  out_dtype:
    role: api_arg
    uo_id: ''
    evidence: fag_test/runner.py:333
    encoding: 输出 dtype，落进 dq/dk/dv
  Input_Layout:
    role: api_arg
    uo_id: layout
    evidence: fag_test/runner.py:333
    encoding: 布局 BNSD/BSND/BSH/SBH/TND，input_layout kwarg
  B:
    role: api_arg
    uo_id: b
    evidence: fag_test/runner.py:333
    encoding: batch 维，塑造全部张量
  N1:
    role: api_arg
    uo_id: ''
    evidence: fag_test/runner.py:333
    encoding: Q head 数，head_num 位置实参
  N2:
    role: api_arg
    uo_id: n2
    evidence: fag_test/runner.py:333
    encoding: KV head 数，塑造 key/value
  S1:
    role: api_arg
    uo_id: s1
    evidence: fag_test/runner.py:333
    encoding: Q 序列长，塑造 query/dy
  S2:
    role: api_arg
    uo_id: s2
    evidence: fag_test/runner.py:333
    encoding: KV 序列长，塑造 key/value
  D:
    role: api_arg
    uo_id: d
    evidence: fag_test/runner.py:333
    encoding: Q/K head 维，塑造 query/key；scale_value=1/sqrt(D)
  D_V:
    role: api_arg
    uo_id: d1
    evidence: fag_test/runner.py:333
    encoding: V head 维，塑造 value/dy
  Drop_Out_Possibility:
    role: api_arg
    uo_id: keepProb
    evidence: fag_test/runner.py:333
    encoding: keep_prob kwarg
  Pre_Tockens:
    role: api_arg
    uo_id: pre_tokens
    evidence: fag_test/runner.py:333
    encoding: pre_tokens kwarg，前向窗口 token 数
  Next_Tockens:
    role: api_arg
    uo_id: next_tokens
    evidence: fag_test/runner.py:333
    encoding: next_tokens kwarg，后向窗口 token 数
  Atten_mask_dtype:
    role: api_arg
    uo_id: ''
    evidence: fag_test/runner.py:333
    encoding: mask dtype(bool)，塑造 atten_mask 张量
  Atten_mask_shape:
    role: api_arg
    uo_id: attenMaskShapeType
    evidence: fag_test/runner.py:333
    encoding: mask 形状 SS/B1SS/BNSS/NONE
  sparse_mode:
    role: api_arg
    uo_id: sparseMode
    evidence: fag_test/runner.py:333
    encoding: sparse_mode kwarg(0-6)
  PSE_type:
    role: api_arg
    uo_id: pseType
    evidence: fag_test/runner.py:333
    encoding: pse_type kwarg(0-3)
  PSE_shape:
    role: api_arg
    uo_id: pseShapeType
    evidence: fag_test/runner.py:333
    encoding: pse 形状，塑造 pse 张量
  seqlens_list_q:
    role: api_arg
    uo_id: actual_seq_qlen
    evidence: fag_test/runner.py:333
    encoding: TND 变长 Q 序列，cumsum 后进 actual_seq_qlen kwarg
  seqlens_list_kv:
    role: api_arg
    uo_id: actual_seq_kvlen
    evidence: fag_test/runner.py:333
    encoding: TND 变长 KV 序列，cumsum 后进 actual_seq_kvlen kwarg
  cu_seqlens_q:
    role: api_arg
    uo_id: ''
    evidence: fag_test/test_utils.py:539
    encoding: cu 累积形式，替代 seqlens_list_q 进 actual_seq_qlen
  cu_seqlens_kv:
    role: api_arg
    uo_id: ''
    evidence: fag_test/test_utils.py:542
    encoding: cu 累积形式，替代 seqlens_list_kv 进 actual_seq_kvlen
  eod:
    role: feature
    uo_id: ''
    evidence: fag_test/test_utils.py:472
    encoding: TND 末尾无效 batch，改写 B(real_b=origin_B-eod) 与 seqlens
  same_as_input:
    role: api_arg
    uo_id: softmax_layout
    evidence: fag_test/runner.py:333
    encoding: softmax_layout kwarg，same_as_input==1 时为 TND
  seed:
    role: api_arg
    uo_id: seed
    evidence: fag_test/runner.py:333
    encoding: seed kwarg
  offset:
    role: api_arg
    uo_id: offset
    evidence: fag_test/runner.py:333
    encoding: offset kwarg
  is_deter:
    role: feature
    uo_id: ''
    evidence: fag_test/main.py:89
    encoding: 只切 torch.use_deterministic_algorithms，非调用实参
  rope:
    role: api_arg
    uo_id: isRope
    evidence: fag_test/runner.py:333
    encoding: rope 开关，控制 query_rope/key_rope 与 D/D_V 拆分
  inner_drop:
    role: feature
    uo_id: ''
    evidence: fag_test/test_utils.py:275
    encoding: inner dropout，只改 drop_mask 输入生成，非调用实参
  is_sink:
    role: api_arg
    uo_id: sinkOptional
    evidence: fag_test/runner.py:333
    encoding: sink 开关，控制 sink kwarg 是否传入
  prefix:
    role: api_arg
    uo_id: prefix
    evidence: fag_test/runner.py:333
    encoding: prefix kwarg，sparse_mode 5/6 时传入
  Actual_dq_pricision:
    role: result_sink
    uo_id: ''
    evidence: fag_test/runner.py:577
    encoding: dq 精度实测落盘
  Actual_dk_pricision:
    role: result_sink
    uo_id: ''
    evidence: fag_test/runner.py:578
    encoding: dk 精度实测落盘
  Actual_dv_pricision:
    role: result_sink
    uo_id: ''
    evidence: fag_test/runner.py:579
    encoding: dv 精度实测落盘
  Actual_kernel_time_backward:
    role: result_sink
    uo_id: ''
    evidence: fag_test/runner.py:580
    encoding: 反向核时实测落盘
  Actual_dq_Md5sum:
    role: result_sink
    uo_id: ''
    evidence: fag_test/runner.py:589
    encoding: dq md5 实测落盘
  Actual_dk_Md5sum:
    role: result_sink
    uo_id: ''
    evidence: fag_test/runner.py:590
    encoding: dk md5 实测落盘
  Actual_dv_Md5sum:
    role: result_sink
    uo_id: ''
    evidence: fag_test/runner.py:591
    encoding: dv md5 实测落盘
