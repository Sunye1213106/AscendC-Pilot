# provenance: FAG arch35 已通过实例。结构可照抄，数值不可搬。
# 可泛化：一个维度值 → 多个候选拼法，最可能的放前面；
# 一个 Key 维度可由两个旋钮组合决定（如下 deter_for）。
version: 1
dtype:
  "1": DTYPE_A
  "2": DTYPE_B
d_for:
  "64": [64, 63]
  "128": [128, 96]
# 每项是 [knob_a, knob_b] 组合，不是单旋钮
deter_for:
  "0": [[0, 0], [0, 2]]
  "1": [[1, 6], [1, 5]]
s1_for:
  "128": [1024, 512]
  "64": [256, 1024]
masks: [shape_a, shape_b]
