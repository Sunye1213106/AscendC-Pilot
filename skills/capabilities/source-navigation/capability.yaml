id: source-navigation
version: 1
name_zh: 源码与 UO 图导航
description: 在已确认范围内使用 UO 图查询和有界源码窗口取得可复核证据。
applies_when:
  - 需要理解函数、变量、分支或调用关系
  - KB 只能定位但不能回答具体实现
  - 需要为语义结论补充源码证据
requires:
  inputs: [target_symbols, topic]
  tools: [uo-query, readonly-source-search]
  context: [source_revision, known_file_paths]
produces: [code_evidence, relevant_symbols, unresolved_questions]
compatible_roles: [producer, readonly_analyst, referee]
policies: [source-authority, code-access, evidence, language]
method_file: METHOD.md
